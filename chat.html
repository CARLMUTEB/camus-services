<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAMU SERVICES — Discussions</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f8f9fa;
      color: #222;
      padding-bottom: 80px;
    }

    /* Header */
    .top-header {
      background: #111111;
      color: #ffffff;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 60px;
    }

    .top-header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header-btn {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Discussion List */
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      background: #fff;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: inherit;
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d32f2f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 700;
      color: #111;
    }

    .chat-time {
      font-size: 10px;
      color: #888;
    }

    .chat-last-msg {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background: #d32f2f;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: #ffffff; border-top: 1px solid #eee;
      display: flex; justify-content: space-around;
      padding: 8px 0; z-index: 1000; height: 65px;
    }

    .bottom-nav a {
      text-align: center; color: #666; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 25%; text-decoration: none;
    }

    .bottom-nav a.active { color: #d32f2f; }
    .bottom-nav i { font-size: 19px; margin-bottom: 3px; }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="index.html" class="header-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Discussions</h1>
    <div style="width: 18px;"></div>
  </header>

  <main class="container">
    
    <!-- Discussion Item 1 -->
    <a href="https://wa.me/243976993469" class="chat-item">
      <div class="chat-avatar">CM</div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">Carl Muteb</span>
          <span class="chat-time">10:42</span>
        </div>
        <div class="chat-last-msg">Bonjour, le service d'installation électrique est toujours disponible ?</div>
      </div>
      <span class="unread-badge">1</span>
    </a>

    <!-- Discussion Item 2 -->
    <a href="https://wa.me/243976993469" class="chat-item">
      <div class="chat-avatar" style="background-color: #111;">CS</div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">Support CAMU SERVICES</span>
          <span class="chat-time">Hier</span>
        </div>
        <div class="chat-last-msg">Bienvenue sur CAMU SERVICES ! N'hésitez pas si vous avez des questions.</div>
      </div>
    </a>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Accueil</span>
    </a>
    <a href="publier.html">
      <i class="fa-solid fa-circle-plus"></i>
      <span>Publier</span>
    </a>
    <a href="chat.html" class="active">
      <i class="fa-solid fa-comments"></i>
      <span>Chat</span>
    </a>
    <a href="profil.html">
      <i class="fa-solid fa-user"></i>
      <span>Profil</span>
    </a>
  </nav>

</body>
</html>
