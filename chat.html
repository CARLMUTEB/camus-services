<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - CAMU</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-box{height:70vh;overflow-y:auto;background:white;border-radius:10px;padding:10px;margin-bottom:10px}
    .msg{padding:8px 12px;border-radius:15px;margin:5px 0;max-width:70%}
    .moi{background:#d32f2f;color:white;margin-left:auto}
    .lui{background:#eee;margin-right:auto}
    .chat-input{display:flex;gap:5px}
    .chat-input input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px}
  </style>
</head>
<body>
  <header class="top-bar"><a href="index.html"><i class="fa-solid fa-arrow-left"></i></a><div>Conversation</div><div></div></header>

  <main class="container">
    <div id="chatBox" class="chat-box"></div>
    <form class="chat-input" onsubmit="envoyerMsg(event)">
      <input type="text" id="msgInput" placeholder="Ecrire un message..." required>
      <button type="submit" style="background:#d32f2f;color:white;border:none;border-radius:50%;width:40px"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </main>

  <script type="module">
    import { db, auth } from './app.js';
    import { collection, addDoc, query, where, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const params = new URLSearchParams(window.location.search);
    const to = params.get('to'); const service = params.get('service');
    let myId = null;

    onAuthStateChanged(auth, (user) => {
      if(user){ myId = user.uid; loadChat(); } 
      else { window.location.href = "inscription.html"; }
    });

    const chatId = [myId, to].sort().join("_"); // ID unique pour la conv

    function loadChat(){
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt"));
      onSnapshot(q, (snap) => {
        let html = '';
        snap.forEach(d => {
          const m = d.data();
          const classe = m.from === myId ? 'moi' : 'lui';
          html += `<div class="msg ${classe}">${m.text}</div>`;
        });
        document.getElementById('chatBox').innerHTML = html;
      });
    }

    window.envoyerMsg = async (e) => {
      e.preventDefault();
      const text = document.getElementById('msgInput').value;
      await addDoc(collection(db, "chats", chatId, "messages"), {
        from: myId, to, serviceId: service, text, createdAt: serverTimestamp()
      });
      document.getElementById('msgInput').value = '';
    }
  </script>
</body>
</html>
