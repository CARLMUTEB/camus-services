<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Discussion — CAMU SERVICES</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
background:#111;
color:white;
}

.chat-container{
max-width:600px;
margin:60px auto 70px;
height:calc(100vh - 130px);
display:flex;
flex-direction:column;
padding:10px 15px;
}

.service-info{
background:#222;
border-left:4px solid #d32f2f;
border-radius:8px;
padding:10px;
font-size:13px;
margin-bottom:8px;
}

.messages-list{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px;
padding:8px 0;
}

.message{
background:#222;
border:1px solid #333;
border-radius:10px;
padding:9px 12px;
max-width:80%;
font-size:13px;
}

.message small{
display:block;
font-size:9px;
opacity:.7;
margin-bottom:4px;
}

.my-message{
align-self:flex-end;
background:#d32f2f;
border:none;
}

.chat-input{
position:fixed;
bottom:0;
left:0;
right:0;
background:#000;
border-top:1px solid #333;
padding:10px;
display:flex;
gap:8px;
z-index:2000;
}

.chat-input input{
flex:1;
background:#222;
color:white;
border:1px solid #444;
border-radius:7px;
padding:11px;
outline:none;
}

.chat-input button{
background:#d32f2f;
color:white;
border:none;
border-radius:7px;
padding:0 17px;
}

</style>

</head>

<body>

<header class="top-bar">

<div class="logo-text">
DISCUSSION <span>SERVICE</span>
</div>

<a href="index.html"
style="color:white;">

<i class="fa-solid fa-xmark"></i>

</a>

</header>


<main class="chat-container">

<div
id="serviceInfoBox"
class="service-info">

Chargement...

</div>


<div
id="messagesList"
class="messages-list">

</div>

</main>


<form
id="chatForm"
class="chat-input">

<input
type="text"
id="messageInput"
placeholder="Écrivez votre message..."
autocomplete="off"
required>

<button type="submit">

<i class="fa-solid fa-paper-plane"></i>

</button>

</form>


<script type="module">

import {
db,
auth
} from "./app.js";


import {
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp,
doc,
getDoc
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const params =
new URLSearchParams(window.location.search);


const serviceId =
params.get("serviceId");


let currentUser=null;


function escapeHTML(value){

return String(value || "")
.replace(/[&<>"']/g,char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char]));

}


if(!serviceId){

document.getElementById(
"serviceInfoBox"
).textContent=
"Aucun service sélectionné.";

document.getElementById(
"chatForm"
).style.display="none";

}


async function chargerService(){

const reference =
doc(db,"services",serviceId);

const snapshot =
await getDoc(reference);


if(!snapshot.exists()){

document.getElementById(
"serviceInfoBox"
).textContent=
"Service introuvable.";

return false;

}


const service =
snapshot.data();


document.getElementById(
"serviceInfoBox"
).innerHTML=`

<strong>
${escapeHTML(service.titre)}
</strong>

<br>

<small>
Prix : ${escapeHTML(service.prix || "Sur devis")}
</small>

`;


return true;

}


function chargerMessages(){

const messagesQuery =
query(
collection(db,"messages"),
where("serviceId","==",serviceId),
orderBy("createdAt","asc")
);


onSnapshot(
messagesQuery,
(snapshot)=>{

const container =
document.getElementById(
"messagesList"
);


if(snapshot.empty){

container.innerHTML=
'<p style="color:#777;text-align:center;font-size:12px;">Aucun message.</p>';

return;

}


container.innerHTML="";


snapshot.forEach(document=>{

const message =
document.data();


const mine =
message.senderId ===
currentUser.uid;


const element =
document.createElement("div");


element.className=
"message " +
(mine ? "my-message" : "");


element.innerHTML=`

<small>
${mine
?"Moi"
:escapeHTML(
message.senderName ||
"Utilisateur"
)}
</small>

<div>
${escapeHTML(message.text)}
</div>

`;


container.appendChild(element);

});


container.scrollTop=
container.scrollHeight;

},
(error)=>{

console.error(error);

});

}


onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href=
"connexion.html";

return;

}


currentUser=user;


if(serviceId){

const exists =
await chargerService();

if(exists){

chargerMessages();

}

}

});


document
.getElementById("chatForm")
.addEventListener(
"submit",
async(event)=>{

event.preventDefault();


const input =
document.getElementById(
"messageInput"
);


const text =
input.value.trim();


if(!text ||
!currentUser ||
!serviceId){

return;

}


try{

await addDoc(
collection(db,"messages"),
{

text,

senderId:
currentUser.uid,

senderName:
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"Utilisateur",

serviceId,

createdAt:
serverTimestamp()

}
);


input.value="";

}catch(error){

console.error(error);

alert(
"Impossible d'envoyer le message."
);

}

});

</script>

</body>
</html>
