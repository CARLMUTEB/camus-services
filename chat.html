<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CAMU SERVICES — Chat</title>

<link rel="stylesheet"
      href="style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

.chat-page {
  padding-bottom: 150px;
}

.chat-wrapper {
  width: min(100%, 720px);
  margin: auto;
}

.chat-header-card {
  background:#111;
  color:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

.chat-header-card h2 {
  font-size:18px;
  margin-bottom:5px;
}

.chat-header-card p {
  color:#aaa;
  font-size:12px;
}

.chat-service {
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.chat-service-title {
  font-size:15px;
  font-weight:900;
  margin-bottom:5px;
}

.chat-service-price {
  font-size:12px;
  color:var(--red);
  font-weight:bold;
}

.messages-list {
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  min-height:420px;
  max-height:calc(100vh - 350px);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:var(--shadow);
}

.message {
  max-width:82%;
  padding:10px 13px;
  border-radius:15px;
  background:#f1f3f5;
  color:#222;
  align-self:flex-start;
  word-break:break-word;
}

.my-message {
  background:var(--red);
  color:#fff;
  align-self:flex-end;
}

.sender {
  font-size:10px;
  font-weight:bold;
  opacity:.65;
  margin-bottom:4px;
}

.message-text {
  font-size:13px;
  line-height:1.5;
}

.empty-chat {
  margin:auto;
  text-align:center;
  color:#999;
  font-size:12px;
  line-height:1.6;
}

.chat-composer {
  position:fixed;
  left:0;
  right:0;
  bottom:72px;
  background:#fff;
  border-top:1px solid var(--border);
  padding:10px;
  z-index:900;
}

.chat-form {
  width:min(100%,720px);
  margin:auto;
  display:flex;
  gap:8px;
}

.chat-form input {
  flex:1;
  min-width:0;
}

.send-btn {
  width:48px;
  border:0;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.send-btn:disabled {
  opacity:.6;
}

@media(max-width:480px) {

  .container {
    width:94%;
  }

  .messages-list {
    min-height:380px;
    max-height:calc(100vh - 335px);
  }

  .message {
    max-width:88%;
  }

}

</style>

</head>


<body>


<header class="top-bar">

  <a href="index.html"
     style="color:#fff;font-size:19px;">

    <i class="fa-solid fa-arrow-left"></i>

  </a>


  <div class="logo-text">

    CAMU <span>SERVICES</span>

  </div>


  <a href="profil.html"
     style="color:#fff;font-size:18px;">

    <i class="fa-solid fa-user"></i>

  </a>

</header>


<main class="container chat-page">

<div class="chat-wrapper">


  <!-- TITRE -->

  <section class="chat-header-card">

    <h2>

      <i class="fa-solid fa-comments"
         style="color:#ef5350;"></i>

      Messagerie

    </h2>

    <p>
      Discutez directement avec le prestataire.
    </p>

  </section>


  <!-- SERVICE -->

  <div
    id="serviceInfoBox"
    class="chat-service">

    <div class="chat-service-title">

      Chargement du service...

    </div>

  </div>


  <!-- MESSAGES -->

  <div
    id="messagesList"
    class="messages-list">

    <p class="empty-chat">

      <i class="fa-solid fa-spinner fa-spin"
         style="font-size:25px;"></i>

      <br><br>

      Chargement des messages...

    </p>

  </div>

</div>

</main>


<!-- COMPOSER -->

<div class="chat-composer">

  <form
    id="chatForm"
    class="chat-form">

    <input
      type="text"
      id="messageInput"
      placeholder="Écrivez votre message..."
      autocomplete="off"
      maxlength="1000"
      required>

    <button
      type="submit"
      class="send-btn">

      <i class="fa-solid fa-paper-plane"></i>

    </button>

  </form>

</div>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <a href="index.html">

    <i class="fa-solid fa-house"></i>

    <span>Accueil</span>

  </a>


  <a href="publier.html">

    <i class="fa-solid fa-circle-plus"></i>

    <span>Publier</span>

  </a>


  <a href="chat.html"
     class="active">

    <i class="fa-solid fa-comments"></i>

    <span>Chat</span>

  </a>


  <a href="profil.html">

    <i class="fa-solid fa-user"></i>

    <span>Profil</span>

  </a>

</nav>


<script type="module">

import {
  db,
  auth
} from "./app.js";


import {
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


import {
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


let currentUser = null;


const params =
  new URLSearchParams(
    window.location.search
  );


const serviceId =
  params.get("serviceId");


const serviceBox =
  document.getElementById(
    "serviceInfoBox"
  );


const messagesList =
  document.getElementById(
    "messagesList"
  );


/* SECURITY */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SERVICE */

async function chargerService() {

  if (!serviceId) {

    serviceBox.innerHTML = `

      <div style="color:#c62828;font-size:13px;">

        <i class="fa-solid fa-circle-exclamation"></i>

        Aucun service sélectionné.

      </div>

    `;

    return;

  }


  try {

    const snap =
      await getDoc(
        doc(
          db,
          "services",
          serviceId
        )
      );


    if (!snap.exists()) {

      serviceBox.innerHTML = `

        <div class="chat-service-title"
             style="color:#c62828;">

          Service introuvable.

        </div>

      `;

      return;

    }


    const service =
      snap.data();


    serviceBox.innerHTML = `

      <div class="chat-service-title">

        <i class="fa-solid fa-briefcase"
           style="color:var(--red);"></i>

        ${escapeHTML(
          service.titre || "Service"
        )}

      </div>

      <div class="chat-service-price">

        ${escapeHTML(
          service.prix || "Sur devis"
        )}

      </div>

    `;

  }

  catch(error) {

    console.error(error);

  }

}


/* MESSAGES */

function chargerMessages() {

  if (!serviceId ||
      !currentUser) return;


  const q =
    query(
      collection(
        db,
        "messages"
      ),
      where(
        "serviceId",
        "==",
        serviceId
      )
    );


  onSnapshot(
    q,
    (snapshot) => {

      const messages = [];


      snapshot.forEach(
        (messageDoc) => {

          messages.push({
            id:messageDoc.id,
            ...messageDoc.data()
          });

        }
      );


      messages.sort(
        (a,b) => {

          const A =
            a.createdAt?.seconds || 0;

          const B =
            b.createdAt?.seconds || 0;

          return A-B;

        }
      );


      if (!messages.length) {

        messagesList.innerHTML = `

          <p class="empty-chat">

            <i class="fa-regular fa-comment-dots"
               style="font-size:35px;"></i>

            <br><br>

            Aucun message pour le moment.

            <br>

            Commencez la conversation.

          </p>

        `;

        return;

      }


      messagesList.innerHTML =
        messages.map(
          message => {

            const isMe =
              message.senderId ===
              currentUser.uid;


            return `

              <div class="
                message
                ${isMe
                  ? "my-message"
                  : ""}
              ">

                <div class="sender">

                  ${escapeHTML(
                    isMe
                      ? "Moi"
                      : (
                        message.senderName ||
                        "Utilisateur"
                      )
                  )}

                </div>

                <div class="message-text">

                  ${escapeHTML(
                    message.text || ""
                  )}

                </div>

              </div>

            `;

          }
        ).join("");


      messagesList.scrollTop =
        messagesList.scrollHeight;

    },

    (error) => {

      console.error(error);

      messagesList.innerHTML = `

        <p class="empty-chat"
           style="color:#c62828;">

          Impossible de charger les messages.

        </p>

      `;

    }

  );

}


/* AUTH */

onAuthStateChanged(
  auth,
  (user) => {

    if (!user) {

      window.location.href =
        "connexion.html";

      return;

    }


    currentUser = user;

    chargerService();

    chargerMessages();

  }
);


/* ENVOI */

document
  .getElementById("chatForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      if (!currentUser ||
          !serviceId) return;


      const input =
        document.getElementById(
          "messageInput"
        );


      const text =
        input.value.trim();


      if (!text) return;


      const button =
        event.target.querySelector(
          "button"
        );


      try {

        button.disabled = true;


        await addDoc(
          collection(
            db,
            "messages"
          ),
          {

            text,

            senderId:
              currentUser.uid,

            senderName:
              currentUser.displayName ||
              currentUser.email
                ?.split("@")[0] ||
              "Utilisateur",

            serviceId,

            createdAt:
              serverTimestamp()

          }
        );


        input.value = "";

        input.focus();

      }

      catch(error) {

        console.error(error);

        alert(
          "Impossible d'envoyer le message."
        );

      }


      button.disabled = false;

    }
  );

</script>

</body>
</html>
