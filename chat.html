<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat — CAMU SERVICES</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>

<body>

<div class="chat-page">

    <!-- HEADER -->
    <header class="chat-header">

        <button id="back-btn" class="chat-header-btn">
            <i class="fas fa-arrow-left"></i>
        </button>

        <div class="chat-title">
            <strong id="chat-title">Chat</strong>
            <span id="chat-status">CAMU SERVICES</span>
        </div>

        <button id="refresh-btn" class="chat-header-btn">
            <i class="fas fa-sync-alt"></i>
        </button>

    </header>


    <!-- LISTE DES CONVERSATIONS -->
    <section id="conversation-section" class="conversation-section">

        <div class="conversation-header">
            <h2>Mes conversations</h2>

            <button id="new-chat-btn">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div id="conversation-list" class="conversation-list">

            <div class="chat-loading">
                <i class="fas fa-spinner fa-spin"></i>
                Chargement des conversations...
            </div>

        </div>

    </section>


    <!-- ZONE CHAT -->
    <section id="chat-section" class="chat-section hidden">

        <div id="messages" class="messages">

            <div class="empty-chat">
                <i class="fas fa-comments"></i>
                <p>Aucun message</p>
                <small>Envoyez votre premier message.</small>
            </div>

        </div>


        <!-- INDICATEUR -->
        <div id="typing-indicator" class="typing-indicator hidden">
            En train d'écrire...
        </div>


        <!-- FORMULAIRE MESSAGE -->
        <form id="message-form" class="message-form">

            <button
                type="button"
                id="emoji-btn"
                class="message-action"
                title="Emoji"
            >
                <i class="far fa-smile"></i>
            </button>

            <input
                type="text"
                id="message-input"
                placeholder="Écrire un message..."
                autocomplete="off"
                maxlength="1000"
            >

            <button
                type="submit"
                id="send-btn"
                class="send-btn"
            >
                <i class="fas fa-paper-plane"></i>
            </button>

        </form>

    </section>

</div>


<!-- EMOJIS -->
<div id="emoji-panel" class="emoji-panel hidden">

    <button>😀</button>
    <button>😂</button>
    <button>😍</button>
    <button>👍</button>
    <button>❤️</button>
    <button>🙏</button>
    <button>🔥</button>
    <button>👏</button>
    <button>😊</button>
    <button>😎</button>

</div>


<style>

/* ================================
   CHAT
================================ */

.chat-page {
    min-height: 100vh;
    background: #f5f7fa;
    display: flex;
    flex-direction: column;
}


/* HEADER */

.chat-header {
    height: 64px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.chat-header-btn {
    border: none;
    background: transparent;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

    color: #1a73e8;
}

.chat-header-btn:hover {
    background: #eef4ff;
}

.chat-title {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.chat-title strong {
    font-size: 17px;
}

.chat-title span {
    font-size: 11px;
    color: #777;
}


/* CONVERSATIONS */

.conversation-section {
    padding: 18px;
}

.conversation-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.conversation-header h2 {
    font-size: 20px;
}

#new-chat-btn {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: #1a73e8;
    color: white;

    cursor: pointer;
}


.conversation-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}


/* CONVERSATION */

.conversation-item {
    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 12px;

    display: flex;
    align-items: center;

    gap: 12px;

    cursor: pointer;

    transition: 0.2s;
}

.conversation-item:hover {
    background: #f1f6ff;
}

.conversation-avatar {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    background: #eee;
}

.conversation-info {
    flex: 1;

    min-width: 0;
}

.conversation-name {
    font-weight: 600;
}

.conversation-last-message {
    color: #777;

    font-size: 13px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.conversation-time {
    font-size: 11px;
    color: #999;
}


/* CHAT */

.chat-section {
    flex: 1;

    display: flex;

    flex-direction: column;

    min-height: calc(100vh - 64px);
}

.hidden {
    display: none !important;
}


/* MESSAGES */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 20px 15px 90px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}


/* MESSAGE */

.message {
    max-width: 78%;

    padding: 10px 13px;

    border-radius: 15px;

    font-size: 14px;

    position: relative;

    word-break: break-word;
}

.message.me {
    align-self: flex-end;

    background: #1a73e8;

    color: white;

    border-bottom-right-radius: 4px;
}

.message.other {
    align-self: flex-start;

    background: white;

    border: 1px solid #ddd;

    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;

    font-size: 9px;

    opacity: 0.7;

    margin-top: 4px;

    text-align: right;
}


/* FORMULAIRE */

.message-form {
    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: white;

    border-top: 1px solid #ddd;

    padding: 10px;

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 200;
}

.message-form input {
    flex: 1;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 12px 15px;

    outline: none;

    font-size: 14px;
}

.message-form input:focus {
    border-color: #1a73e8;
}

.message-action,
.send-btn {
    border: none;

    width: 42px;

    height: 42px;

    border-radius: 50%;

    cursor: pointer;
}

.message-action {
    background: transparent;

    color: #777;

    font-size: 18px;
}

.send-btn {
    background: #1a73e8;

    color: white;

    font-size: 16px;
}


/* EMOJI */

.emoji-panel {
    position: fixed;

    bottom: 70px;

    left: 10px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 10px;

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    width: 220px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

    z-index: 300;
}

.emoji-panel button {
    border: none;

    background: transparent;

    font-size: 22px;

    cursor: pointer;

    padding: 5px;
}


/* EMPTY */

.empty-chat,
.chat-loading {
    text-align: center;

    color: #777;

    padding: 40px 20px;
}

.empty-chat i {
    font-size: 40px;

    color: #aaa;

    margin-bottom: 10px;
}


/* TYPING */

.typing-indicator {
    font-size: 11px;

    color: #777;

    padding: 5px 15px;
}


/* DESKTOP */

@media (min-width: 768px) {

    .chat-page {
        max-width: 800px;

        margin: auto;

        background: #f5f7fa;
    }

    .message-form {
        max-width: 800px;

        left: 50%;

        transform: translateX(-50%);
    }

}

</style>


<!-- JAVASCRIPT FIREBASE -->

<script type="module">

import { auth, db } from "./js/config/firebase.js";

import {
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";


let currentUser = null;
let currentConversation = null;

let unsubscribeMessages = null;
let unsubscribeConversations = null;


/* =================================
   AUTHENTIFICATION
================================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Vous devez être connecté pour utiliser le chat.");

        window.location.href = "connexion.html";

        return;
    }

    currentUser = user;

    loadConversations();

});


/* =================================
   CONVERSATIONS
================================= */

function loadConversations() {

    const list = document.getElementById("conversation-list");

    const q = query(
        collection(db, "conversations"),
        where("participants", "array-contains", currentUser.uid),
        orderBy("updatedAt", "desc")
    );

    unsubscribeConversations = onSnapshot(
        q,
        async (snapshot) => {

            list.innerHTML = "";

            if (snapshot.empty) {

                list.innerHTML = `
                    <div class="empty-chat">
                        <i class="fas fa-comments"></i>
                        <p>Aucune conversation</p>
                        <small>Commencez une nouvelle conversation.</small>
                    </div>
                `;

                return;
            }


            for (const conversationDoc of snapshot.docs) {

                const conversation = conversationDoc.data();

                const otherUserId =
                    conversation.participants.find(
                        uid => uid !== currentUser.uid
                    );


                let userData = {};

                try {

                    const userDoc = await getDoc(
                        doc(db, "users", otherUserId)
                    );

                    if (userDoc.exists()) {
                        userData = userDoc.data();
                    }

                } catch (error) {

                    console.error(error);

                }


                const item = document.createElement("div");

                item.className = "conversation-item";

                item.innerHTML = `

                    <img
                        class="conversation-avatar"
                        src="${userData.photoURL || 'assets/default-avatar.png'}"
                    >

                    <div class="conversation-info">

                        <div class="conversation-name">
                            ${escapeHTML(
                                userData.displayName || "Utilisateur"
                            )}
                        </div>

                        <div class="conversation-last-message">
                            ${escapeHTML(
                                conversation.lastMessage || "Aucun message"
                            )}
                        </div>

                    </div>

                    <div class="conversation-time">
                        ${formatDate(conversation.updatedAt)}
                    </div>

                `;


                item.addEventListener("click", () => {

                    openConversation(
                        conversationDoc.id,
                        otherUserId,
                        userData.displayName || "Utilisateur"
                    );

                });


                list.appendChild(item);

            }

        },
        (error) => {

            console.error(
                "Erreur conversations:",
                error
            );

            list.innerHTML = `
                <div class="empty-chat">
                    Impossible de charger les conversations.
                </div>
            `;

        }
    );

}


/* =================================
   OUVRIR CONVERSATION
================================= */

function openConversation(
    conversationId,
    otherUserId,
    otherName
) {

    currentConversation = conversationId;

    document.getElementById(
        "conversation-section"
    ).classList.add("hidden");

    document.getElementById(
        "chat-section"
    ).classList.remove("hidden");

    document.getElementById(
        "chat-title"
    ).textContent = otherName;

    loadMessages(conversationId);

}


/* =================================
   MESSAGES
================================= */

function loadMessages(conversationId) {

    const messagesContainer =
        document.getElementById("messages");


    if (unsubscribeMessages) {
        unsubscribeMessages();
    }


    const q = query(

        collection(
            db,
            "conversations",
            conversationId,
            "messages"
        ),

        orderBy("createdAt", "asc")

    );


    unsubscribeMessages = onSnapshot(

        q,

        (snapshot) => {

            messagesContainer.innerHTML = "";


            if (snapshot.empty) {

                messagesContainer.innerHTML = `
                    <div class="empty-chat">
                        <i class="fas fa-comment"></i>
                        <p>Aucun message</p>
                        <small>Envoyez votre premier message.</small>
                    </div>
                `;

                return;

            }


            snapshot.forEach((messageDoc) => {

                const message =
                    messageDoc.data();


                const div =
                    document.createElement("div");


                const isMe =
                    message.senderId === currentUser.uid;


                div.className =
                    "message " +
                    (isMe ? "me" : "other");


                div.innerHTML = `

                    ${escapeHTML(message.text)}

                    <span class="message-time">
                        ${formatDate(message.createdAt)}
                    </span>

                `;


                messagesContainer.appendChild(div);

            });


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        },

        (error) => {

            console.error(
                "Erreur messages:",
                error
            );

        }

    );

}


/* =================================
   ENVOYER MESSAGE
================================= */

document
    .getElementById("message-form")
    .addEventListener("submit", async (e) => {

        e.preventDefault();


        if (!currentUser) {
            return;
        }


        if (!currentConversation) {

            alert(
                "Sélectionnez d'abord une conversation."
            );

            return;

        }


        const input =
            document.getElementById(
                "message-input"
            );


        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        const sendButton =
            document.getElementById(
                "send-btn"
            );


        sendButton.disabled = true;


        try {

            await addDoc(

                collection(
                    db,
                    "conversations",
                    currentConversation,
                    "messages"
                ),

                {
                    senderId: currentUser.uid,
                    text: text,
                    createdAt: serverTimestamp()
                }

            );


            await setDoc(

                doc(
                    db,
                    "conversations",
                    currentConversation
                ),

                {
                    lastMessage: text,
                    updatedAt: serverTimestamp()
                },

                {
                    merge: true
                }

            );


            input.value = "";

        }

        catch (error) {

            console.error(error);

            alert(
                "Impossible d'envoyer le message."
            );

        }

        finally {

            sendButton.disabled = false;

            input.focus();

        }

    });


/* =================================
   NOUVELLE CONVERSATION
================================= */

document
    .getElementById("new-chat-btn")
    .addEventListener("click", async () => {

        const userId =
            prompt(
                "Entrez l'identifiant UID de l'utilisateur avec qui vous voulez discuter :"
            );


        if (!userId) {
            return;
        }


        if (userId === currentUser.uid) {

            alert(
                "Vous ne pouvez pas discuter avec vous-même."
            );

            return;

        }


        const participants =
            [
                currentUser.uid,
                userId
            ].sort();


        const conversationId =
            participants.join("_");


        await setDoc(

            doc(
                db,
                "conversations",
                conversationId
            ),

            {
                participants: participants,

                lastMessage: "",

                updatedAt: serverTimestamp(),

                createdAt: serverTimestamp()

            },

            {
                merge: true
            }

        );


        openConversation(
            conversationId,
            userId,
            "Utilisateur"
        );

    });


/* =================================
   RETOUR
================================= */

document
    .getElementById("back-btn")
    .addEventListener("click", () => {

        if (
            !document
                .getElementById("chat-section")
                .classList.contains("hidden")
        ) {

            document
                .getElementById("chat-section")
                .classList.add("hidden");

            document
                .getElementById("conversation-section")
                .classList.remove("hidden");

            document.getElementById(
                "chat-title"
            ).textContent = "Chat";

            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            currentConversation = null;

            return;

        }


        window.location.href = "index.html";

    });


/* =================================
   RAFRAÎCHIR
================================= */

document
    .getElementById("refresh-btn")
    .addEventListener("click", () => {

        window.location.reload();

    });


/* =================================
   EMOJIS
================================= */

const emojiPanel =
    document.getElementById("emoji-panel");


document
    .getElementById("emoji-btn")
    .addEventListener("click", () => {

        emojiPanel.classList.toggle(
            "hidden"
        );

    });


emojiPanel
    .querySelectorAll("button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const input =
                    document.getElementById(
                        "message-input"
                    );

                input.value +=
                    button.textContent;

                input.focus();

            }
        );

    });


/* =================================
   OUTILS
================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


function formatDate(timestamp) {

    if (!timestamp) {
        return "";
    }


    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


    return date.toLocaleTimeString(
        "fr-FR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}

</script>

</body>
</html>
