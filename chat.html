<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - CAMU SERVICES</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 70px; background: #f4f4f4; }
    .chat-container { max-width: 600px; margin: auto; height: 80vh; display: flex; flex-direction: column; }
    .messages-list { flex: 1; overflow-y: auto; padding: 15px; }
    .message { background: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; max-width: 80%; }
    .my-message { background: #d32f2f; color: white; align-self: flex-end; margin-left: auto; }
    .chat-input { position: fixed; bottom: 65px; left: 0; right: 0; padding: 10px; background: white; display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="logo-text">CHAT</div>
    <a href="index.html" style="color:white"><i class="fa-solid fa-xmark"></i></a>
  </header>

  <main class="container chat-container">
    <div id="messagesList" class="messages-list">
      <!-- Les messages s'afficheront ici -->
    </div>

    <form id="chatForm" class="chat-input">
      <input type="text" id="messageInput" placeholder="Votre message..." required>
      <button type="submit" style="background:#d32f2f; color:white; border:none; padding:10px 15px; border-radius:5px;">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </main>

  <script type="module">
    import { db, auth } from './app.js';
    import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "connexion.html"; return; }
      currentUser = user;
      loadMessages();
    });

    // Charger les messages en temps réel
    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        let html = '';
        snapshot.forEach((doc) => {
          const m = doc.data();
          const isMe = m.senderId === currentUser.uid;
          html += `
            <div class="message ${isMe ? 'my-message' : ''}">
              <p style="font-size:12px; font-weight:bold;">${isMe ? 'Moi' : m.senderName}</p>
              <p>${m.text}</p>
            </div>
          `;
        });
        document.getElementById('messagesList').innerHTML = html;
        document.getElementById('messagesList').scrollTop = document.getElementById('messagesList').scrollHeight;
      });
    }

    // Envoyer un message
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('messageInput').value.trim();
      if (!text) return;

      await addDoc(collection(db, "messages"), {
        text: text,
        senderId: currentUser.uid,
        senderName: currentUser.displayName || "Utilisateur",
        createdAt: serverTimestamp()
      });

      document.getElementById('messageInput').value = '';
    });
  </script>
</body>
</html>
