<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Chat — CAMU SERVICES</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {
      background: #111;
      color: white;
      padding-top: 60px;
      padding-bottom: 75px;
    }


    /* ================= HEADER ================= */

    .top-bar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 60px;

      background: #111;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 15px;

      z-index: 1000;

      border-bottom: 1px solid #333;

    }


    .logo-text {

      color: white;

      font-size: 16px;

      font-weight: 900;

    }


    .logo-text span {

      color: #d32f2f;

    }


    .back-btn {

      color: white;

      font-size: 20px;

      text-decoration: none;

    }


    /* ================= CONTAINER ================= */

    .chat-container {

      width: 100%;

      max-width: 650px;

      height: calc(100vh - 135px);

      margin: auto;

      display: flex;

      flex-direction: column;

      padding: 12px;

    }


    /* ================= SERVICE ================= */

    .service-info {

      background: #222;

      border-left: 4px solid #d32f2f;

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 10px;

      flex-shrink: 0;

    }


    .service-title {

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 5px;

    }


    .service-price {

      color: #aaa;

      font-size: 11px;

    }


    /* ================= MESSAGES ================= */

    .messages-list {

      flex: 1;

      overflow-y: auto;

      display: flex;

      flex-direction: column;

      gap: 9px;

      padding: 10px 3px;

    }


    .message {

      background: #222;

      border: 1px solid #333;

      padding: 9px 12px;

      border-radius: 12px;

      max-width: 82%;

      word-break: break-word;

    }


    .my-message {

      align-self: flex-end;

      background: #d32f2f;

      border: none;

      color: white;

    }


    .other-message {

      align-self: flex-start;

    }


    .sender {

      font-size: 10px;

      opacity: .65;

      margin-bottom: 4px;

      font-weight: 700;

    }


    .message-text {

      font-size: 13px;

      line-height: 1.4;

    }


    .empty-chat {

      text-align: center;

      color: #777;

      font-size: 12px;

      margin-top: 25px;

    }


    /* ================= INPUT ================= */

    .chat-input {

      background: #000;

      border-top: 1px solid #333;

      padding: 10px;

      display: flex;

      gap: 8px;

      flex-shrink: 0;

    }


    .chat-input input {

      flex: 1;

      min-width: 0;

      background: #222;

      border: 1px solid #444;

      color: white;

      border-radius: 8px;

      padding: 11px;

      outline: none;

      font-size: 13px;

    }


    .chat-input input:focus {

      border-color: #d32f2f;

    }


    .send-btn {

      width: 45px;

      background: #d32f2f;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 16px;

    }


    /* ================= NAVIGATION ================= */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 70px;

      background: #111;

      border-top: 1px solid #333;

      display: flex;

      justify-content: space-around;

      z-index: 1000;

    }


    .bottom-nav a {

      width: 25%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      color: #777;

      text-decoration: none;

      font-size: 11px;

    }


    .bottom-nav a.active {

      color: #d32f2f;

    }


    .bottom-nav i {

      font-size: 19px;

      margin-bottom: 4px;

    }

  </style>

</head>


<body>


<header class="top-bar">

  <a href="index.html" class="back-btn">

    <i class="fa-solid fa-arrow-left"></i>

  </a>


  <div class="logo-text">

    CAMU <span>SERVICES</span>

  </div>


  <div style="width:20px;"></div>

</header>


<main class="chat-container">


  <!-- SERVICE -->

  <div
    id="serviceInfoBox"
    class="service-info"
  >

    <div class="service-title">
      Chargement du service...
    </div>

  </div>


  <!-- MESSAGES -->

  <div
    id="messagesList"
    class="messages-list"
  >

    <p class="empty-chat">
      Chargement des messages...
    </p>

  </div>


  <!-- FORMULAIRE -->

  <form
    id="chatForm"
    class="chat-input"
  >

    <input
      type="text"
      id="messageInput"
      placeholder="Écrivez votre message..."
      autocomplete="off"
      maxlength="1000"
      required
    >

    <button
      type="submit"
      class="send-btn"
    >

      <i class="fa-solid fa-paper-plane"></i>

    </button>

  </form>


</main>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <a href="index.html">

    <i class="fa-solid fa-house"></i>

    <span>Accueil</span>

  </a>


  <a href="publier.html">

    <i class="fa-solid fa-circle-plus"></i>

    <span>Publier</span>

  </a>


  <a href="chat.html" class="active">

    <i class="fa-solid fa-comments"></i>

    <span>Chat</span>

  </a>


  <a href="profil.html">

    <i class="fa-solid fa-user"></i>

    <span>Profil</span>

  </a>

</nav>


<script type="module">

  import {
    db,
    auth
  } from "./app.js";


  import {

    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp,
    doc,
    getDoc

  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


  import {
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


  /* =====================================================
     UTILISATEUR
  ===================================================== */

  let currentUser = null;


  /* =====================================================
     SERVICE ID
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const serviceId =
    params.get("serviceId");


  /* =====================================================
     VÉRIFICATION
  ===================================================== */

  if (!serviceId) {

    document.getElementById(
      "serviceInfoBox"
    ).innerHTML = `

      <div style="
        color:#fff;
        font-size:13px;
      ">

        <i class="fa-solid fa-circle-exclamation"
           style="color:#d32f2f;">
        </i>

        Aucun service sélectionné.

      </div>

    `;


    document.getElementById(
      "messagesList"
    ).innerHTML = `

      <p class="empty-chat">

        Retournez à l'accueil
        et sélectionnez un service.

      </p>

    `;


  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     CHARGER LE SERVICE
  ===================================================== */

  async function chargerService() {

    if (!serviceId) return;


    try {

      const serviceRef =
        doc(
          db,
          "services",
          serviceId
        );


      const snap =
        await getDoc(serviceRef);


      if (!snap.exists()) {

        document.getElementById(
          "serviceInfoBox"
        ).innerHTML = `

          <div class="service-title"
               style="color:#d32f2f;">

            Service introuvable.

          </div>

        `;

        return;

      }


      const service =
        snap.data();


      document.getElementById(
        "serviceInfoBox"
      ).innerHTML = `

        <div class="service-title">

          <i class="fa-solid fa-briefcase"
             style="color:#d32f2f;">
          </i>

          ${escapeHTML(
            service.titre || "Service"
          )}

        </div>


        <div class="service-price">

          Prix :
          ${escapeHTML(
            service.prix || "Sur devis"
          )}

        </div>

      `;


    } catch (error) {

      console.error(
        "Erreur service :",
        error
      );

    }

  }


  /* =====================================================
     CHARGER MESSAGES
     
     IMPORTANT :
     Pas de orderBy() ici.
     Cela évite également les problèmes d'index.
  ===================================================== */

  function chargerMessages() {

    if (!serviceId || !currentUser) {
      return;
    }


    const q =
      query(
        collection(db, "messages"),
        where(
          "serviceId",
          "==",
          serviceId
        )
      );


    onSnapshot(
      q,

      (snapshot) => {

        const messages = [];


        snapshot.forEach(
          (messageDoc) => {

            messages.push({

              id: messageDoc.id,

              ...messageDoc.data()

            });

          }
        );


        /* Tri côté navigateur */

        messages.sort(
          (a, b) => {

            const dateA =
              a.createdAt?.seconds || 0;

            const dateB =
              b.createdAt?.seconds || 0;

            return dateA - dateB;

          }
        );


        const list =
          document.getElementById(
            "messagesList"
          );


        if (messages.length === 0) {

          list.innerHTML = `

            <p class="empty-chat">

              Aucun message pour le moment.<br>

              Commencez la conversation.

            </p>

          `;

          return;

        }


        let html = "";


        messages.forEach(
          (message) => {

            const isMe =
              message.senderId ===
              currentUser.uid;


            const sender =
              isMe
                ? "Moi"
                : (
                    message.senderName ||
                    "Utilisateur"
                  );


            html += `

              <div class="
                message
                ${isMe
                  ? "my-message"
                  : "other-message"}
              ">

                <div class="sender">

                  ${escapeHTML(sender)}

                </div>


                <div class="message-text">

                  ${escapeHTML(
                    message.text || ""
                  )}

                </div>

              </div>

            `;

          }
        );


        list.innerHTML = html;


        list.scrollTop =
          list.scrollHeight;

      },


      (error) => {

        console.error(
          "Erreur messages :",
          error
        );


        document.getElementById(
          "messagesList"
        ).innerHTML = `

          <p class="empty-chat"
             style="color:#d32f2f;">

            Impossible de charger
            les messages.

          </p>

        `;

      }

    );

  }


  /* =====================================================
     AUTHENTIFICATION
  ===================================================== */

  onAuthStateChanged(
    auth,
    (user) => {

      if (!user) {

        window.location.href =
          "connexion.html";

        return;

      }


      currentUser = user;


      chargerService();

      chargerMessages();

    }
  );


  /* =====================================================
     ENVOYER MESSAGE
  ===================================================== */

  document
    .getElementById("chatForm")
    .addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!currentUser) {

          alert(
            "Vous devez être connecté."
          );

          return;

        }


        if (!serviceId) {

          alert(
            "Aucun service sélectionné."
          );

          return;

        }


        const input =
          document.getElementById(
            "messageInput"
          );


        /* CORRECTION DE TON ERREUR :
           
           AVANT :
           document.getElementById('messageInput'].value

           MAINTENANT :
           document.getElementById('messageInput').value
        */

        const text =
          input.value.trim();


        if (!text) {
          return;
        }


        try {

          await addDoc(
            collection(
              db,
              "messages"
            ),
            {

              text: text,

              senderId:
                currentUser.uid,

              senderName:
                currentUser.displayName ||
                currentUser.email?.split("@")[0] ||
                "Utilisateur",

              serviceId:
                serviceId,

              createdAt:
                serverTimestamp()

            }
          );


          input.value = "";

          input.focus();


        } catch (error) {

          console.error(
            "Erreur envoi message :",
            error
          );


          alert(
            "Impossible d'envoyer le message."
          );

        }

      }
    );

</script>


</body>
</html>
