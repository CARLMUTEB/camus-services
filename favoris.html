<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mes favoris — CAMU SERVICES</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body>

<header class="top-bar">

    <button
        id="back-btn"
        class="menu-btn"
    >
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="logo">
        CAMU SERVICES
    </div>

    <button
        id="home-btn"
        class="profile-btn"
    >
        <i class="fas fa-home"></i>
    </button>

</header>


<main class="favorites-page">

    <div class="favorites-header">

        <div>

            <h1>
                <i class="fas fa-heart"></i>
                Mes favoris
            </h1>

            <p>
                Retrouvez les annonces que vous avez enregistrées.
            </p>

        </div>

        <span id="favorites-count">
            0
        </span>

    </div>


    <div
        id="favorites-message"
        class="favorites-message"
    ></div>


    <div
        id="favorites-list"
        class="favorites-grid"
    >

        <div class="favorites-loading">

            <i class="fas fa-spinner fa-spin"></i>

            Chargement de vos favoris...

        </div>

    </div>

</main>


<style>

.favorites-page {
    max-width: 1100px;

    margin: 30px auto;

    padding: 20px;
}

.favorites-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.favorites-header h1 {
    color: var(--primary);

    margin-bottom: 5px;
}

.favorites-header p {
    color: var(--text-secondary);
}

#favorites-count {
    min-width: 40px;

    height: 40px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    background: var(--primary);

    color: white;

    font-weight: bold;
}

.favorites-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));

    gap: 18px;
}

.favorite-card {
    background: white;

    border-radius: 14px;

    overflow: hidden;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    transition: transform .2s;
}

.favorite-card:hover {
    transform: translateY(-3px);
}

.favorite-image {
    width: 100%;

    height: 180px;

    object-fit: cover;

    background: #eeeeee;
}

.favorite-body {
    padding: 14px;
}

.favorite-title {
    font-size: 17px;

    font-weight: 700;

    margin-bottom: 7px;
}

.favorite-category {
    color: var(--text-secondary);

    font-size: 13px;
}

.favorite-price {
    color: var(--primary);

    font-weight: 700;

    font-size: 18px;

    margin: 8px 0;
}

.favorite-city {
    color: var(--text-secondary);

    font-size: 13px;

    margin-bottom: 12px;
}

.favorite-actions {
    display: flex;

    gap: 8px;
}

.favorite-actions button {
    flex: 1;

    border: none;

    padding: 10px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: 600;
}

.view-btn {
    background: var(--primary);

    color: white;
}

.remove-btn {
    background: #ffebee;

    color: #d32f2f;
}

.favorites-loading,
.empty-favorites {
    grid-column: 1 / -1;

    text-align: center;

    padding: 60px 20px;

    color: var(--text-secondary);
}

.empty-favorites i {
    display: block;

    font-size: 50px;

    color: #ccc;

    margin-bottom: 15px;
}

.favorites-message {
    display: none;

    padding: 12px;

    border-radius: 10px;

    margin-bottom: 15px;

    text-align: center;
}

.favorites-message.error {
    display: block;

    background: #ffebee;

    color: #c62828;
}

@media (max-width: 600px) {

    .favorites-page {
        margin: 10px auto;

        padding: 12px;
    }

    .favorites-header {
        align-items: flex-start;
    }

}

</style>


<script
    type="module"
    src="js/pages/favoris.js"
></script>

</body>
</html>
