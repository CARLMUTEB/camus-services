<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris - Camu Services</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .favoris-container {
      max-width: 500px;
      margin: 20px auto 90px auto;
      padding: 0 15px;
    }
    .empty-state {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .empty-state p {
      color: #6c757d;
      font-size: 14px;
      margin-top: 10px;
    }
    .btn-explore {
      display: inline-block;
      margin-top: 15px;
      background-color: #0d6efd;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header class="header">
    <div class="logo">
      <img src="images/logo.png" alt="Logo Camu Services">
      <h1>CAMU <span>SERVICES</span></h1>
      <p>Vos annonces enregistrées</p>
    </div>
  </header>

  <!-- Liste des favoris -->
  <main class="favoris-container">
    <div class="empty-state">
      <span style="font-size: 40px;">⭐</span>
      <h3 style="margin-top: 10px; color: #333;">Aucun favori pour le moment</h3>
      <p>Cliquez sur l'étoile d'une annonce pour la retrouver facilement ici.</p>
      <a href="index.html" class="btn-explore">Parcourir les annonces</a>
    </div>
  </main>

  <!-- Navigation fixe du bas -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 Accueil</a>
    <a href="favoris.html" class="nav-item active">⭐ Favoris</a>
    <a href="publier.html" class="nav-item btn-add">+ Publier</a>
    <a href="chat.html" class="nav-item">💬 Chat</a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
