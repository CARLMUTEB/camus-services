<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription — CAMU SERVICES</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>


<body>

<main class="auth-page">

    <h1>
        <i class="fas fa-user-plus"></i>
        Créer un compte
    </h1>


    <div
        id="signup-error"
        class="error"
        role="alert"
    ></div>


    <form
        id="signup-form"
        novalidate
    >

        <input
            type="text"
            id="signup-name"
            placeholder="Nom complet"
            autocomplete="name"
            required
        >


        <input
            type="tel"
            id="signup-phone"
            placeholder="Téléphone"
            autocomplete="tel"
        >


        <input
            type="email"
            id="signup-email"
            placeholder="Adresse email"
            autocomplete="email"
            required
        >


        <input
            type="password"
            id="signup-password"
            placeholder="Mot de passe"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <input
            type="password"
            id="signup-confirm"
            placeholder="Confirmer le mot de passe"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="signup-btn"
        >
            Créer mon compte
        </button>

    </form>


    <div class="auth-links">

        <a href="connexion.html">
            J'ai déjà un compte
        </a>


        <a href="index.html">
            Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signUp
} from "./js/core/auth.js";


const form =
    document.getElementById(
        "signup-form"
    );

const errorElement =
    document.getElementById(
        "signup-error"
    );

const button =
    document.getElementById(
        "signup-btn"
    );


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        errorElement.textContent = "";


        const name =
            document.getElementById(
                "signup-name"
            ).value.trim();


        const phone =
            document.getElementById(
                "signup-phone"
            ).value.trim();


        const email =
            document.getElementById(
                "signup-email"
            ).value.trim();


        const password =
            document.getElementById(
                "signup-password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "signup-confirm"
            ).value;


        // =============================================
        // VALIDATION
        // =============================================

        if (!name) {

            errorElement.textContent =
                "Veuillez saisir votre nom complet.";

            return;
        }


        if (!email) {

            errorElement.textContent =
                "Veuillez saisir votre adresse email.";

            return;
        }


        if (password.length < 6) {

            errorElement.textContent =
                "Le mot de passe doit contenir au moins 6 caractères.";

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            errorElement.textContent =
                "Les deux mots de passe ne correspondent pas.";

            return;
        }


        // =============================================
        // CRÉATION DU COMPTE
        // =============================================

        button.disabled = true;

        button.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Création du compte...';


        try {

            const result =
                await signUp(
                    email,
                    password,
                    name,
                    phone
                );


            if (result.success) {

                alert(
                    "Compte créé avec succès !"
                );


                window.location.href =
                    "index.html";


                return;
            }


            errorElement.textContent =
                result.error ||
                "Impossible de créer le compte.";


        } catch (error) {

            console.error(
                "Erreur inscription :",
                error
            );


            errorElement.textContent =
                "Une erreur est survenue pendant la création du compte.";

        }


        button.disabled = false;

        button.innerHTML =
            "Créer mon compte";
    }
);

</script>

</body>

</html>
