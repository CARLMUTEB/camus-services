<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES — Inscription</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f9f9f9; padding: 20px;">

  <div style="max-width: 400px; margin: 40px auto; background: white; padding: 20px; border-radius: 10px; border: 1px solid #eee;">
    <h2 style="text-align: center; font-size: 18px; color: #111; margin-bottom: 5px;">CAMU <span style="color: #d32f2f;">SERVICES</span></h2>
    <p style="text-align: center; font-size: 11px; color: #666; margin-bottom: 20px;">TROUVER . ACHETER . RÉSERVER</p>
    
    <form id="signupForm">
      <div style="margin-bottom: 12px;">
        <label style="font-size: 11px; font-weight: bold; display: block; margin-bottom: 4px;">Nom complet</label>
        <input type="text" id="fullName" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-size: 11px; font-weight: bold; display: block; margin-bottom: 4px;">Email</label>
        <input type="email" id="email" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 15px;">
        <label style="font-size: 11px; font-weight: bold; display: block; margin-bottom: 4px;">Mot de passe</label>
        <input type="password" id="password" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
      </div>
      <button type="submit" style="width: 100%; background: #111; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">S'inscrire</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
      authDomain: "camu-services.firebaseapp.com",
      projectId: "camu-services",
      storageBucket: "camu-services.firebasestorage.app",
      messagingSenderId: "879100396449",
      appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await addDoc(collection(db, "users"), {
          fullName,
          email,
          password,
          role: "entrepreneur",
          status: "actif",
          createdAt: new Date()
        });
        alert("Compte créé avec succès !");
        window.location.href = "profil.html";
      } catch (err) {
        alert("Erreur lors de l'inscription : " + err.message);
      }
    });
  </script>
</body>
</html>
