<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — CAMU SERVICES</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="js/app.js"></script>
    <style>
        .auth-page { max-width: 400px; margin: 60px auto; padding: 20px; background: #fff; border-radius: 16px; box-shadow: var(--shadow); }
        .auth-page h1 { text-align: center; margin-bottom: 24px; font-size: 1.8rem; color: var(--primary); }
        .auth-page input { width: 100%; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 30px; font-size: 1rem; }
        .auth-page button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 30px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .auth-page button:hover { background: var(--primary-dark); }
        .auth-page .link { text-align: center; margin-top: 16px; }
        .auth-page .link a { color: var(--primary); text-decoration: none; }
        .error { color: #d32f2f; text-align: center; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="auth-page">
        <h1>📝 Inscription</h1>
        <div id="register-error" class="error"></div>
        <input type="text" id="register-name" placeholder="Nom complet" required>
        <input type="email" id="register-email" placeholder="Email" required>
        <input type="password" id="register-password" placeholder="Mot de passe (6 caractères min.)" required>
        <input type="tel" id="register-phone" placeholder="Téléphone (optionnel)">
        <button id="register-btn">S'inscrire</button>
        <div class="link">
            <a href="/connexion" data-link>Déjà un compte ? Connectez-vous</a>
        </div>
    </div>

    <script type="module">
        import { signUp } from './js/core/auth.js';
        import { router } from './js/core/router.js';

        document.getElementById('register-btn').addEventListener('click', async () => {
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const phone = document.getElementById('register-phone').value;
            const errorEl = document.getElementById('register-error');
            errorEl.textContent = '';

            if (password.length < 6) {
                errorEl.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
                return;
            }

            const result = await signUp(email, password, name, phone);
            if (result.success) {
                router.navigate('/');
            } else {
                errorEl.textContent = result.error;
            }
        });
    </script>
</body>
</html>
