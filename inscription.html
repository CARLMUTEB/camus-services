<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription — CAMU SERVICES</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body>

<main class="auth-page">

    <h1>Créer un compte</h1>

    <div
        id="register-error"
        class="error"
    ></div>

    <input
        type="text"
        id="register-name"
        placeholder="Nom complet"
    >

    <input
        type="email"
        id="register-email"
        placeholder="Adresse email"
    >

    <input
        type="tel"
        id="register-phone"
        placeholder="Téléphone"
    >

    <input
        type="password"
        id="register-password"
        placeholder="Mot de passe"
    >

    <input
        type="password"
        id="register-confirm"
        placeholder="Confirmer le mot de passe"
    >

    <button id="register-btn">
        Créer mon compte
    </button>

    <div class="auth-links">

        <a href="connexion.html">
            J'ai déjà un compte
        </a>

        <a href="index.html">
            ← Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signUp
} from "./js/core/auth.js";


const button =
    document.getElementById(
        "register-btn"
    );


button.addEventListener(
    "click",
    async () => {

        const name =
            document.getElementById(
                "register-name"
            ).value.trim();

        const email =
            document.getElementById(
                "register-email"
            ).value.trim();

        const phone =
            document.getElementById(
                "register-phone"
            ).value.trim();

        const password =
            document.getElementById(
                "register-password"
            ).value;

        const confirm =
            document.getElementById(
                "register-confirm"
            ).value;

        const error =
            document.getElementById(
                "register-error"
            );


        error.textContent = "";


        if (!name || !email || !password) {

            error.textContent =
                "Veuillez remplir les champs obligatoires.";

            return;

        }


        if (password.length < 6) {

            error.textContent =
                "Le mot de passe doit contenir au moins 6 caractères.";

            return;

        }


        if (password !== confirm) {

            error.textContent =
                "Les mots de passe ne correspondent pas.";

            return;

        }


        button.disabled = true;

        button.textContent =
            "Création du compte...";


        const result =
            await signUp(
                email,
                password,
                name,
                phone
            );


        if (result.success) {

            alert(
                "Votre compte a été créé avec succès."
            );

            window.location.href =
                "index.html";

        } else {

            error.textContent =
                result.error;

            button.disabled = false;

            button.textContent =
                "Créer mon compte";

        }

    }
);

</script>

</body>
</html>
