<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Inscription — CAMU SERVICES</title>

<link
    rel="stylesheet"
    href="css/main.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
>

</head>

<body>

<main class="auth-page">

    <h1>
        <i class="fas fa-user-plus"></i>
        Créer un compte
    </h1>


    <div
        id="signup-error"
        class="error"
    ></div>


    <form id="signup-form">


        <input
            type="text"
            id="signup-name"
            placeholder="Nom complet"
            required
        >


        <input
            type="tel"
            id="signup-phone"
            placeholder="Téléphone"
        >


        <input
            type="email"
            id="signup-email"
            placeholder="Adresse email"
            required
        >


        <input
            type="password"
            id="signup-password"
            placeholder="Mot de passe"
            minlength="6"
            required
        >


        <input
            type="password"
            id="signup-confirm"
            placeholder="Confirmer le mot de passe"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="signup-btn"
        >
            Créer mon compte
        </button>

    </form>


    <div class="auth-links">

        <a href="connexion.html">
            J'ai déjà un compte
        </a>


        <a href="index.html">
            Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signUp
} from "./js/core/auth.js";


const form =
    document.getElementById(
        "signup-form"
    );


const error =
    document.getElementById(
        "signup-error"
    );


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        error.textContent = "";


        const name =
            document.getElementById(
                "signup-name"
            ).value.trim();


        const phone =
            document.getElementById(
                "signup-phone"
            ).value.trim();


        const email =
            document.getElementById(
                "signup-email"
            ).value.trim();


        const password =
            document.getElementById(
                "signup-password"
            ).value;


        const confirm =
            document.getElementById(
                "signup-confirm"
            ).value;


        if (password !== confirm) {

            error.textContent =
                "Les deux mots de passe ne correspondent pas.";

            return;
        }


        const button =
            document.getElementById(
                "signup-btn"
            );


        button.disabled = true;

        button.textContent =
            "Création du compte...";


        const result =
            await signUp(
                email,
                password,
                name,
                phone
            );


        if (result.success) {

            alert(
                "Compte créé avec succès !"
            );

            window.location.href =
                "index.html";

        } else {

            error.textContent =
                result.error;

            button.disabled = false;

            button.textContent =
                "Créer mon compte";
        }

    }
);

</script>

</body>
</html>
