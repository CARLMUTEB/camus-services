<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CAMU SERVICES — Inscription</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    .auth-container {
      max-width: 450px;
      margin: 30px auto;
      padding: 15px;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      border: 1px solid #eeeeee;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .auth-title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #111111;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #555555;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #d32f2f;
    }

    .btn-submit {
      width: 100%;
      background: #d32f2f;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-message {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #666666;
    }

    .login-link a {
      color: #d32f2f;
      font-weight: 800;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <header class="header">

    <a
      href="index.html"
      style="color:white;text-decoration:none;font-size:18px;"
    >

      <i class="fa-solid fa-arrow-left"></i>

    </a>

    <h1>
      CAMU <span>SERVICES</span>
    </h1>

    <div style="width:18px;"></div>

  </header>


  <main class="auth-container">

    <div class="auth-card">

      <h2 class="auth-title">
        Créer un compte
      </h2>

      <p class="auth-subtitle">
        Rejoignez CAMU SERVICES
      </p>


      <form id="inscriptionForm">

        <div class="form-group">

          <label for="nom">
            Nom complet
          </label>

          <input
            type="text"
            id="nom"
            placeholder="Ex : Carl Muteb"
            required
            minlength="2"
          >

        </div>


        <div class="form-group">

          <label for="email">
            Adresse email
          </label>

          <input
            type="email"
            id="email"
            placeholder="nom@exemple.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            placeholder="Minimum 6 caractères"
            required
            minlength="6"
          >

        </div>


        <div class="form-group">

          <label for="passwordConfirm">
            Confirmer le mot de passe
          </label>

          <input
            type="password"
            id="passwordConfirm"
            placeholder="Répétez votre mot de passe"
            required
            minlength="6"
          >

        </div>


        <button
          type="submit"
          class="btn-submit"
          id="submitBtn"
        >

          Créer mon compte

        </button>


        <div
          id="message"
          class="auth-message"
        ></div>


      </form>


      <div class="login-link">

        Vous avez déjà un compte ?

        <a href="connexion.html">
          Se connecter
        </a>

      </div>

    </div>

  </main>


  <script type="module">

    import {
      auth,
      db
    } from "./app.js";


    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    const form =
      document.getElementById(
        "inscriptionForm"
      );


    const button =
      document.getElementById(
        "submitBtn"
      );


    const message =
      document.getElementById(
        "message"
      );


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const nom =
          document
            .getElementById("nom")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const passwordConfirm =
          document
            .getElementById("passwordConfirm")
            .value;


        // ---------------------------------------------
        // VALIDATION
        // ---------------------------------------------

        if (
          password !==
          passwordConfirm
        ) {

          message.style.color =
            "#d32f2f";

          message.textContent =
            "Les mots de passe ne correspondent pas.";

          return;

        }


        if (password.length < 6) {

          message.style.color =
            "#d32f2f";

          message.textContent =
            "Le mot de passe doit contenir au moins 6 caractères.";

          return;

        }


        button.disabled = true;

        button.textContent =
          "Création du compte...";

        message.textContent = "";


        try {

          // -------------------------------------------
          // CRÉATION FIREBASE AUTH
          // -------------------------------------------

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          // -------------------------------------------
          // NOM DE L'UTILISATEUR
          // -------------------------------------------

          await updateProfile(
            user,
            {
              displayName: nom
            }
          );


          // -------------------------------------------
          // PROFIL FIRESTORE
          // -------------------------------------------

          await setDoc(
            doc(
              db,
              "users",
              user.uid
            ),
            {

              uid: user.uid,

              nom: nom,

              email: email,

              role: "client",

              status: "actif",

              createdAt:
                serverTimestamp()

            }
          );


          message.style.color =
            "#2e7d32";

          message.textContent =
            "Compte créé avec succès !";


          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            1000
          );


        } catch (error) {

          console.error(
            "Erreur inscription :",
            error
          );


          message.style.color =
            "#d32f2f";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            message.textContent =
              "Cette adresse email est déjà utilisée.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "Adresse email invalide.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            message.textContent =
              "Le mot de passe est trop faible.";

          }

          else {

            message.textContent =
              "Impossible de créer le compte. Vérifiez votre connexion et réessayez.";

          }


          button.disabled = false;

          button.textContent =
            "Créer mon compte";

        }

      }
    );

  </script>

</body>

</html>
