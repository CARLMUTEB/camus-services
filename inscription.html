<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>CAMU SERVICES — Inscription</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #d32f2f;
      --dark: #111111;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --border: #eeeeee;
      --text: #333333;
      --text-light: #666666;
      --success: #2e7d32;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding-top: 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      color: #ffffff;
      z-index: 1000;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      padding: 15px;
    }

    .card-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-title {
      text-align: center;
      margin-bottom: 5px;
      color: var(--dark);
      font-size: 20px;
      font-weight: 900;
    }

    .form-subtitle {
      text-align: center;
      color: var(--text-light);
      font-size: 12px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      background: #fff;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(211,47,47,0.08);
    }

    .password-help {
      font-size: 10px;
      color: #777;
      margin-top: 5px;
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #666;
    }

    .login-link a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="top-bar">

    <a href="index.html"
       style="color:white; text-decoration:none; font-size:18px;">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div style="font-size:16px; font-weight:900;">
      CAMU
      <span style="color:var(--primary);">SERVICES</span>
    </div>

    <div style="width:18px;"></div>

  </header>


  <!-- CONTENU -->
  <main class="container">

    <div class="card-box">

      <h1 class="form-title">
        Créer un compte
      </h1>

      <p class="form-subtitle">
        Rejoignez CAMU SERVICES gratuitement
      </p>


      <!-- MESSAGE -->
      <div id="messageBox" class="message"></div>


      <!-- FORMULAIRE -->
      <form id="inscriptionForm">

        <!-- NOM -->
        <div class="form-group">

          <label for="nomInsc">
            Nom complet
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-user"></i>

            <input
              type="text"
              id="nomInsc"
              placeholder="Ex : Carl Muteb"
              autocomplete="name"
              required
            >

          </div>

        </div>


        <!-- EMAIL -->
        <div class="form-group">

          <label for="emailInsc">
            Adresse Email
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              id="emailInsc"
              placeholder="Ex : nom@domaine.com"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <!-- MOT DE PASSE -->
        <div class="form-group">

          <label for="mdpInsc">
            Mot de passe
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="mdpInsc"
              placeholder="Minimum 6 caractères"
              autocomplete="new-password"
              minlength="6"
              required
            >

          </div>

          <div class="password-help">
            Le mot de passe doit contenir au minimum 6 caractères.
          </div>

        </div>


        <!-- CONFIRMATION -->
        <div class="form-group">

          <label for="confirmMdp">
            Confirmer le mot de passe
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="confirmMdp"
              placeholder="Confirmez votre mot de passe"
              autocomplete="new-password"
              minlength="6"
              required
            >

          </div>

        </div>


        <!-- BOUTON -->
        <button
          type="submit"
          class="btn-submit"
          id="btnInscription"
        >
          <i class="fa-solid fa-user-plus"></i>
          Créer mon compte
        </button>

      </form>


      <!-- CONNEXION -->
      <div class="login-link">

        Vous avez déjà un compte ?

        <a href="connexion.html">
          Se connecter
        </a>

      </div>

    </div>

  </main>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // ==========================================
    // CONFIGURATION FIREBASE
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",

      authDomain: "camu-services.firebaseapp.com",

      projectId: "camu-services",

      storageBucket: "camu-services.firebasestorage.app",

      messagingSenderId: "879100396449",

      appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"

    };


    // ==========================================
    // INITIALISATION
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTS HTML
    // ==========================================

    const form = document.getElementById("inscriptionForm");

    const messageBox = document.getElementById("messageBox");

    const button = document.getElementById("btnInscription");


    // ==========================================
    // AFFICHER UN MESSAGE
    // ==========================================

    function afficherMessage(message, type) {

      messageBox.textContent = message;

      messageBox.className = "message " + type;

    }


    // ==========================================
    // INSCRIPTION
    // ==========================================

    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const name =
        document.getElementById("nomInsc")
        .value
        .trim();

      const email =
        document.getElementById("emailInsc")
        .value
        .trim()
        .toLowerCase();

      const password =
        document.getElementById("mdpInsc")
        .value;

      const confirmPassword =
        document.getElementById("confirmMdp")
        .value;


      // Vérification du nom

      if (name.length < 2) {

        afficherMessage(
          "Veuillez entrer votre nom complet.",
          "error"
        );

        return;

      }


      // Vérification du mot de passe

      if (password.length < 6) {

        afficherMessage(
          "Le mot de passe doit contenir au moins 6 caractères.",
          "error"
        );

        return;

      }


      // Vérification de confirmation

      if (password !== confirmPassword) {

        afficherMessage(
          "Les deux mots de passe ne correspondent pas.",
          "error"
        );

        return;

      }


      // Désactiver le bouton

      button.disabled = true;

      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Création...';


      try {

        // ==========================================
        // 1. CREATION DU COMPTE AUTHENTICATION
        // ==========================================

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        // ==========================================
        // 2. ENREGISTRER LE NOM DANS AUTH
        // ==========================================

        await updateProfile(user, {

          displayName: name

        });


        // ==========================================
        // 3. CREER users/{UID} DANS FIRESTORE
        // ==========================================

        await setDoc(
          doc(db, "users", user.uid),
          {

            name: name,

            email: email,

            status: "actif",

            role: "user",

            date: serverTimestamp(),

            createdAt: serverTimestamp()

          }
        );


        // ==========================================
        // 4. SUCCES
        // ==========================================

        afficherMessage(
          "Compte créé avec succès ! Redirection...",
          "success"
        );


        form.reset();


        // Redirection

        setTimeout(() => {

          window.location.href = "index.html";

        }, 1500);


      } catch (error) {

        console.error(
          "Erreur inscription :",
          error
        );


        let message =
          "Une erreur est survenue lors de l'inscription.";


        // EMAIL DEJA UTILISE

        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message =
            "Cette adresse email est déjà utilisée.";

        }


        // EMAIL INVALIDE

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "L'adresse email n'est pas valide.";

        }


        // MOT DE PASSE FAIBLE

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          message =
            "Le mot de passe est trop faible.";

        }


        // ERREUR RESEAU

        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Problème de connexion Internet.";

        }


        // AFFICHAGE

        afficherMessage(
          message,
          "error"
        );


        // Réactiver bouton

        button.disabled = false;

        button.innerHTML =
          '<i class="fa-solid fa-user-plus"></i> Créer mon compte';

      }

    });

  </script>

</body>
</html>
