<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAMU SERVICES — Inscription</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="top-bar">
    <a href="index.html" style="color: white; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
    <div style="font-size: 16px; font-weight: 900;">CAMU <span style="color: #d32f2f;">SERVICES</span></div>
    <div style="width: 18px;"></div>
  </header>
  <main class="container">
    <div class="card-box">
      <h2 style="font-size: 16px; margin-top: 0; margin-bottom: 15px; text-align: center; color: #111;">Créer un compte</h2>
      <form id="inscriptionForm" onsubmit="inscrireUtilisateur(event)">
        <div class="form-group"><label>Nom complet</label><input type="text" id="nomInsc" required></div>
        <div class="form-group"><label>Adresse Email</label><input type="email" id="emailInsc" required></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="mdpInsc" required></div>
        <button type="submit" class="btn-submit">S'inscrire</button>
      </form>
      <p style="text-align: center; font-size: 12px; margin-top: 15px;">Déjà un compte ? <a href="profil.html" style="color: #d32f2f;">Se connecter</a></p>
    </div>
  </main>
  <script type="module">
    import { inscriptionClient } from './app.js';
    window.inscrireUtilisateur = async function(event) {
      event.preventDefault();
      const btn = event.target.querySelector('.btn-submit');
      btn.disabled = true; btn.innerText = "Inscription...";
      const nom = document.getElementById('nomInsc').value.trim();
      const email = document.getElementById('emailInsc').value.trim();
      const password = document.getElementById('mdpInsc').value.trim();
      try {
        await inscriptionClient(email, password, nom);
        alert("Inscription réussie !");
        window.location.href = "index.html";
      } catch(e) { alert("Erreur : " + e.message); btn.disabled = false; btn.innerText = "S'inscrire"; }
    }
  </script>
</body>
</html>
