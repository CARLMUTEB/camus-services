<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mon profil — CAMU SERVICES</title>

<link
    rel="stylesheet"
    href="css/main.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
>

</head>

<body>

<main class="profile-page">

    <a
        href="index.html"
        class="back-link"
    >
        <i class="fas fa-arrow-left"></i>
        Accueil
    </a>


    <div class="profile-card">

        <img
            id="profile-avatar"
            src="assets/default-avatar.png"
            alt="Profil"
        >


        <h1 id="profile-name">
            Chargement...
        </h1>


        <p id="profile-email">
            ...
        </p>


        <span
            id="profile-role"
            class="badge"
        >
            Client
        </span>


        <div class="profile-actions">

            <button
                id="logout-btn"
                class="danger-btn"
            >
                <i class="fas fa-sign-out-alt"></i>
                Déconnexion
            </button>

        </div>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "./js/config/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    signOutUser
} from "./js/core/auth.js";


onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "connexion.html";

            return;
        }


        const snapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        const data =
            snapshot.exists()
                ? snapshot.data()
                : {};


        document.getElementById(
            "profile-name"
        ).textContent =
            data.displayName ||
            user.displayName ||
            "Utilisateur";


        document.getElementById(
            "profile-email"
        ).textContent =
            user.email || "";


        document.getElementById(
            "profile-role"
        ).textContent =
            data.role || "client";


        if (data.photoURL) {

            document.getElementById(
                "profile-avatar"
            ).src =
                data.photoURL;
        }

    }
);


document
    .getElementById(
        "logout-btn"
    )
    .addEventListener(
        "click",
        async () => {

            const result =
                await signOutUser();

            if (result.success) {

                window.location.href =
                    "connexion.html";
            }

        }
    );

</script>

</body>
</html>
