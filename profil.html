<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon profil — CAMU SERVICES</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body>

<div class="app-container">

    <header class="top-bar">

        <button
            id="menu-toggle"
            class="menu-btn"
            type="button"
            aria-label="Ouvrir le menu"
        >
            <i class="fas fa-bars"></i>
        </button>

        <div class="logo">
            CAMU SERVICES
        </div>

        <button
            id="profile-btn"
            class="profile-btn"
            type="button"
        >
            <i class="fas fa-user"></i>
            Profil
        </button>

    </header>


    <main class="profile-page">

        <section class="profile-card">

            <div class="profile-avatar">

                <img
                    id="profile-avatar"
                    src="assets/default-avatar.png"
                    alt="Photo de profil"
                >

            </div>


            <h1 id="profile-name">
                Chargement...
            </h1>


            <div
                id="profile-error"
                class="error"
            ></div>


            <div class="profile-info">

                <div class="profile-info-row">

                    <strong>Email</strong>

                    <span id="profile-email">
                        —
                    </span>

                </div>


                <div class="profile-info-row">

                    <strong>Téléphone</strong>

                    <span id="profile-phone">
                        —
                    </span>

                </div>


                <div class="profile-info-row">

                    <strong>Type de compte</strong>

                    <span id="profile-role">
                        —
                    </span>

                </div>

            </div>


            <button
                id="profile-logout"
                class="btn-logout"
                type="button"
                style="margin-top:20px;"
            >
                <i class="fas fa-sign-out-alt"></i>
                Déconnexion
            </button>

        </section>

    </main>


    <footer class="app-footer">

        <ul class="footer-links">

            <li>
                <a href="index.html">
                    ACCUEIL
                </a>
            </li>

            <li>
                <a href="#">
                    À-PROPOS
                </a>
            </li>

            <li>
                <a href="#">
                    CONDITIONS
                </a>
            </li>

            <li>
                <a href="#">
                    CONFIDENTIALITÉ
                </a>
            </li>

            <li>
                <a href="#">
                    CONTACTS
                </a>
            </li>

        </ul>

    </footer>


    <nav class="bottom-nav">

        <a
            href="index.html"
        >
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>

        <a
            href="chat.html"
        >
            <i class="fas fa-comment-dots"></i>
            <span>Chat</span>
        </a>

        <a
            href="publier.html"
        >
            <i class="fas fa-plus-circle"></i>
            <span>Publier</span>
        </a>

        <a
            href="favoris.html"
        >
            <i class="fas fa-heart"></i>
            <span>Favoris</span>
        </a>

    </nav>

</div>


<script type="module">

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    auth,
    db
} from "./js/config/firebase.js";

import {
    signOutUser
} from "./js/core/auth.js";


const nameElement =
    document.getElementById(
        "profile-name"
    );

const emailElement =
    document.getElementById(
        "profile-email"
    );

const phoneElement =
    document.getElementById(
        "profile-phone"
    );

const roleElement =
    document.getElementById(
        "profile-role"
    );

const avatarElement =
    document.getElementById(
        "profile-avatar"
    );

const errorElement =
    document.getElementById(
        "profile-error"
    );

const logoutButton =
    document.getElementById(
        "profile-logout"
    );


function displayRole(role) {

    if (role === "admin") {
        return "Administrateur";
    }

    if (role === "professional") {
        return "Professionnel";
    }

    return "Client";
}


onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "connexion.html";

            return;
        }


        try {

            nameElement.textContent =
                user.displayName ||
                "Utilisateur";

            emailElement.textContent =
                user.email || "—";


            const reference =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDoc(
                    reference
                );


            if (snapshot.exists()) {

                const data =
                    snapshot.data();


                nameElement.textContent =
                    data.displayName ||
                    user.displayName ||
                    "Utilisateur";


                phoneElement.textContent =
                    data.phoneNumber ||
                    "—";


                roleElement.textContent =
                    displayRole(
                        data.role
                    );


                if (data.photoURL) {

                    avatarElement.src =
                        data.photoURL;
                }

            } else {

                phoneElement.textContent =
                    "—";

                roleElement.textContent =
                    "Client";
            }

        } catch (error) {

            console.error(
                "Erreur profil :",
                error
            );

            errorElement.textContent =
                "Impossible de charger les données du profil.";
        }
    }
);


logoutButton.addEventListener(
    "click",
    async () => {

        logoutButton.disabled =
            true;

        logoutButton.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Déconnexion...';


        const result =
            await signOutUser();


        if (result.success) {

            window.location.href =
                "connexion.html";

            return;
        }


        errorElement.textContent =
            result.error ||
            "Impossible de se déconnecter.";

        logoutButton.disabled =
            false;

        logoutButton.innerHTML =
            '<i class="fas fa-sign-out-alt"></i> Déconnexion';
    }
);

</script>

</body>
</html>
