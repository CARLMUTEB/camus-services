<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mon profil — CAMU SERVICES</title>

<link rel="stylesheet" href="css/main.css">

</head>

<body>

<main class="auth-page">

    <h1>Mon profil</h1>

    <div id="profile-content">
        Chargement...
    </div>

    <button
        id="logout-profile"
        style="margin-top:20px;"
    >
        Déconnexion
    </button>

    <div class="auth-links">

        <a href="index.html">
            ← Accueil
        </a>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "./js/config/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const content =
    document.getElementById(
        "profile-content"
    );


onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "connexion.html";

            return;

        }


        const snapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        const data =
            snapshot.exists()
                ? snapshot.data()
                : {};


        content.innerHTML = `

            <p><strong>Nom :</strong>
                ${escapeHtml(
                    data.displayName ||
                    user.displayName ||
                    ""
                )}
            </p>

            <p><strong>Email :</strong>
                ${escapeHtml(
                    user.email || ""
                )}
            </p>

            <p><strong>Téléphone :</strong>
                ${escapeHtml(
                    data.phoneNumber || ""
                )}
            </p>

            <p><strong>Rôle :</strong>
                ${escapeHtml(
                    data.role || "client"
                )}
            </p>

        `;

    }
);


document
    .getElementById(
        "logout-profile"
    )
    .addEventListener(
        "click",
        async () => {

            await signOut(auth);

            window.location.href =
                "index.html";

        }
    );


function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
