<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CAMU SERVICES — Mon profil</title>


  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="top-bar">

  <button
    class="back-btn"
    type="button"
    onclick="history.back()"
  >

    <i class="fa-solid fa-arrow-left"></i>

  </button>


  <div class="logo-text">

    CAMU <span>SERVICES</span>

  </div>


  <div class="spacer"></div>

</header>



<main class="container">

  <section
    style="
      max-width:600px;
      margin:30px auto;
    "
  >


    <!-- =================================================
         CHARGEMENT
         ================================================= -->

    <div
      id="profilLoading"
      style="
        text-align:center;
        padding:40px 20px;
      "
    >

      <i
        class="fa-solid fa-spinner fa-spin"
        style="
          font-size:30px;
          color:#d32f2f;
        "
      ></i>


      <p>
        Vérification de votre compte...
      </p>

    </div>



    <!-- =================================================
         PROFIL CONNECTÉ
         ================================================= -->

    <div
      id="profilConnecte"
      style="display:none;"
    >


      <div
        style="
          background:var(--card,#fff);
          border:1px solid var(--border,#ddd);
          border-radius:15px;
          padding:25px 20px;
          box-shadow:0 5px 20px rgba(0,0,0,.08);
        "
      >


        <div
          style="
            text-align:center;
            margin-bottom:25px;
          "
        >

          <div
            id="avatar"
            style="
              width:85px;
              height:85px;
              margin:auto;
              border-radius:50%;
              background:#ffebee;
              color:#d32f2f;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:34px;
              font-weight:800;
            "
          >

            <i class="fa-solid fa-user"></i>

          </div>


          <h1
            id="nomUtilisateur"
            style="
              font-size:22px;
              margin:15px 0 5px;
            "
          >
            Mon compte
          </h1>


          <p
            id="emailUtilisateur"
            style="
              color:#777;
              font-size:14px;
              margin:0;
            "
          >
          </p>

        </div>



        <!-- État -->

        <div
          style="
            padding:13px;
            border-radius:10px;
            background:#e8f5e9;
            color:#2e7d32;
            text-align:center;
            margin-bottom:20px;
            font-weight:700;
          "
        >

          <i class="fa-solid fa-circle-check"></i>

          Compte connecté

        </div>



        <!-- Informations -->

        <div
          style="
            display:grid;
            gap:12px;
          "
        >

          <div
            style="
              padding:14px;
              background:#f7f7f7;
              border-radius:10px;
            "
          >

            <strong>
              <i class="fa-solid fa-user"></i>
              Nom
            </strong>

            <div
              id="infoNom"
              style="
                margin-top:5px;
                color:#666;
              "
            >
              —
            </div>

          </div>


          <div
            style="
              padding:14px;
              background:#f7f7f7;
              border-radius:10px;
            "
          >

            <strong>
              <i class="fa-solid fa-envelope"></i>
              Email
            </strong>

            <div
              id="infoEmail"
              style="
                margin-top:5px;
                color:#666;
              "
            >
              —
            </div>

          </div>


          <div
            style="
              padding:14px;
              background:#f7f7f7;
              border-radius:10px;
            "
          >

            <strong>
              <i class="fa-solid fa-phone"></i>
              Téléphone
            </strong>

            <div
              id="infoTelephone"
              style="
                margin-top:5px;
                color:#666;
              "
            >
              —
            </div>

          </div>


          <div
            style="
              padding:14px;
              background:#f7f7f7;
              border-radius:10px;
            "
          >

            <strong>
              <i class="fa-solid fa-user-tag"></i>
              Type de compte
            </strong>

            <div
              id="infoRole"
              style="
                margin-top:5px;
                color:#666;
              "
            >
              —
            </div>

          </div>

        </div>



        <!-- Déconnexion -->

        <button
          id="btnDeconnexion"
          type="button"
          style="
            width:100%;
            margin-top:25px;
            min-height:48px;
            border:none;
            border-radius:10px;
            background:#d32f2f;
            color:white;
            font-weight:800;
            cursor:pointer;
          "
        >

          <i class="fa-solid fa-right-from-bracket"></i>

          Se déconnecter

        </button>


      </div>

    </div>



    <!-- =================================================
         NON CONNECTÉ
         ================================================= -->

    <div
      id="profilNonConnecte"
      style="
        display:none;
        text-align:center;
        padding:40px 20px;
      "
    >

      <div
        style="
          width:80px;
          height:80px;
          margin:auto;
          border-radius:50%;
          background:#ffebee;
          color:#d32f2f;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:30px;
        "
      >

        <i class="fa-solid fa-lock"></i>

      </div>


      <h2>
        Vous n'êtes pas connecté
      </h2>


      <p style="color:#777;">

        Connectez-vous pour accéder à votre profil.

      </p>


      <a
        href="connexion.html"
        style="
          display:inline-flex;
          align-items:center;
          justify-content:center;
          gap:8px;
          min-height:46px;
          padding:0 25px;
          background:#d32f2f;
          color:white;
          border-radius:10px;
          text-decoration:none;
          font-weight:800;
        "
      >

        <i class="fa-solid fa-right-to-bracket"></i>

        Se connecter

      </a>

    </div>


  </section>

</main>



<nav class="bottom-nav">

  <a href="index.html">

    <i class="fa-solid fa-house"></i>

    <span>Accueil</span>

  </a>


  <a href="publier.html">

    <i class="fa-solid fa-circle-plus"></i>

    <span>Publier</span>

  </a>


  <a href="chat.html">

    <i class="fa-solid fa-comments"></i>

    <span>Chat</span>

  </a>


  <a href="explorer.html">

    <i class="fa-solid fa-compass"></i>

    <span>Explorer</span>

  </a>

</nav>



<script type="module">

  import {

    auth,

    attendreUtilisateurConnecte,
    obtenirProfil,
    deconnexion

  } from "./app.js";


  const loading =
    document.getElementById(
      "profilLoading"
    );


  const connecte =
    document.getElementById(
      "profilConnecte"
    );


  const nonConnecte =
    document.getElementById(
      "profilNonConnecte"
    );


  const nom =
    document.getElementById(
      "nomUtilisateur"
    );


  const email =
    document.getElementById(
      "emailUtilisateur"
    );


  const infoNom =
    document.getElementById(
      "infoNom"
    );


  const infoEmail =
    document.getElementById(
      "infoEmail"
    );


  const infoTelephone =
    document.getElementById(
      "infoTelephone"
    );


  const infoRole =
    document.getElementById(
      "infoRole"
    );


  const btnDeconnexion =
    document.getElementById(
      "btnDeconnexion"
    );


  async function chargerProfil() {

    try {

      const user =
        await attendreUtilisateurConnecte(
          8000
        );


      console.log(
        "Profil — utilisateur :",
        user
      );


      loading.style.display =
        "none";


      if (!user) {

        nonConnecte.style.display =
          "block";

        return;

      }


      connecte.style.display =
        "block";


      /*
       * Informations Firebase Authentication
       */

      const nomFirebase =
        user.displayName ||
        "Utilisateur";


      nom.textContent =
        nomFirebase;


      email.textContent =
        user.email || "";


      infoEmail.textContent =
        user.email || "—";


      /*
       * Profil Firestore
       */

      const resultat =
        await obtenirProfil(
          user.uid
        );


      if (resultat.success) {

        const data =
          resultat.data;


        const nomComplet =
          (
            data.prenom ||
            ""
          ) +
          " " +
          (
            data.nom ||
            ""
          );


        if (nomComplet.trim()) {

          nom.textContent =
            nomComplet.trim();

          infoNom.textContent =
            nomComplet.trim();

        } else {

          infoNom.textContent =
            "Non renseigné";

        }


        infoTelephone.textContent =
          data.telephone ||
          data.whatsapp ||
          "Non renseigné";


        infoRole.textContent =
          data.role ||
          "client";

      } else {

        infoNom.textContent =
          user.displayName ||
          "Non renseigné";

        infoTelephone.textContent =
          "Non renseigné";

        infoRole.textContent =
          "client";

      }


    } catch (error) {

      console.error(
        "Erreur chargement profil :",
        error
      );


      loading.style.display =
        "none";


      nonConnecte.style.display =
        "block";

    }

  }


  /*
   * Déconnexion
   */

  btnDeconnexion.addEventListener(
    "click",
    async function() {

      btnDeconnexion.disabled =
        true;


      btnDeconnexion.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Déconnexion...';


      await deconnexion();

    }
  );


  chargerProfil();

</script>


</body>
</html>
