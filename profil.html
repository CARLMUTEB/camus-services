<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES - Mon Profil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header class="top-bar"><h2>Mon Profil</h2><a href="admin.html" style="color: #d32f2f;"><i class="fa-solid fa-lock"></i> Admin</a></header>
  <main class="container">
    <div class="profile-card">
      <div class="avatar-box"><i class="fa-solid fa-circle-user"></i></div>
      <h3 id="profileName" class="user-name">Chargement...</h3>
      <p id="profileEmail" class="user-role"></p>
      <a href="compte-entrepreneur.html" class="btn-submit" style="background: #111; margin-bottom: 8px; display: block;">Gérer mes services</a>
      <a href="publier.html" class="btn-submit" style="display: block;">Publier un service</a>
      <button class="btn-logout" onclick="deconnexion()" style="margin-top: 15px;">Se déconnecter</button>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i><span>Publier</span></a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="profil.html" class="active"><i class="fa-solid fa-user"></i><span>Profil</span></a>
  </nav>
  <script type="module">
    import { db, auth, signOut } from './app.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) { const data = snap.data(); document.getElementById("profileName").innerText = data.nom; document.getElementById("profileEmail").innerText = data.email; }
      } else { window.location.href = "inscription.html"; }
    });
    window.deconnexion = async () => { await signOut(auth); window.location.href = "index.html"; }
  </script>
</body>
</html>
