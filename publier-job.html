<!-- CATÉGORIE -->
<div class="form-group">

    <label for="jobCategory">
        Catégorie du poste
    </label>

    <select
        id="jobCategory"
        name="category"
    >
        <option value="">
            Sélectionner
        </option>

        <option value="Cadre de Direction">
            Cadre de Direction
        </option>

        <option value="Cadre intermédiaire">
            Cadre intermédiaire
        </option>

        <option value="Agent de maîtrise">
            Agent de maîtrise
        </option>

        <option value="Employé">
            Employé
        </option>

        <option value="Technicien">
            Technicien
        </option>

        <option value="Ouvrier">
            Ouvrier
        </option>

        <option value="Stagiaire">
            Stagiaire
        </option>

        <option value="Autre">
            Autre
        </option>
    </select>

</div>


<!-- NOMBRE DE POSTES -->
<div class="form-group">

    <label for="jobPositions">
        Nombre de postes à pourvoir
    </label>

    <input
        type="number"
        id="jobPositions"
        name="numberOfPositions"
        min="1"
        value="1"
    >

</div>


<!-- DATE LIMITE -->
<div class="form-group">

    <label for="jobDeadline">
        Date limite de candidature
    </label>

    <input
        type="date"
        id="jobDeadline"
        name="applicationDeadline"
    >

</div>


<!-- DISPONIBILITÉ -->
<div class="form-group">

    <label for="jobAvailability">
        Disponibilité
    </label>

    <input
        type="text"
        id="jobAvailability"
        name="availability"
        placeholder="Ex. Immédiate"
    >

</div>


<!-- DÉPLACEMENTS -->
<div class="form-group">

    <label for="jobTravel">
        Déplacements éventuels
    </label>

    <select
        id="jobTravel"
        name="travelRequired"
    >

        <option value="">
            Non précisé
        </option>

        <option value="Aucun déplacement">
            Aucun déplacement
        </option>

        <option value="Déplacements occasionnels">
            Déplacements occasionnels
        </option>

        <option value="Déplacements fréquents">
            Déplacements fréquents
        </option>

        <option value="Disponible pour voyager au besoin">
            Disponible pour voyager au besoin
        </option>

    </select>

</div>
