<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signalements — CAMU SERVICES</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-signalements.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<main class="admin-main admin-page-no-sidebar">

    <div class="admin-topbar">

        <div class="admin-topbar-left">
            <a href="admin.html" class="admin-back-button">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Retour</span>
            </a>

            <div>
                <h1>Gestion des signalements</h1>
                <p>Examinez les annonces signalées et traitez les problèmes.</p>
            </div>
        </div>

        <button type="button"
                class="admin-refresh-btn"
                id="refreshReportsButton">
            <i class="fa-solid fa-rotate"></i>
            Actualiser
        </button>

    </div>

    <div id="adminReportMessage" class="admin-report-message" hidden></div>

    <section class="report-summary">

        <div class="report-summary-card">
            <div class="report-summary-icon">
                <i class="fa-solid fa-flag"></i>
            </div>
            <div>
                <span>Total des signalements</span>
                <strong id="reportsTotalCount">0</strong>
            </div>
        </div>

        <div class="report-summary-card pending">
            <div class="report-summary-icon">
                <i class="fa-solid fa-hourglass-half"></i>
            </div>
            <div>
                <span>En attente</span>
                <strong id="reportsPendingCount">0</strong>
            </div>
        </div>

        <div class="report-summary-card handled">
            <div class="report-summary-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div>
                <span>Traités</span>
                <strong id="reportsHandledCount">0</strong>
            </div>
        </div>

    </section>

    <section class="report-tools">

        <div class="report-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="adminReportsSearch"
                   type="search"
                   placeholder="Rechercher une annonce, un motif ou un ID...">
        </div>

        <select id="adminReportsStatus">
            <option value="all">Tous les statuts</option>
            <option value="pending">En attente</option>
            <option value="handled">Traités</option>
        </select>

        <button type="button"
                class="report-reset-btn"
                id="clearAdminReportsFilters">
            <i class="fa-solid fa-filter-circle-xmark"></i>
            Réinitialiser
        </button>

    </section>

    <div class="report-results-line">
        <span id="reportsResultCount">0 signalement</span>
    </div>

    <section id="reportsLoading" class="admin-report-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Chargement des signalements...</p>
    </section>

    <section id="reportsEmpty" class="admin-report-state" hidden>
        <i class="fa-solid fa-flag"></i>
        <h2>Aucun signalement</h2>
        <p>Aucun signalement ne correspond aux filtres actuels.</p>
    </section>

    <section id="adminReportsContainer" class="admin-reports-list"></section>

</main>

<div class="admin-report-modal" id="reportDetailsModal" hidden>

    <div class="admin-report-modal-backdrop" data-close-report-modal></div>

    <div class="admin-report-modal-dialog"
         role="dialog"
         aria-modal="true">

        <div class="admin-report-modal-header">

            <div>
                <span class="modal-kicker">Détails du signalement</span>
                <h2 id="reportModalTitle">Signalement</h2>
            </div>

            <button type="button"
                    class="admin-report-modal-close"
                    data-close-report-modal>
                ×
            </button>

        </div>

        <div id="reportModalContent"
             class="admin-report-modal-content"></div>

        <div class="admin-report-modal-actions">

            <button type="button"
                    class="report-secondary-btn"
                    data-close-report-modal>
                Fermer
            </button>

            <button type="button"
                    class="report-primary-btn"
                    id="modalHandleReport">
                <i class="fa-solid fa-check"></i>
                Marquer comme traité
            </button>

        </div>

    </div>

</div>

<style>
/* Cette page n'a volontairement AUCUN sidebar. */
.admin-page-no-sidebar {
    margin-left: 0 !important;
    width: 100% !important;
    max-width: none !important;
}

.admin-page-no-sidebar .admin-topbar-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.admin-back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    white-space: nowrap;
}

@media (max-width: 700px) {
    .admin-page-no-sidebar .admin-topbar {
        padding: 16px;
    }

    .admin-page-no-sidebar .admin-topbar-left {
        gap: 12px;
    }

    .admin-page-no-sidebar .admin-topbar-left h1 {
        font-size: 20px;
    }

    .admin-page-no-sidebar .admin-topbar-left p {
        font-size: 13px;
    }
}
</style>

<script type="module" src="js/admin-signalements.js"></script>

</body>
</html>
