<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - CAMU SERVICES</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #f4f6f9;">

  <header class="top-bar" style="background: #1e293b;">
    <div class="menu-icon" id="openMenu"><i class="fa-solid fa-bars"></i></div>
    <div class="brand-logo">
      <img src="logo.png" alt="Logo CAMU SERVICES">
      <h2>CAMU <span>ADMIN</span></h2>
    </div>
    <div class="user-icon">
      <i class="fa-solid fa-user-shield"></i>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" style="background: #0f172a;">
      <a href="admin.html" class="login-link"><i class="fa-solid fa-user-shield"></i> Espace Admin</a>
      <span class="close-btn" id="closeMenu">&times;</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="index.html"><span>Retour au site</span> <i class="fa-solid fa-angle-right"></i></a></li>
      <li><a href="admin.html"><span>Tableau de bord Admin</span> <i class="fa-solid fa-angle-right"></i></a></li>
    </ul>
  </aside>

  <main class="annonces-container" style="padding-top: 25px; max-width: 900px; margin: 0 auto;">

    <!-- Écran de connexion Admin -->
    <div id="adminLoginForm" class="card" style="max-width: 400px; margin: 40px auto; padding: 25px; text-align: center;">
      <i class="fa-solid fa-lock" style="font-size: 40px; color: #1e293b; margin-bottom: 15px;"></i>
      <h2 style="margin-bottom: 15px;">Connexion Admin</h2>
      <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Entrez le code d'accès administrateur pour continuer.</p>
      
      <input type="password" id="adminPinInput" placeholder="Mot de passe Admin" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 15px;">
      <button onclick="checkAdminAuth()" class="btn-search" style="width: 100%; padding: 12px; background: #1e293b; font-weight: bold;">Accéder au panneau</button>
    </div>

    <!-- Contenu du Panneau Admin -->
    <div id="adminDashboard" style="display: none;">
      
      <!-- Statistiques rapides -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px;">
        <div class="card" style="padding: 15px; background: #fff; border-left: 4px solid #e53935; border-radius: 8px;">
          <small style="color: #666; font-weight: bold;">TOTAL SERVICES</small>
          <h2 id="statServicesCount" style="margin: 5px 0 0 0; color: #111;">0</h2>
        </div>
        <div class="card" style="padding: 15px; background: #fff; border-left: 4px solid #2e7d32; border-radius: 8px;">
          <small style="color: #666; font-weight: bold;">ENTREPRENEURS EN ESSAI</small>
          <h2 id="statTrialCount" style="margin: 5px 0 0 0; color: #111;">0</h2>
        </div>
      </div>

      <!-- Section Gestion des Services -->
      <div class="card" style="padding: 20px; background: #fff; border-radius: 10px; margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
          <h3 style="margin: 0; font-size: 16px;"><i class="fa-solid fa-list-check" style="color: #e53935;"></i> Gestion des Services Publiés</h3>
          <button onclick="loadAdminData()" style="background: #f0f0f0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;"><i class="fa-solid fa-rotate"></i> Actualiser</button>
        </div>

        <div id="adminServicesList"></div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
  <script>
    const openBtn = document.getElementById('openMenu');
    const closeBtn = document.getElementById('closeMenu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    if(openBtn) openBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if(closeBtn) closeBtn.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
    if(overlay) overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });

    // Mot de passe Administrateur par défaut
    const ADMIN_PASSWORD = "admin";

    function checkAdminAuth() {
      const input = document.getElementById('adminPinInput').value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadAdminData();
      } else {
        alert("Mot de passe incorrect.");
      }
    }

    function loadAdminData() {
      const ads = JSON.parse(localStorage.getItem('camus_ads')) || [];
      const servicesList = document.getElementById('adminServicesList');
      
      document.getElementById('statServicesCount').textContent = ads.length;
      document.getElementById('statTrialCount').textContent = ads.length > 0 ? ads.length : 0;

      if (ads.length === 0) {
        servicesList.innerHTML = `<p style="color: #666; font-size: 13px; text-align: center;">Aucun service en ligne.</p>`;
        return;
      }

      servicesList.innerHTML = ads.map(ad => `
        <div style="border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <span style="font-size: 10px; background: #ffebee; color: #e53935; padding: 2px 6px; border-radius: 4px; font-weight: bold;">${ad.category}</span>
            <h4 style="margin: 4px 0 2px 0; font-size: 14px;">${ad.title}</h4>
            <small style="color: #666; font-size: 11px;">Par : <strong>${ad.publisher}</strong> (${ad.city || 'N/A'}) — Tél: ${ad.phone || 'N/A'}</small>
          </div>
          <div>
            <button onclick="adminDeleteService(${ad.id})" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer;">
              <i class="fa-solid fa-trash"></i> Supprimer
            </button>
          </div>
        </div>
      `).join('');
    }

    function adminDeleteService(id) {
      if (confirm("Voulez-vous vraiment supprimer définitivement ce service ?")) {
        let ads = JSON.parse(localStorage.getItem('camus_ads')) || [];
        ads = ads.filter(ad => ad.id !== id);
        localStorage.setItem('camus_ads', JSON.stringify(ads));
        loadAdminData();
      }
    }
  </script>
</body>
</html>
