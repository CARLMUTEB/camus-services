<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administration — CAMU SERVICES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #222; padding-bottom: 80px; }

    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-box { background: #fff; width: 100%; max-width: 360px; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .login-box i.lock-icon { font-size: 40px; color: #d32f2f; margin-bottom: 15px; }
    .login-box h2 { font-size: 18px; color: #111; margin-bottom: 5px; }
    .login-box p { font-size: 12px; color: #666; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 15px; text-align: center; outline: none; }
    .login-box button { width: 100%; background: #d32f2f; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .error-msg { color: #d32f2f; font-size: 11px; font-weight: bold; margin-top: 10px; display: none; }

    .admin-header { background: #111; color: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; height: 60px; }
    .admin-header h1 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .admin-header h1 span { color: #d32f2f; }
    .admin-header a { color: #fff; font-size: 18px; text-decoration: none; }

    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .section-title { font-size: 14px; font-weight: 800; color: #111; margin: 15px 0 10px; text-transform: uppercase; }
    .panel-box { background: #ffffff; border-radius: 10px; padding: 15px; border: 1px solid #e0e0e0; margin-bottom: 15px; }
    .panel-box h4 { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 10px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; height: 65px; }
    .bottom-nav a { text-align: center; color: #666; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 25%; text-decoration: none; }
    .bottom-nav a.active { color: #d32f2f; }
    .bottom-nav i { font-size: 19px; margin-bottom: 3px; }
  </style>
</head>
<body>

  <div id="admin-login-modal" class="login-overlay">
    <div class="login-box">
      <i class="fa-solid fa-user-shield lock-icon"></i>
      <h2>Accès Sécurisé</h2>
      <p>Entrez le mot de passe administrateur (Carl1800)</p>
      <form onsubmit="checkAdminPassword(event)">
        <input type="password" id="admin-pass-input" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
      </form>
      <div id="login-error" class="error-msg">Mot de passe incorrect. Réessayez.</div>
    </div>
  </div>

  <div id="admin-content" style="display: none;">
    <header class="admin-header">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
      <h1>Panneau <span>Administrateur</span></h1>
      <button onclick="logoutAdmin()" style="background:none; border:none; color:#fff; font-size:12px; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Quitter</button>
    </header>

    <main class="container">
      <div class="section-title">Tableau de Bord</div>
      <div class="panel-box">
        <h4>Gestion des profils et abonnements active</h4>
        <p style="font-size: 12px; color: #666;">Bienvenue dans l'espace de gestion de CAMU SERVICES.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i><span>Publier</span></a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="profil.html"><i class="fa-solid fa-user"></i><span>Profil</span></a>
  </nav>

  <script>
    function checkAdminPassword(event) {
      event.preventDefault();
      const inputPass = document.getElementById('admin-pass-input').value;
      const errorMsg = document.getElementById('login-error');

      if (inputPass === 'Carl1800') {
        document.getElementById('admin-login-modal').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        errorMsg.style.display = 'none';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('admin-login-modal').style.display = 'flex';
      document.getElementById('admin-content').style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
    }
  </script>
</body>
</html>
