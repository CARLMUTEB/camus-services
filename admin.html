<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — CAMU SERVICES</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { font-size: 18px; text-transform: uppercase; margin-bottom: 15px; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
    .item-row { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .item-info { font-size: 13px; }
    .item-info strong { display: block; font-size: 14px; }
    .actions { display: flex; gap: 6px; width: 100%; }
    .btn { flex: 1; border: none; padding: 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-warn { background: #fff3e0; color: #e65100; }
    .btn-suspend { background: #ffebee; color: #c62828; }
    .btn-restore { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gestion des comptes entrepreneurs</h1>
    <div>Total comptes : <b id="statComptes">0</b></div>
    <div id="comptesList" style="margin-top: 15px;">Chargement...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
      authDomain: "camu-services.firebaseapp.com",
      projectId: "camu-services",
      storageBucket: "camu-services.firebasestorage.app",
      messagingSenderId: "879100396449",
      appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAdminStats() {
      try {
        const usersSnap = await getDocs(collection(db, "users"));
        document.getElementById('statComptes').innerText = usersSnap.size;

        let comptesHtml = '';
        usersSnap.forEach((docSnap) => {
          const user = docSnap.data();
          const userId = docSnap.id;
          const status = user.status || 'actif';
          const warnings = user.warnings || 0;
          const isSuspended = status === 'suspendu';

          comptesHtml += `
            <div class="item-row">
              <div class="item-info">
                <strong>${user.name || 'Entrepreneur'}</strong>
                <span>${user.email || 'Pas d\'email'} | Statut: <b style="color:${isSuspended ? '#c62828' : '#2e7d32'}">${status.toUpperCase()}</b> | Avertissements: ${warnings}/3</span>
              </div>
              <div class="actions">
                <button onclick="window.warnUser('${userId}', ${warnings})" class="btn btn-warn">⚠️ Avertir</button>
                ${isSuspended ? 
                  `<button onclick="window.restoreUser('${userId}')" class="btn btn-restore">✅ Rétablir</button>` : 
                  `<button onclick="window.suspendUser('${userId}')" class="btn btn-suspend">🚫 Suspendre</button>`
                }
              </div>
            </div>`;
        });
        document.getElementById('comptesList').innerHTML = comptesHtml || 'Aucun utilisateur.';
      } catch (e) { console.error("Erreur admin:", e); }
    }

    window.warnUser = async function(id, currentWarnings) {
      const newWarnings = currentWarnings + 1;
      const updateData = { warnings: newWarnings };
      if (newWarnings >= 3) {
        updateData.status = "suspendu";
        alert("3 avertissements atteints : le compte a été suspendu.");
      } else {
        alert(`Avertissement envoyé (${newWarnings}/3).`);
      }
      await updateDoc(doc(db, "users", id), updateData);
      loadAdminStats();
    };

    window.suspendUser = async function(id) {
      if (confirm("Suspendre ce compte ?")) {
        await updateDoc(doc(db, "users", id), { status: "suspendu" });
        loadAdminStats();
      }
    };

    window.restoreUser = async function(id) {
      if (confirm("Rétablir ce compte ?")) {
        await updateDoc(doc(db, "users", id), { status: "actif", warnings: 0 });
        loadAdminStats();
      }
    };

    document.addEventListener("DOMContentLoaded", loadAdminStats);
  </script>
</body>
</html>
