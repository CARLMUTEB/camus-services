<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - CAMU SERVICES</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #111; color: white; padding-bottom: 80px; }
    .admin-card { background: #222; border: 1px solid #333; }
  </style>
</head>
<body>
  <header class="top-bar" style="background:#000">
    <div class="logo-text">ADMIN <span style="color:#d32f2f">CAMU</span></div>
    <a href="index.html" style="color:white"><i class="fa-solid fa-xmark"></i></a>
  </header>

  <main class="container">
    <div class="section-title" style="color:white">Services en attente</div>
    <div id="adminServicesContainer"><p>Chargement...</p></div>

    <div class="section-title" style="color:white;margin-top:20px">Stats</div>
    <div id="statsContainer" class="admin-card" style="padding:15px;border-radius:10px"></div>
  </main>

  <script type="module">
    import { db } from './app.js';
    import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function loadAdmin() {
      try {
        const snap = await getDocs(collection(db, "services"));
        const usersSnap = await getDocs(collection(db, "users"));
        
        let html = ''; 
        let countAttente = 0;

        snap.forEach((d) => {
          const s = d.data();
          if (s.valide !== true) {
            countAttente++;
            html += `
              <div class="annonce-card admin-card" style="margin-bottom:12px;padding:15px;border-radius:8px;">
                <span class="badge-cat">${s.categorie || 'Général'}</span>
                <h3 style="color:white;margin:8px 0;">${s.titre || ''}</h3>
                <p style="color:#ccc;font-size:12px;margin-bottom:8px;">${s.description || ''}</p>
                <p class="prix" style="margin-bottom:10px;">${s.prix || ''}</p>
                <button onclick="validerService('${d.id}')" style="background:#2e7d32;color:white;border:none;padding:8px 12px;border-radius:5px;margin-right:5px;cursor:pointer;"><i class="fa-solid fa-check"></i> Valider</button>
                <button onclick="refuserService('${d.id}')" style="background:#d32f2f;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;"><i class="fa-solid fa-trash"></i> Refuser / Supprimer</button>
              </div>
            `;
          }
        });

        document.getElementById('adminServicesContainer').innerHTML = html || `<p style="color:#aaa;font-size:12px;">Aucun service en attente de validation.</p>`;
        
        document.getElementById('statsContainer').innerHTML = `
          <p style="margin-bottom:5px;font-size:13px;"><b>Utilisateurs inscrits :</b> ${usersSnap.size}</p>
          <p style="margin-bottom:5px;font-size:13px;"><b>Services totaux :</b> ${snap.size}</p>
          <p style="font-size:13px;"><b>En attente de validation :</b> ${countAttente}</p>
        `;

      } catch (error) {
        console.error("Erreur chargement admin :", error);
        document.getElementById('adminServicesContainer').innerHTML = `<p style="color:#d32f2f;">Erreur de chargement des données admin.</p>`;
      }
    }

    // Actions globales rattachées à window pour les boutons HTML
    window.validerService = async function(id) {
      try {
        await updateDoc(doc(db, "services", id), {
          valide: true
        });
        alert("Service validé avec succès !");
        loadAdmin();
      } catch (error) {
        console.error("Erreur validation :", error);
        alert("Impossible de valider ce service.");
      }
    };

    window.refuserService = async function(id) {
      if (confirm("Voulez-vous vraiment supprimer ce service ?")) {
        try {
          await deleteDoc(doc(db, "services", id));
          alert("Service supprimé.");
          loadAdmin();
        } catch (error) {
          console.error("Erreur suppression :", error);
          alert("Impossible de supprimer ce service.");
        }
      }
    };

    // Lancer au chargement
    loadAdmin();
  </script>
</body>
</html>
