<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - CAMU SERVICES</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 20px auto 80px auto;
      padding: 20px;
    }
    .admin-header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-size: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 4px solid #e53935;
    }
    .stat-card h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }
    .stat-card p {
      font-size: 22px;
      font-weight: bold;
      color: #111;
    }
    .table-container {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #fafafa;
      color: #333;
    }
    .badge-trial {
      background: #fff3cd;
      color: #856404;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-active {
      background: #d4edda;
      color: #155724;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-expired {
      background: #f8d7da;
      color: #721c24;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .btn-action {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .btn-approve { background: #28a745; color: white; }
    .btn-delete { background: #dc3545; color: white; margin-left: 5px; }
  </style>
</head>
<body>

  <!-- Dashboard Admin Header -->
  <main class="admin-container">
    <div class="admin-header">
      <div>
        <h1>👑 Espace Administrateur</h1>
        <p style="font-size: 12px; color: #ccc;">Gestion des essais gratuits & abonnements</p>
      </div>
      <a href="index.html" style="color: white; text-decoration: none; font-size: 13px;"><i class="fa-solid fa-eye"></i> Voir le site</a>
    </div>

    <!-- Statistiques rapides -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total des publications</h3>
        <p id="totalAds">0</p>
      </div>
      <div class="stat-card" style="border-left-color: #ffc107;">
        <h3>En essai gratuit (30j)</h3>
        <p id="trialAds">0</p>
      </div>
      <div class="stat-card" style="border-left-color: #28a745;">
        <h3>Abonnements Payés</h3>
        <p id="paidAds">0</p>
      </div>
    </div>

    <!-- Tableau de gestion des annonces -->
    <div class="table-container">
      <h3 style="margin-bottom: 15px; font-size: 16px;">Gestion des Annonces & Paiements</h3>
      <table>
        <thead>
          <tr>
            <th>Annonce</th>
            <th>Catégorie</th>
            <th>WhatsApp</th>
            <th>Statut Abonnement</th>
            <th>Jours restants</th>
            <th>Actions Admin</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Généré dynamiquement -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // 1. Protection par mot de passe Admin
    (function checkAdminAuth() {
      const savedAuth = sessionStorage.getItem("admin_auth");
      const passCorrect = "1800CARL"; // Mot de passe : 1800CARL

      if (savedAuth !== passCorrect) {
        const inputPass = prompt("🔐 Espace Administrateur - Entrez votre mot de passe :");
        if (inputPass === passCorrect) {
          sessionStorage.setItem("admin_auth", passCorrect);
        } else {
          alert("Mot de passe incorrect ! Accès refusé.");
          window.location.href = "index.html";
        }
      }
    })();é

    // 2. Chargement du tableau de bord
    document.addEventListener("DOMContentLoaded", loadAdminDashboard);

    function loadAdminDashboard() {
      const ads = JSON.parse(localStorage.getItem("user_ads") || "[]");
      const tbody = document.getElementById("adminTableBody");
      
      const totalAdsElem = document.getElementById("totalAds");
      if (totalAdsElem) totalAdsElem.textContent = ads.length;

      let trialCount = 0;
      let paidCount = 0;

      if (!tbody) return;

      if (ads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">Aucune annonce enregistrée pour le moment.</td></tr>`;
        return;
      }

      tbody.innerHTML = ads.map((ad, index) => {
        const createdDate = ad.id || Date.now();
        const daysElapsed = Math.floor((Date.now() - createdDate) / (1000 * 60 * 60 * 24));
        const daysLeft = Math.max(0, 30 - daysElapsed);

        let statusBadge = `<span class="badge-trial">Essai Gratuit</span>`;
        if (ad.isPaid) {
          statusBadge = `<span class="badge-active">Payé (M-Pesa/VISA)</span>`;
          paidCount++;
        } else if (daysLeft === 0) {
          statusBadge = `<span class="badge-expired">Expiré</span>`;
        } else {
          trialCount++;
        }

        return `
          <tr>
            <td><strong>${ad.title || 'Sans titre'}</strong><br><small>${ad.city || 'Non spécifiée'}</small></td>
            <td>${ad.category || 'Général'}</td>
            <td><a href="https://wa.me/${ad.whatsapp}" target="_blank">+${ad.whatsapp || ''}</a></td>
            <td>${statusBadge}</td>
            <td>${ad.isPaid ? 'Illimité' : daysLeft + ' jours'}</td>
            <td>
              <button class="btn-action btn-approve" onclick="togglePaymentStatus(${index})">
                ${ad.isPaid ? 'Rétablir Essai' : 'Valider Paiement'}
              </button>
              <button class="btn-action btn-delete" onclick="deleteAdByAdmin(${index})">Supprimer</button>
            </td>
          </tr>
        `;
      }).join("");

      const trialAdsElem = document.getElementById("trialAds");
      const paidAdsElem = document.getElementById("paidAds");
      if (trialAdsElem) trialAdsElem.textContent = trialCount;
      if (paidAdsElem) paidAdsElem.textContent = paidCount;
    }

    function togglePaymentStatus(index) {
      let ads = JSON.parse(localStorage.getItem("user_ads") || "[]");
      ads[index].isPaid = !ads[index].isPaid;
      localStorage.setItem("user_ads", JSON.stringify(ads));
      loadAdminDashboard();
    }

    function deleteAdByAdmin(index) {
      if (confirm("Voulez-vous vraiment supprimer cette annonce ?")) {
        let ads = JSON.parse(localStorage.getItem("user_ads") || "[]");
        ads.splice(index, 1);
        localStorage.setItem("user_ads", JSON.stringify(ads));
        loadAdminDashboard();
      }
    }
  </script>
</body>
</html>
