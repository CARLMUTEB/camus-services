<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Publiez facilement votre annonce sur CAMU SERVICES."
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>
        Publier une annonce — CAMU SERVICES
    </title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- =====================================================
         CSS PRINCIPAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =====================================================
         STYLE DE LA PAGE
    ====================================================== -->

    <style>

        /* =================================================
           RESET LOCAL
        ================================================= */

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f6f8;
        }


        /* =================================================
           CONTENEUR
        ================================================= */

        .publish-page {
            width: min(100%, 850px);
            margin: 0 auto;
            padding: 20px 16px 100px;
        }


        /* =================================================
           HEADER
        ================================================= */

        .publish-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }


        .publish-back {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #ffffff;
            color: #111827;

            text-decoration: none;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, .08);
        }


        .publish-header-text h1 {
            margin: 0;

            font-size: 24px;
            line-height: 1.2;

            color: #111827;
        }


        .publish-header-text p {
            margin: 5px 0 0;

            font-size: 13px;

            color: #6b7280;
        }


        /* =================================================
           CARTE FORMULAIRE
        ================================================= */

        .publish-card {
            background: #ffffff;

            border-radius: 20px;

            padding: 22px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .07);
        }


        /* =================================================
           SECTIONS
        ================================================= */

        .publish-section {
            margin-bottom: 28px;
        }


        .publish-section:last-child {
            margin-bottom: 0;
        }


        .publish-section-title {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 15px;

            font-size: 17px;
            font-weight: 800;

            color: #111827;
        }


        .publish-section-title i {
            color: #111827;
        }


        /* =================================================
           FORM GROUP
        ================================================= */

        .form-group {
            margin-bottom: 17px;
        }


        .form-group:last-child {
            margin-bottom: 0;
        }


        .form-label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #1f2937;
        }


        .required {
            color: #dc2626;
        }


        /* =================================================
           INPUTS
        ================================================= */

        .form-control {

            width: 100%;

            min-height: 48px;

            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 11px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, .12);

        }


        textarea.form-control {

            min-height: 130px;

            resize: vertical;

            line-height: 1.55;

        }


        select.form-control {

            cursor: pointer;

        }


        /* =================================================
           PRIX
        ================================================= */

        .price-row {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                130px;

            gap: 10px;

        }


        /* =================================================
           PHOTOS
        ================================================= */

        .publish-images-box {

            padding: 15px;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            background: #fafafa;

        }


        .photo-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

        }


        .photo-action-btn {

            min-height: 52px;

            border: 0;

            border-radius: 12px;

            padding: 12px;

            background: #111827;

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition:
                transform .15s ease,
                background .2s ease;

        }


        .photo-action-btn:hover {

            background: #1f2937;

        }


        .photo-action-btn:active {

            transform: scale(.98);

        }


        .photo-action-btn i {

            font-size: 17px;

        }


        /* Galerie */

        #galleryButton {

            background: #374151;

        }


        /* =================================================
           APERCU PHOTOS
        ================================================= */

        .photo-preview {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 9px;

            margin-top: 15px;

        }


        .photo-preview-item {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 11px;

            background: #e5e7eb;

        }


        .photo-preview-item img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .photo-help {

            margin: 10px 0 0;

            color: #6b7280;

            font-size: 12px;

            text-align: center;

        }


        /* =================================================
           CONDITIONS
        ================================================= */

        .terms-box {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            padding: 14px;

            border-radius: 12px;

            background: #f9fafb;

            border: 1px solid #e5e7eb;

        }


        .terms-box input {

            width: 18px;

            height: 18px;

            margin-top: 1px;

            flex-shrink: 0;

            cursor: pointer;

        }


        .terms-box label {

            font-size: 13px;

            line-height: 1.5;

            color: #4b5563;

            cursor: pointer;

        }


        .terms-box a {

            color: #2563eb;

            font-weight: 700;

            text-decoration: none;

        }


        /* =================================================
           MESSAGE
        ================================================= */

        #publishMessage {

            display: none;

            margin-bottom: 18px;

            padding: 13px 15px;

            border-radius: 11px;

            font-size: 13px;

            line-height: 1.5;

        }


        #publishMessage.error {

            display: block;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

        }


        #publishMessage.success {

            display: block;

            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;

        }


        /* =================================================
           BOUTON PUBLICATION
        ================================================= */

        .publish-submit {

            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 13px;

            background: #111827;

            color: #ffffff;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            transition:
                background .2s ease,
                transform .15s ease;

        }


        .publish-submit:hover {

            background: #1f2937;

        }


        .publish-submit:active {

            transform: scale(.99);

        }


        .publish-submit:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        /* =================================================
           NOTE
        ================================================= */

        .publish-note {

            margin-top: 12px;

            text-align: center;

            font-size: 12px;

            color: #6b7280;

            line-height: 1.5;

        }


        /* =================================================
           NAVIGATION BAS DE PAGE
        ================================================= */

        .publish-bottom-nav {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffffff;

            border-top: 1px solid #e5e7eb;

            box-shadow:
                0 -4px 18px
                rgba(0, 0, 0, .06);

        }


        .publish-bottom-nav-inner {

            width: min(100%, 600px);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            height: 100%;

        }


        .publish-nav-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            text-decoration: none;

            color: #6b7280;

            font-size: 10px;

            font-weight: 700;

        }


        .publish-nav-item i {

            font-size: 18px;

        }


        .publish-nav-item.active {

            color: #111827;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .publish-page {

                padding:
                    15px
                    12px
                    90px;

            }


            .publish-card {

                padding: 17px;

                border-radius: 16px;

            }


            .publish-header-text h1 {

                font-size: 21px;

            }


            .publish-header-text p {

                font-size: 12px;

            }


            .price-row {

                grid-template-columns: 1fr;

            }


            .photo-buttons {

                grid-template-columns: 1fr;

            }


            .photo-preview {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .publish-section-title {

                font-size: 16px;

            }

        }


        /* =================================================
           PETITS TELEPHONES
        ================================================= */

        @media (max-width: 380px) {

            .publish-page {

                padding-left: 9px;
                padding-right: 9px;

            }


            .publish-card {

                padding: 14px;

            }


            .photo-preview {

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 6px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main class="publish-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="publish-header">

            <a
                href="index.html"
                class="publish-back"
                aria-label="Retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <div class="publish-header-text">

                <h1>
                    Publier une annonce
                </h1>

                <p>
                    Présentez votre produit ou service
                </p>

            </div>

        </header>



        <!-- =================================================
             CARTE
        ================================================== -->

        <section class="publish-card">


            <!-- =================================================
                 FORMULAIRE
            ================================================== -->

            <form
                id="publishForm"
                novalidate
            >


                <!-- =================================================
                     MESSAGE
                ================================================== -->

                <div
                    id="publishMessage"
                    role="alert"
                ></div>



                <!-- =================================================
                     INFORMATIONS PRINCIPALES
                ================================================== -->

                <section class="publish-section">

                    <div class="publish-section-title">

                        <i class="fa-solid fa-circle-info"></i>

                        <span>
                            Informations de l'annonce
                        </span>

                    </div>


                    <!-- TITRE -->

                    <div class="form-group">

                        <label
                            for="publishTitle"
                            class="form-label"
                        >
                            Titre de l'annonce
                            <span class="required">*</span>
                        </label>


                        <input
                            type="text"
                            id="publishTitle"
                            class="form-control"
                            placeholder="Ex. Maison à vendre à Lubumbashi"
                            maxlength="120"
                            autocomplete="off"
                            required
                        >

                    </div>



                    <!-- PRIX -->

                    <div class="form-group">

                        <label
                            class="form-label"
                        >
                            Prix
                            <span class="required">*</span>
                        </label>


                        <div class="price-row">

                            <input
                                type="number"
                                id="publishPrice"
                                class="form-control"
                                placeholder="Ex. 15000"
                                min="0"
                                step="0.01"
                                inputmode="decimal"
                                required
                            >


                            <select
                                id="publishCurrency"
                                class="form-control"
                                required
                            >

                                <option value="USD">
                                    USD $
                                </option>

                                <option value="CDF">
                                    CDF FC
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- CATEGORIE -->

                    <div class="form-group">

                        <label
                            for="publishCategory"
                            class="form-label"
                        >
                            Catégorie
                            <span class="required">*</span>
                        </label>


                        <select
                            id="publishCategory"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Chargement des catégories...
                            </option>

                        </select>

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label
                            for="publishDescription"
                            class="form-label"
                        >
                            Description
                            <span class="required">*</span>
                        </label>


                        <textarea
                            id="publishDescription"
                            class="form-control"
                            placeholder="Décrivez votre produit ou service..."
                            maxlength="3000"
                            required
                        ></textarea>

                    </div>

                </section>



                <!-- =================================================
                     LOCALISATION
                ================================================== -->

                <section class="publish-section">

                    <div class="publish-section-title">

                        <i class="fa-solid fa-location-dot"></i>

                        <span>
                            Localisation
                        </span>

                    </div>


                    <!-- VILLE -->

                    <div class="form-group">

                        <label
                            for="publishCity"
                            class="form-label"
                        >
                            Ville
                            <span class="required">*</span>
                        </label>


                        <select
                            id="publishCity"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Chargement des villes...
                            </option>

                        </select>

                    </div>



                    <!-- QUARTIER -->

                    <div class="form-group">

                        <label
                            for="publishNeighborhood"
                            class="form-label"
                        >
                            Quartier / Commune
                        </label>


                        <input
                            type="text"
                            id="publishNeighborhood"
                            class="form-control"
                            placeholder="Ex. Kenya, Golf, Katuba..."
                            maxlength="100"
                            autocomplete="address-level3"
                        >

                    </div>

                </section>



                <!-- =================================================
                     PHOTOS
                ================================================== -->

                <section class="publish-section">

                    <div class="publish-section-title">

                        <i class="fa-solid fa-images"></i>

                        <span>
                            Photos
                        </span>

                    </div>


                    <div class="publish-images-box">


                        <!-- BOUTONS -->

                        <div class="photo-buttons">


                            <!-- CAMERA -->

                            <button
                                type="button"
                                id="cameraButton"
                                class="photo-action-btn"
                            >

                                <i
                                    class="fa-solid fa-camera"
                                ></i>

                                <span>
                                    Prendre une photo
                                </span>

                            </button>



                            <!-- GALERIE -->

                            <button
                                type="button"
                                id="galleryButton"
                                class="photo-action-btn"
                            >

                                <i
                                    class="fa-solid fa-images"
                                ></i>

                                <span>
                                    Choisir dans la galerie
                                </span>

                            </button>

                        </div>



                        <!-- =================================================
                             INPUT CAMERA
                        ================================================== -->

                        <input
                            type="file"
                            id="cameraInput"
                            accept="image/*"
                            capture="environment"
                            hidden
                        >



                        <!-- =================================================
                             INPUT GALERIE
                        ================================================== -->

                        <input
                            type="file"
                            id="galleryInput"
                            accept="image/*"
                            multiple
                            hidden
                        >



                        <!-- =================================================
                             APERCU
                        ================================================== -->

                        <div
                            id="photoPreview"
                            class="photo-preview"
                        ></div>


                        <p
                            class="photo-help"
                        >
                            Maximum 8 images — 5 MB par image.
                        </p>

                    </div>

                </section>



                <!-- =================================================
                     CONTACT
                ================================================== -->

                <section class="publish-section">

                    <div class="publish-section-title">

                        <i class="fa-brands fa-whatsapp"></i>

                        <span>
                            Contact
                        </span>

                    </div>


                    <div class="form-group">

                        <label
                            for="publishWhatsapp"
                            class="form-label"
                        >
                            Numéro WhatsApp
                            <span class="required">*</span>
                        </label>


                        <input
                            type="tel"
                            id="publishWhatsapp"
                            class="form-control"
                            placeholder="Ex. +243 81 000 00 00"
                            autocomplete="tel"
                            inputmode="tel"
                            maxlength="25"
                            required
                        >

                    </div>

                </section>



                <!-- =================================================
                     CONDITIONS
                ================================================== -->

                <section class="publish-section">

                    <div class="terms-box">

                        <input
                            type="checkbox"
                            id="publishTerms"
                            required
                        >


                        <label
                            for="publishTerms"
                        >

                            J'accepte les

                            <a
                                href="conditions.html"
                                target="_blank"
                            >
                                conditions d'utilisation
                            </a>

                            et les règles de publication
                            de CAMU SERVICES.

                        </label>

                    </div>

                </section>



                <!-- =================================================
                     BOUTON
                ================================================== -->

                <button
                    type="submit"
                    id="publishButton"
                    class="publish-submit"
                >

                    <i
                        class="fa-solid fa-bullhorn"
                    ></i>

                    Publier mon annonce

                </button>


                <p class="publish-note">

                    Votre annonce sera enregistrée après
                    validation des informations.

                </p>


            </form>

        </section>

    </main>



    <!-- =====================================================
         NAVIGATION MOBILE
    ====================================================== -->

    <nav class="publish-bottom-nav">

        <div class="publish-bottom-nav-inner">


            <a
                href="index.html"
                class="publish-nav-item"
            >

                <i
                    class="fa-solid fa-house"
                ></i>

                <span>
                    Accueil
                </span>

            </a>



            <a
                href="publier.html"
                class="publish-nav-item active"
            >

                <i
                    class="fa-solid fa-circle-plus"
                ></i>

                <span>
                    Publier
                </span>

            </a>



            <a
                href="chat.html"
                class="publish-nav-item"
            >

                <i
                    class="fa-solid fa-comments"
                ></i>

                <span>
                    Chat
                </span>

            </a>



            <a
                href="profil.html"
                class="publish-nav-item"
            >

                <i
                    class="fa-solid fa-user"
                ></i>

                <span>
                    Profil
                </span>

            </a>

        </div>

    </nav>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/publier.js"
    ></script>


</body>

</html>
