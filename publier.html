<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier une annonce - CAMUS SERVICES</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="top-bar">
    <div class="menu-icon" id="openMenu"><i class="fa-solid fa-bars"></i></div>
    <div class="brand-logo">
      <img src="logo.png" alt="Logo CAMUS SERVICES">
      <h2>CAMUS <span>SERVICES</span></h2>
    </div>
    <div class="user-icon"><i class="fa-solid fa-circle-user"></i></div>
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="#" class="login-link"><i class="fa-solid fa-user-check"></i> Connexion</a>
      <span class="close-btn" id="closeMenu">&times;</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="index.html"><span>Accueil</span> <i class="fa-solid fa-angle-right"></i></a></li>
      <li><a href="publier.html"><span>Publier une annonce</span> <i class="fa-solid fa-angle-right"></i></a></li>
      <li><a href="chat.html"><span>Discussions</span> <i class="fa-solid fa-angle-right"></i></a></li>
      <li><a href="favoris.html"><span>Mes Favoris</span> <i class="fa-solid fa-angle-right"></i></a></li>
    </ul>
  </aside>

  <main class="annonces-container" style="padding-top: 30px;">
    <div class="card" style="max-width: 600px; margin: 0 auto; padding: 25px;">
      <h2 style="text-align: center; margin-bottom: 10px;">Publier une annonce</h2>
      <p style="text-align: center; color: #666; font-size: 13px; margin-bottom: 25px;">Remplissez le formulaire ci-dessous pour rendre votre service visible auprès de nos clients.</p>
      
      <form id="publishForm">
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px;"><i class="fa-solid fa-heading" style="color: #e53935;"></i> Titre de l'annonce</label>
          <input type="text" id="title" placeholder="Ex: Salon de Coiffure Pro, Vente de véhicule..." required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px;"><i class="fa-solid fa-list" style="color: #e53935;"></i> Catégorie</label>
          <select id="category" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff;">
            <option value="Services">Services</option>
            <option value="Ventes">Ventes</option>
            <option value="Emplois">Emplois</option>
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px;"><i class="fa-solid fa-align-left" style="color: #e53935;"></i> Description</label>
          <textarea id="description" rows="4" placeholder="Décrivez votre service ou produit..." required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;"></textarea>
        </div>

        <button type="submit" class="btn-search" style="width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; width: 100%;">Publier l'annonce</button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html" class="nav-item active"><i class="fa-solid fa-plus-circle"></i><span>Publier</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="favoris.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>Favoris</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    const openBtn = document.getElementById('openMenu');
    const closeBtn = document.getElementById('closeMenu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    if(openBtn) openBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if(closeBtn) closeBtn.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
    if(overlay) overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
  </script>
</body>
</html>
