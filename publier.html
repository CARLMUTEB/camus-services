<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publier une annonce — CAMU SERVICES</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>

<body>

<header class="top-bar">
    <button id="back-btn" class="menu-btn">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="logo">CAMU SERVICES</div>

    <button id="home-btn" class="profile-btn">
        <i class="fas fa-home"></i>
    </button>
</header>

<main class="publish-page">

    <div class="publish-header">
        <h1><i class="fas fa-plus-circle"></i> Publier une annonce</h1>
        <p>Présentez votre produit ou service aux utilisateurs de CAMU SERVICES.</p>
    </div>

    <div id="publish-message" class="publish-message"></div>

    <form id="publish-form">

        <div class="form-group">
            <label for="title">Titre de l'annonce *</label>

            <input
                type="text"
                id="title"
                maxlength="100"
                placeholder="Exemple : Maison moderne à louer"
                required
            >
        </div>


        <div class="form-group">
            <label for="category">Catégorie *</label>

            <select id="category" required>

                <option value="">Sélectionner une catégorie</option>

                <option value="Immobilier">Immobilier</option>
                <option value="Véhicules">Véhicules</option>
                <option value="Services">Services</option>
                <option value="Commerce">Commerce</option>
                <option value="Emploi">Emploi</option>
                <option value="Électronique">Électronique</option>
                <option value="Mode">Mode</option>
                <option value="Autres">Autres</option>

            </select>
        </div>


        <div class="form-row">

            <div class="form-group">
                <label for="city">Ville *</label>

                <input
                    type="text"
                    id="city"
                    placeholder="Exemple : Lubumbashi"
                    required
                >
            </div>

            <div class="form-group">
                <label for="commune">Commune</label>

                <input
                    type="text"
                    id="commune"
                    placeholder="Exemple : Lubumbashi"
                >
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label for="price">Prix *</label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    placeholder="Exemple : 500"
                    required
                >
            </div>


            <div class="form-group">
                <label for="currency">Devise</label>

                <select id="currency">

                    <option value="USD">USD</option>
                    <option value="CDF">CDF</option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label for="description">
                Description *
            </label>

            <textarea
                id="description"
                rows="6"
                maxlength="3000"
                placeholder="Décrivez votre produit ou service..."
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="phone">
                Téléphone de contact
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="+243..."
            >

        </div>


        <div class="form-group">

            <label for="image">
                Image principale
            </label>

            <input
                type="file"
                id="image"
                accept="image/jpeg,image/png,image/webp"
            >

            <small>
                Image JPG, PNG ou WEBP — maximum 5 MB.
            </small>

        </div>


        <div id="image-preview-container" class="image-preview-container">

            <img id="image-preview" alt="Aperçu">

        </div>


        <div class="publish-actions">

            <button
                type="button"
                id="cancel-btn"
                class="cancel-btn"
            >
                Annuler
            </button>

            <button
                type="submit"
                id="publish-btn"
                class="publish-btn"
            >
                <i class="fas fa-paper-plane"></i>
                Publier
            </button>

        </div>

    </form>

</main>


<style>

.publish-page {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.publish-header {
    text-align: center;
    margin-bottom: 25px;
}

.publish-header h1 {
    color: var(--primary);
    margin-bottom: 8px;
}

.publish-header p {
    color: var(--text-secondary);
}

#publish-form {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    outline: none;
    background: white;
}

.form-group textarea {
    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--primary);
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group small {
    display: block;
    color: var(--text-secondary);
    margin-top: 5px;
}

.image-preview-container {
    display: none;
    margin: 15px 0;
}

.image-preview-container img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 12px;
}

.publish-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.publish-actions button {
    flex: 1;
    border: none;
    padding: 14px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
}

.cancel-btn {
    background: #eeeeee;
    color: #333;
}

.publish-btn {
    background: var(--primary);
    color: white;
}

.publish-btn:hover {
    background: var(--primary-dark);
}

.publish-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.publish-message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
}

.publish-message.success {
    display: block;
    background: #e8f5e9;
    color: #2e7d32;
}

.publish-message.error {
    display: block;
    background: #ffebee;
    color: #c62828;
}

@media (max-width: 600px) {

    .publish-page {
        margin: 10px auto;
        padding: 12px;
    }

    #publish-form {
        padding: 18px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

}

</style>


<script type="module" src="js/pages/publier.js"></script>

</body>
</html>
