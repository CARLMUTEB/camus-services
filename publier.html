<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES — Publier</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="top-bar">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="logo-text">CAMU <span>SERVICES</span></div><div></div>
  </header>
  <main class="container">
    <div class="section-title"><i class="fa-solid fa-circle-plus" style="color: #d32f2f;"></i> Publier un nouveau service</div>
    <div class="card-box">
      <form id="publierForm" onsubmit="publierService(event)">
        <div class="form-group"><label>Titre</label><input type="text" id="titreService" required></div>
        <div class="form-group"><label>Catégorie</label>
          <select id="categorieService" required>
            <option>Technique & Maintenance</option><option>BTP & Construction</option><option>Informatique & Numérique</option>
          </select>
        </div>
        <div class="form-group"><label>Prix</label><input type="text" id="prixService" required></div>
        <div class="form-group"><label>Description</label><textarea id="descService" required></textarea></div>
        <button type="submit" class="btn-submit">Mettre en ligne</button>
      </form>
    </div>
    <div class="section-title"><i class="fa-solid fa-list" style="color: #d32f2f;"></i> Services Disponibles</div>
    <div id="publicAdsContainer"><p style="text-align: center;">Chargement...</p></div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html" class="active"><i class="fa-solid fa-circle-plus"></i><span>Publier</span></a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="profil.html"><i class="fa-solid fa-user"></i><span>Profil</span></a>
  </nav>
  <script type="module">
    import { db, auth } from './app.js';
    import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    let currentUserId = null;
    onAuthStateChanged(auth, (user) => { if(user){ currentUserId = user.uid; loadPublicAds(); } else { window.location.href = "inscription.html"; } });
    async function loadPublicAds() {
      const container = document.getElementById('publicAdsContainer');
      const snap = await getDocs(collection(db, "services"));
      let html = ''; let count = 0;
      snap.forEach((d) => { const ad = d.data(); if(ad.valide !== false){ count++; html += `<div class="ad-card"><span class="badge-cat">${ad.categorie}</span><h4>${ad.titre}</h4><p>${ad.description}</p><p class="prix">${ad.prix}</p></div>`; } });
      container.innerHTML = count === 0 ? `<p>Aucun service validé.</p>` : html;
    }
    window.publierService = async function(event) {
      event.preventDefault();
      await addDoc(collection(db, "services"), {
        titre: document.getElementById('titreService').value.trim(),
        categorie: document.getElementById('categorieService').value,
        prix: document.getElementById('prixService').value.trim(),
        description: document.getElementById('descService').value.trim(),
        ownerId: currentUserId, valide: false, createdAt: serverTimestamp()
      });
      alert("Service envoyé ! En attente de validation admin.");
      document.getElementById('publierForm').reset();
    }
  </script>
</body>
</html>
