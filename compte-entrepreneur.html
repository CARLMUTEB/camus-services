<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Services - CAMU</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="top-bar">
    <a href="profil.html"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="logo-text">Mes <span>Services</span></div><div></div>
  </header>

  <main class="container">
    <div id="mesServicesContainer"><p>Chargement...</p></div>
  </main>

  <script type="module">
    import { db, auth } from './app.js';
    import { collection, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if(user){ chargerMesServices(user.uid); } 
      else { window.location.href = "inscription.html"; }
    });

    async function chargerMesServices(uid) {
      const container = document.getElementById('mesServicesContainer');
      const q = query(collection(db, "services"), where("ownerId", "==", uid));
      const snap = await getDocs(q);
      
      if (snap.empty) { container.innerHTML = `<p>Vous n'avez publié aucun service.</p>`; return; }

      let html = '';
      snap.forEach((d) => {
        const s = d.data();
        const statut = s.valide ? `<span style="color:green;">Validé</span>` : `<span style="color:orange;">En attente</span>`;
        html += `
          <div class="annonce-card">
            <span class="badge-cat">${s.categorie}</span> ${statut}
            <h3>${s.titre}</h3>
            <p>${s.description}</p>
            <p class="prix">${s.prix}</p>
            <button onclick="supprimer('${d.id}')" style="background:#d32f2f;color:white;border:none;padding:5px 10px;border-radius:5px;font-size:11px;">Supprimer</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.supprimer = async (id) => {
      if(confirm("Supprimer ce service ?")){
        await deleteDoc(doc(db, "services", id));
        location.reload();
      }
    }
  </script>
</body>
</html>
