<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES - Espace Entrepreneur</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f9f9f9; padding-bottom: 70px;">

  <header class="top-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="index.html" style="color: white; text-decoration: none; font-size: 18px;"><i class="fa-solid fa-arrow-left"></i></a>
      <h2 style="font-size: 16px; margin: 0; color: white;">Mes Services Publiés</h2>
    </div>
  </header>

  <main style="max-width: 600px; margin: 20px auto; padding: 0 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="font-size: 15px; font-weight: bold; margin: 0;">Gestion de mes annonces</h3>
      <a href="publier.html" style="background: #d32f2f; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-plus"></i> Nouveau</a>
    </div>

    <div id="myAdsContainer"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html" class="nav-item"><i class="fa-solid fa-plus-circle"></i><span>Publier</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="favoris.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>Favoris</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    function loadMyAds() {
      const container = document.getElementById('myAdsContainer');
      let ads = JSON.parse(localStorage.getItem('camus_ads')) || [];

      if (ads.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px 15px; background: #fff; border-radius: 10px; border: 1px dashed #ccc;">
            <p style="color: #666; font-size: 13px;">Vous n'avez encore publié aucun service.</p>
            <a href="publier.html" style="color: #d32f2f; font-weight: bold; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 8px;">Publier mon premier service</a>
          </div>`;
        return;
      }

      container.innerHTML = ads.map(ad => `
        <div style="background: white; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <span style="font-size: 10px; background: #ffebee; color: #d32f2f; padding: 2px 6px; border-radius: 10px; font-weight: bold;">${ad.category}</span>
            <h4 style="font-size: 14px; font-weight: bold; margin: 5px 0;">${ad.title}</h4>
            <p style="font-size: 12px; color: #666; margin: 0;">Prix : <strong>${ad.price}</strong></p>
          </div>
          <button onclick="deleteAd(${ad.id})" style="background: #ffebee; color: #d32f2f; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function deleteAd(id) {
      if (confirm("Voulez-vous vraiment supprimer ce service ?")) {
        let ads = JSON.parse(localStorage.getItem('camus_ads')) || [];
        ads = ads.filter(ad => ad.id !== id);
        localStorage.setItem('camus_ads', JSON.stringify(ads));
        loadMyAds();
      }
    }

    document.addEventListener('DOMContentLoaded', loadMyAds);
  </script>
</body>
</html>
