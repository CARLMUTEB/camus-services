<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES - Espace Entrepreneur</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f9f9f9; padding-bottom: 70px;">

  <header class="top-bar" style="background: #111; padding: 15px; color: white; display: flex; align-items: center; gap: 10px;">
    <a href="index.html" style="color: white; text-decoration: none; font-size: 18px;"><i class="fa-solid fa-arrow-left"></i></a>
    <h2 style="font-size: 16px; margin: 0; color: white;">Mes Services Publiés</h2>
  </header>

  <main style="max-width: 600px; margin: 20px auto; padding: 0 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="font-size: 15px; font-weight: bold; margin: 0;">Gestion de mes annonces</h3>
      <a href="publier.html" style="background: #d32f2f; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-plus"></i> Nouveau</a>
    </div>

    <div id="myAdsContainer">
      <p style="text-align: center; font-size: 12px; color: #666;">Chargement de vos annonces...</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html" class="nav-item"><i class="fa-solid fa-plus-circle"></i><span>Publier</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="profil.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profil</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
      authDomain: "camu-services.firebaseapp.com",
      projectId: "camu-services",
      storageBucket: "camu-services.firebasestorage.app",
      messagingSenderId: "879100396449",
      appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadMyAdsFirebase() {
      const container = document.getElementById('myAdsContainer');
      try {
        const querySnapshot = await getDocs(collection(db, "services"));
        let adsHtml = '';
        let count = 0;

        querySnapshot.forEach((d) => {
          count++;
          const ad = d.data();
          const id = d.id;
          adsHtml += `
            <div style="background: white; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 10px; background: #ffebee; color: #d32f2f; padding: 2px 6px; border-radius: 10px; font-weight: bold;">${ad.categorie || ad.category || 'Général'}</span>
                <h4 style="font-size: 14px; font-weight: bold; margin: 5px 0;">${ad.titre || ad.title}</h4>
                <p style="font-size: 12px; color: #666; margin: 0;">Prix : <strong>${ad.prix || ad.price}</strong></p>
              </div>
              <button onclick="deleteAdFirebase('${id}')" style="background: #ffebee; color: #d32f2f; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>`;
        });

        if (count === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 30px 15px; background: #fff; border-radius: 10px; border: 1px dashed #ccc;">
              <p style="color: #666; font-size: 13px;">Vous n'avez encore publié aucun service.</p>
              <a href="publier.html" style="color: #d32f2f; font-weight: bold; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 8px;">Publier mon premier service</a>
            </div>`;
        } else {
          container.innerHTML = adsHtml;
        }
      } catch (e) {
        container.innerHTML = `<p style="text-align:center; color:red; font-size:12px;">Erreur de chargement des annonces.</p>`;
      }
    }

    window.deleteAdFirebase = async function(id) {
      if (confirm("Voulez-vous vraiment supprimer ce service ?")) {
        try {
          await deleteDoc(doc(db, "services", id));
          alert("Service supprimé avec succès !");
          loadMyAdsFirebase();
        } catch (e) {
          alert("Erreur lors de la suppression.");
        }
      }
    };

    document.addEventListener('DOMContentLoaded', loadMyAdsFirebase);
  </script>
</body>
</html>
