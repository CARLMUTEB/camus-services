<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion — CAMU SERVICES</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body>

<main class="auth-page">

    <h1>
        <i class="fas fa-lock"></i>
        Connexion
    </h1>

    <div
        id="login-error"
        class="error"
        role="alert"
    ></div>

    <div
        id="login-success"
        class="success"
        role="status"
    ></div>

    <form id="login-form">

        <input
            type="email"
            id="login-email"
            placeholder="Adresse email"
            autocomplete="email"
            required
        >

        <input
            type="password"
            id="login-password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="login-btn"
        >
            <i class="fas fa-sign-in-alt"></i>
            Se connecter
        </button>

    </form>

    <div class="auth-links">

        <a
            href="#"
            id="forgot-password"
        >
            <i class="fas fa-key"></i>
            Mot de passe oublié ?
        </a>

        <a href="inscription.html">
            <i class="fas fa-user-plus"></i>
            Créer un compte
        </a>

        <a href="index.html">
            <i class="fas fa-home"></i>
            Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signIn,
    resetPassword
} from "./js/core/auth.js";


const form =
    document.getElementById("login-form");

const error =
    document.getElementById("login-error");

const success =
    document.getElementById("login-success");

const button =
    document.getElementById("login-btn");


// =========================================================
// CONNEXION
// =========================================================

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    error.textContent = "";
    success.textContent = "";


    const email =
        document
            .getElementById("login-email")
            .value
            .trim();


    const password =
        document
            .getElementById("login-password")
            .value;


    if (!email) {

        error.textContent =
            "Veuillez entrer votre adresse email.";

        return;
    }


    if (!password) {

        error.textContent =
            "Veuillez entrer votre mot de passe.";

        return;
    }


    button.disabled = true;

    button.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Connexion...';


    try {

        const result =
            await signIn(
                email,
                password
            );


        if (result.success) {

            success.textContent =
                "Connexion réussie ! Redirection...";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 500);


        } else {

            error.textContent =
                result.error ||
                "Impossible de vous connecter.";

            button.disabled = false;

            button.innerHTML =
                '<i class="fas fa-sign-in-alt"></i> Se connecter';
        }


    } catch (err) {

        console.error(
            "Erreur connexion :",
            err
        );

        error.textContent =
            "Une erreur inattendue est survenue.";

        button.disabled = false;

        button.innerHTML =
            '<i class="fas fa-sign-in-alt"></i> Se connecter';
    }

});


// =========================================================
// MOT DE PASSE OUBLIÉ
// =========================================================

document
    .getElementById("forgot-password")
    .addEventListener("click", async (event) => {

        event.preventDefault();

        error.textContent = "";
        success.textContent = "";


        const email =
            document
                .getElementById("login-email")
                .value
                .trim();


        if (!email) {

            error.textContent =
                "Entrez d'abord votre adresse email.";

            return;
        }


        try {

            const result =
                await resetPassword(email);


            if (result.success) {

                success.textContent =
                    "Un email de réinitialisation a été envoyé à cette adresse.";

            } else {

                error.textContent =
                    result.error;

            }


        } catch (err) {

            console.error(
                "Erreur réinitialisation :",
                err
            );

            error.textContent =
                "Impossible d'envoyer l'email de réinitialisation.";

        }

    });

</script>

</body>
</html>
