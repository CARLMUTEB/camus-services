<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion — CAMU SERVICES</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>


<body>

<main class="auth-page">

    <h1>
        <i class="fas fa-lock"></i>
        Connexion
    </h1>


    <div
        id="login-error"
        class="error"
        role="alert"
    ></div>


    <form
        id="login-form"
        novalidate
    >

        <input
            type="email"
            id="login-email"
            placeholder="Adresse email"
            autocomplete="email"
            required
        >


        <input
            type="password"
            id="login-password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="login-btn"
        >
            Se connecter
        </button>

    </form>


    <div class="auth-links">

        <a
            href="#"
            id="forgot-password"
        >
            Mot de passe oublié ?
        </a>


        <a href="inscription.html">
            Créer un compte
        </a>


        <a href="index.html">
            Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signIn,
    resetPassword
} from "./js/core/auth.js";


const form =
    document.getElementById(
        "login-form"
    );

const errorElement =
    document.getElementById(
        "login-error"
    );

const loginButton =
    document.getElementById(
        "login-btn"
    );

const forgotPassword =
    document.getElementById(
        "forgot-password"
    );


// =====================================================
// CONNEXION
// =====================================================

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        errorElement.textContent = "";


        const email =
            document.getElementById(
                "login-email"
            ).value.trim();


        const password =
            document.getElementById(
                "login-password"
            ).value;


        if (!email) {

            errorElement.textContent =
                "Veuillez saisir votre adresse email.";

            return;
        }


        if (!password) {

            errorElement.textContent =
                "Veuillez saisir votre mot de passe.";

            return;
        }


        loginButton.disabled = true;

        loginButton.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Connexion...';


        try {

            const result =
                await signIn(
                    email,
                    password
                );


            if (result.success) {

                window.location.href =
                    "index.html";

                return;
            }


            errorElement.textContent =
                result.error ||
                "Impossible de se connecter.";

        } catch (error) {

            console.error(
                "Erreur connexion :",
                error
            );


            errorElement.textContent =
                "Une erreur est survenue pendant la connexion.";
        }


        loginButton.disabled = false;

        loginButton.innerHTML =
            "Se connecter";
    }
);


// =====================================================
// MOT DE PASSE OUBLIÉ
// =====================================================

forgotPassword.addEventListener(
    "click",
    async event => {

        event.preventDefault();

        errorElement.textContent = "";


        const email =
            document.getElementById(
                "login-email"
            ).value.trim();


        if (!email) {

            errorElement.textContent =
                "Entrez d'abord votre adresse email.";

            return;
        }


        forgotPassword.style.pointerEvents =
            "none";


        try {

            const result =
                await resetPassword(
                    email
                );


            if (result.success) {

                alert(
                    "Un email de réinitialisation a été envoyé à cette adresse."
                );

            } else {

                errorElement.textContent =
                    result.error ||
                    "Impossible d'envoyer l'email.";
            }

        } catch (error) {

            console.error(
                "Erreur réinitialisation :",
                error
            );


            errorElement.textContent =
                "Une erreur est survenue.";
        }


        forgotPassword.style.pointerEvents =
            "";
    }
);

</script>

</body>

</html>
