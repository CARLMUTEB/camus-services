<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion à CAMU SERVICES">

  <title>CAMU SERVICES — Connexion</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS Principal -->
  <link rel="stylesheet" href="style.css">

  <!-- Styles spécifiques à la page connexion -->
  <style>
    .card-box {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 20px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--card);
      color: var(--text);
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
    }

    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 20px;
      background: var(--red);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
    }

    .btn-submit:hover { background: var(--red-dark); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 20px;
      background: #ffffff;
      color: #333333;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
      margin-top: 10px;
    }

    .btn-google:hover { background: #f5f5f5; }
    .btn-google i { color: #4285F4; font-size: 16px; }

    .separator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .message-box {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
    }

    .message-box.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .message-box.error { background: var(--red-light); color: var(--red); border: 1px solid #f1c2c2; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <button class="back-btn" onclick="history.back()" aria-label="Retour">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="logo-text">CAMU <span>SERVICES</span></div>
    <div class="spacer"></div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="container">
    <div class="card-box">
      <!-- En-tête -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 70px; height: 70px; background: var(--red-light); color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 28px; box-shadow: 0 4px 12px rgba(211,47,47,0.15);">
          <i class="fa-solid fa-user"></i>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px;">Bon retour !</h2>
        <p style="font-size: 13px; color: var(--muted); line-height: 1.4;">Connectez-vous pour accéder à votre espace CAMU SERVICES</p>
      </div>

      <!-- Formulaire -->
      <form id="connexionForm">
        <div class="form-group">
          <label for="emailConnexion">Adresse Email</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted);"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="emailConnexion" placeholder="exemple@email.com" style="padding-left: 40px;" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="motDePasseConnexion">Mot de passe</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted);"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="motDePasseConnexion" placeholder="Votre mot de passe" style="padding-left: 40px;" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnConnexion">
          <i class="fa-solid fa-right-to-bracket"></i> Se connecter
        </button>

        <div class="separator">ou</div>

        <button type="button" class="btn-google" id="btnGoogle">
          <i class="fa-brands fa-google"></i> Continuer avec Google
        </button>
      </form>

      <!-- Message -->
      <div id="messageConnexion" class="message-box"></div>

      <!-- Lien inscription -->
      <div style="text-align: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted);">
        Vous n'avez pas encore de compte ?
        <a href="inscription.html" style="color: var(--red); font-weight: 800; text-decoration: none; margin-left: 4px;">Créer un compte</a>
      </div>
    </div>
  </main>

  <!-- NAVIGATION BAS -->
  <nav class="bottom-nav" aria-label="Navigation mobile">
    <a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i><span>Publier</span></a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="explorer.html"><i class="fa-solid fa-compass"></i><span>Explorer</span></a>
  </nav>

  <!-- SCRIPT -->
  <script type="module">
    import { connexionUtilisateur, connexionGoogle } from "./app.js";

    const form = document.getElementById("connexionForm");
    const message = document.getElementById("messageConnexion");
    const button = document.getElementById("btnConnexion");
    const btnGoogle = document.getElementById("btnGoogle");

    function afficherMessage(texte, type = "success") {
      message.style.display = "block";
      message.textContent = texte;
      message.className = "message-box " + type;
    }

    function masquerMessage() {
      message.style.display = "none";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("emailConnexion").value.trim();
      const password = document.getElementById("motDePasseConnexion").value;

      if (!email || !password) {
        afficherMessage("Veuillez remplir tous les champs.", "error");
        return;
      }

      button.disabled = true;
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';
      masquerMessage();

      const resultat = await connexionUtilisateur(email, password);

      if (resultat.success) {
        afficherMessage("Connexion réussie. Bienvenue !");
        setTimeout(() => window.location.href = "index.html", 800);
      } else {
        let texte = "Impossible de se connecter.";
        if (resultat.error.includes("invalid-credential") || resultat.error.includes("wrong-password") || resultat.error.includes("user-not-found")) {
          texte = "Email ou mot de passe incorrect.";
        } else if (resultat.error.includes("invalid-email")) {
          texte = "Adresse email invalide.";
        } else if (resultat.error.includes("too-many-requests")) {
          texte = "Trop de tentatives. Réessayez plus tard.";
        }
        afficherMessage(texte, "error");
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
      }
    });

    btnGoogle.addEventListener("click", async () => {
      btnGoogle.disabled = true;
      btnGoogle.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';
      masquerMessage();

      const resultat = await connexionGoogle();
      if (resultat.success) {
        afficherMessage("Connexion réussie. Bienvenue !");
        setTimeout(() => window.location.href = "index.html", 800);
      } else {
        afficherMessage("Erreur lors de la connexion Google.", "error");
        btnGoogle.disabled = false;
        btnGoogle.innerHTML = '<i class="fa-brands fa-google"></i> Continuer avec Google';
      }
    });
  </script>
</body>
</html>
