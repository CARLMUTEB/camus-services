<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — CAMU SERVICES</title>

    <meta
        name="description"
        content="Connectez-vous à votre compte CAMU SERVICES."
    >

    <link rel="stylesheet" href="../css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- RETOUR -->
        <a href="../index.html" class="auth-back">
            <i class="fa-solid fa-arrow-left"></i>
            Retour à l'accueil
        </a>


        <!-- CARTE -->
        <section class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">
                <span class="logo-main">CAMU</span>
                <span class="logo-sub">SERVICES</span>
            </div>


            <!-- TITRE -->
            <div class="auth-header">

                <h1>Bon retour !</h1>

                <p>
                    Connectez-vous pour accéder à votre compte.
                </p>

            </div>


            <!-- FORMULAIRE -->
            <form id="loginForm" class="auth-form">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="loginEmail">
                        Adresse e-mail
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="exemple@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- MOT DE PASSE -->
                <div class="form-group">

                    <div class="form-label-row">

                        <label for="loginPassword">
                            Mot de passe
                        </label>

                        <a href="#" id="forgotPassword">
                            Mot de passe oublié ?
                        </a>

                    </div>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Afficher le mot de passe"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- ERREUR -->
                <div
                    id="loginMessage"
                    class="auth-message"
                    role="alert"
                ></div>


                <!-- CONNEXION -->
                <button
                    type="submit"
                    class="auth-submit"
                    id="loginButton"
                >

                    <span>Se connecter</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- INSCRIPTION -->
            <div class="auth-switch">

                <span>
                    Vous n'avez pas encore de compte ?
                </span>

                <a href="inscription.html">
                    Créer un compte
                </a>

            </div>

        </section>


        <!-- FOOTER -->
        <div class="auth-footer">

            <a href="mentions-legales.html">
                Mentions légales
            </a>

            <a href="cgu.html">
                Conditions d'utilisation
            </a>

            <a href="confidentialite.html">
                Confidentialité
            </a>

        </div>

    </main>


    <script src="../js/auth.js"></script>

</body>
</html>
