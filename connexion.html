<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion — CAMU SERVICES</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body>

<main class="auth-page">

    <h1>🔐 Connexion</h1>

    <div
        id="login-error"
        class="error"
    ></div>

    <input
        type="email"
        id="login-email"
        placeholder="Adresse email"
        autocomplete="email"
    >

    <input
        type="password"
        id="login-password"
        placeholder="Mot de passe"
        autocomplete="current-password"
    >

    <button id="login-btn">
        Se connecter
    </button>

    <div class="auth-links">

        <a href="inscription.html">
            Pas encore de compte ? Inscrivez-vous
        </a>

        <a href="#" id="forgot-password">
            Mot de passe oublié ?
        </a>

        <a href="index.html">
            ← Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signIn,
    resetPassword
} from "./js/core/auth.js";


const emailInput =
    document.getElementById(
        "login-email"
    );

const passwordInput =
    document.getElementById(
        "login-password"
    );

const loginButton =
    document.getElementById(
        "login-btn"
    );

const errorElement =
    document.getElementById(
        "login-error"
    );


loginButton.addEventListener(
    "click",
    async () => {

        errorElement.textContent = "";


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            errorElement.textContent =
                "Veuillez remplir tous les champs.";

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Connexion...";


        const result =
            await signIn(
                email,
                password
            );


        if (result.success) {

            window.location.href =
                "index.html";

        } else {

            errorElement.textContent =
                result.error;

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Se connecter";

        }

    }
);


document
    .getElementById(
        "forgot-password"
    )
    .addEventListener(
        "click",
        async event => {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                alert(
                    "Entrez d'abord votre adresse email."
                );

                emailInput.focus();

                return;

            }


            const result =
                await resetPassword(
                    email
                );


            if (result.success) {

                alert(
                    "Un email de réinitialisation a été envoyé."
                );

            } else {

                alert(
                    result.error
                );

            }

        }
    );

</script>

</body>
</html>
