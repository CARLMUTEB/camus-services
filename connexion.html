<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Connexion — CAMU SERVICES</title>

<link
    rel="stylesheet"
    href="css/main.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
>

</head>

<body>

<main class="auth-page">

    <h1>
        <i class="fas fa-lock"></i>
        Connexion
    </h1>


    <div
        id="login-error"
        class="error"
    ></div>


    <form id="login-form">

        <input
            type="email"
            id="login-email"
            placeholder="Adresse email"
            required
        >


        <input
            type="password"
            id="login-password"
            placeholder="Mot de passe"
            required
        >


        <button
            type="submit"
            id="login-btn"
        >
            Se connecter
        </button>

    </form>


    <div class="auth-links">

        <a
            href="#"
            id="forgot-password"
        >
            Mot de passe oublié ?
        </a>


        <a href="inscription.html">
            Créer un compte
        </a>


        <a href="index.html">
            Retour à l'accueil
        </a>

    </div>

</main>


<script type="module">

import {
    signIn,
    resetPassword
} from "./js/core/auth.js";


const form =
    document.getElementById(
        "login-form"
    );


const error =
    document.getElementById(
        "login-error"
    );


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        error.textContent = "";

        const email =
            document.getElementById(
                "login-email"
            ).value;

        const password =
            document.getElementById(
                "login-password"
            ).value;


        const button =
            document.getElementById(
                "login-btn"
            );


        button.disabled = true;

        button.textContent =
            "Connexion...";


        const result =
            await signIn(
                email,
                password
            );


        if (result.success) {

            window.location.href =
                "index.html";

        } else {

            error.textContent =
                result.error;

            button.disabled = false;

            button.textContent =
                "Se connecter";
        }

    }
);


document
    .getElementById(
        "forgot-password"
    )
    .addEventListener(
        "click",
        async event => {

            event.preventDefault();


            const email =
                document.getElementById(
                    "login-email"
                ).value;


            if (!email) {

                error.textContent =
                    "Entrez d'abord votre adresse email.";

                return;
            }


            const result =
                await resetPassword(
                    email
                );


            if (result.success) {

                alert(
                    "Email de réinitialisation envoyé."
                );

            } else {

                error.textContent =
                    result.error;
            }

        }
    );

</script>

</body>
</html>
