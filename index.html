<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMU SERVICES — Trouver . Acheter . Réserver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- En-tête -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-black">CAMU <span style="color:#d32f2f;">SERVICES</span></h1>
            <p class="text-sm text-gray-500 italic">TROUVER . ACHETER . RÉSERVER</p>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 py-12 text-center">
        <h2 class="text-3xl font-extrabold mb-4">Bienvenue sur CAMU SERVICES</h2>
        <p class="text-lg text-gray-600 mb-8">Votre plateforme de services de confiance.</p>
        
        <!-- Si vous aviez d'autres éléments sur votre page d'accueil (boutons, annonces, etc.), ils viendront se placer ici -->
    </main>

    <!-- Script invisible pour incrémenter le compteur de visites en arrière-plan -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuration Firebase officielle de votre projet
        const firebaseConfig = {
            apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
            authDomain: "camu-services.firebaseapp.com",
            projectId: "camu-services",
            storageBucket: "camu-services.firebasestorage.app",
            messagingSenderId: "879100396449",
            appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fonction qui s'exécute en secret au chargement de la page
        async function compterVisiteSilencieuse() {
            const visiteRef = doc(db, "stats", "visites");
            try {
                // Ajoute +1 aux statistiques Firestore
                await updateDoc(visiteRef, {
                    total: increment(1)
                });
            } catch (e) {
                // Si la base n'est pas encore prête, l'initialise à 1
                await setDoc(visiteRef, { total: 1 }, { merge: true });
            }
        }

        compterVisiteSilencieuse();
    </script>
</body>
</html>
