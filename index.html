<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMUS SERVICES</title>

  <!-- Liens vers les fichiers CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Lien Manifest PWA -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Navigation / Header -->
  <header class="navbar">
    <div class="logo">
      <img src="logo.png" alt="Logo CAMUS SERVICES" width="40">
      <span>CAMUS SERVICES</span>
    </div>
    <nav>
      <a href="index.html" class="active"><i class="fa-solid fa-house"></i> Accueil</a>
      <a href="publier.html"><i class="fa-solid fa-plus-circle"></i> Publier</a>
      <a href="chat.html"><i class="fa-solid fa-comments"></i> Discussion</a>
      <a href="favoris.html"><i class="fa-solid fa-heart"></i> Favoris</a>
    </nav>
  </header>

  <!-- Section principale -->
  <main class="container">
    <section class="hero">
      <h1>Bienvenue sur CAMUS SERVICES</h1>
      <p>Trouvez et publiez vos annonces en toute simplicité.</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Que recherchez-vous ?">
        <button onclick="searchAds()"><i class="fa-solid fa-magnifying-glass"></i> Rechercher</button>
      </div>
    </section>

    <!-- Affichage des annonces -->
    <section class="ads-grid" id="adsContainer">
      <!-- Les annonces générées dynamiquement apparaîtront ici -->
    </section>
  </main>

  <!-- Script JS principal -->
  <script src="app.js"></script>
</body>
</html>
