<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CAMU SERVICES — Accueil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Votre structure HTML (TopBar, Sidebar, etc.) reste la même -->
<!-- Assurez-vous de garder vos conteneurs id="services" et id="communiquesContainer" -->
<div id="communiquesContainer"></div>
<div id="services"></div>

<script type="module">
    import { db, auth } from "./app.js";
    import { collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let all = [];
    let cat = "";

    const e = x => String(x ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));

    onAuthStateChanged(auth, (user) => { if (user) load(); });

    async function load() {
        try {
            const snapshot = await getDocs(query(collection(db, "services"), where("valide", "==", true)));
            all = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render();
        } catch (error) { console.error(error); }
    }

    function render() {
        const searchValue = document.getElementById("search")?.value.toLowerCase().trim() || "";
        const filtered = all.filter(s => (!cat || s.categorie === cat) && (!searchValue || `${s.titre} ${s.description} ${s.userName}`.toLowerCase().includes(searchValue)));
        
        document.getElementById("services").innerHTML = filtered.map(s => `
            <article class="annonce-card" onclick="ouvrirDetails('${s.id}')">
                <div onclick="event.stopPropagation(); ouvrirProfilPrestataire('${s.ownerId || ''}', '${e(s.userName || 'Prestataire')}', '${s.userPhoto || ''}')">
                    <strong>${e(s.userName || "Prestataire")}</strong>
                </div>
                <h3>${e(s.titre)}</h3>
                <p>${e((s.description || "").slice(0, 100))}...</p>
            </article>
        `).join("");
    }

    // Fonction détaillée pour ouvrir le profil avec ownerId
    window.ouvrirProfilPrestataire = async function(ownerId, fallbackName, fallbackPhoto) {
        const modalId = "modalProfilPrestataire";
        // Nettoyage si modale existe déjà
        if (document.getElementById(modalId)) document.getElementById(modalId).remove();

        // 1. Afficher chargement
        document.body.insertAdjacentHTML('beforeend', `<div id="${modalId}" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center;">Chargement...</div>`);

        let userData = { name: fallbackName, photo: fallbackPhoto, bio: "Aucune description.", email: "" };

        // 2. Récupérer les infos dans la collection "users" via ownerId
        if (ownerId) {
            try {
                const userSnap = await getDoc(doc(db, "users", ownerId));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    userData.name = data.nom || data.name || fallbackName;
                    userData.bio = data.bio || data.description || "Aucune description.";
                }
            } catch (err) { console.error(err); }
        }

        // 3. Filtrer les publications en utilisant ownerId
        const userServices = all.filter(s => s.ownerId === ownerId);

        // 4. Afficher la modale
        document.getElementById(modalId).innerHTML = `
            <div style="background:white; padding:20px; width:90%; max-width:400px; border-radius:10px;">
                <button onclick="document.getElementById('${modalId}').remove()">Fermer</button>
                <h2>${e(userData.name)}</h2>
                <p><strong>À propos :</strong> ${e(userData.bio)}</p>
                <h3>Publications (${userServices.length})</h3>
                <div>
                    ${userServices.map(srv => `<p>${e(srv.titre)}</p>`).join("")}
                </div>
            </div>
        `;
    };

    window.ouvrirDetails = function(id) { /* Votre code existant */ };
</script>
</body>
</html>
