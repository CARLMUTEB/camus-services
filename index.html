<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Articles & Prestataires</title>
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">Mon Catalogue</h1>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-grow max-w-md w-full mx-auto p-4">
        
        <!-- Filtres de catégories -->
        <div class="flex space-x-2 mb-6 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterSelection('all')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-blue-600 text-white transition shadow-sm whitespace-nowrap">Tout</button>
            <button onclick="filterSelection('article')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 transition whitespace-nowrap">Articles</button>
            <button onclick="filterSelection('prestataire')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 transition whitespace-nowrap">Prestataires locaux</button>
        </div>

        <!-- Grille des cartes (2 colonnes) -->
        <div class="grid grid-cols-2 gap-3" id="cards-container">
            
            <!-- Carte 1 : Article -->
            <div class="card-item article bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="h-28 bg-gray-200 relative">
                    <img src="[https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300](https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300)" alt="Casque audio" class="w-full h-full object-cover">
                    <span class="absolute top-2 left-2 bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Article</span>
                </div>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="font-semibold text-sm text-gray-900 line-clamp-1">Casque Bluetooth</h3>
                        <p class="text-xs text-blue-600 font-bold mt-1">45 000 FC</p>
                    </div>
                    <button class="mt-3 w-full bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-semibold py-1.5 rounded-lg transition">Commander</button>
                </div>
            </div>

            <!-- Carte 2 : Prestataire local -->
            <div class="card-item prestataire bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="h-28 bg-gray-200 relative">
                    <img src="[https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=300](https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=300)" alt="Électricien" class="w-full h-full object-cover">
                    <span class="absolute top-2 left-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Prestataire</span>
                </div>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="font-semibold text-sm text-gray-900 line-clamp-1">Jean Électricien</h3>
                        <p class="text-[11px] text-gray-500 mt-0.5">Dépannage & Installation</p>
                    </div>
                    <button class="mt-3 w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-xs font-semibold py-1.5 rounded-lg transition">Contacter</button>
                </div>
            </div>

            <!-- Carte 3 : Article -->
            <div class="card-item article bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="h-28 bg-gray-200 relative">
                    <img src="[https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300](https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300)" alt="Montre" class="w-full h-full object-cover">
                    <span class="absolute top-2 left-2 bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Article</span>
                </div>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="font-semibold text-sm text-gray-900 line-clamp-1">Montre Classique</h3>
                        <p class="text-xs text-blue-600 font-bold mt-1">25 000 FC</p>
                    </div>
                    <button class="mt-3 w-full bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-semibold py-1.5 rounded-lg transition">Commander</button>
                </div>
            </div>

            <!-- Carte 4 : Prestataire local -->
            <div class="card-item prestataire bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="h-28 bg-gray-200 relative">
                    <img src="[https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=300](https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=300)" alt="Photographe" class="w-full h-full object-cover">
                    <span class="absolute top-2 left-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Prestataire</span>
                </div>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="font-semibold text-sm text-gray-900 line-clamp-1">Studio Photo Pro</h3>
                        <p class="text-[11px] text-gray-500 mt-0.5">Mariages & Événements</p>
                    </div>
                    <button class="mt-3 w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-xs font-semibold py-1.5 rounded-lg transition">Contacter</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Script JavaScript pour le filtrage -->
    <script>
        function filterSelection(category) {
            const cards = document.querySelectorAll('.card-item');
            const buttons = document.querySelectorAll('.filter-btn');

            // Gestion de l'apparence des boutons actifs
            buttons.forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            event.target.classList.remove('bg-gray-200', 'text-gray-700');
            event.target.classList.add('bg-blue-600', 'text-white');

            // Filtrage des éléments
            cards.forEach(card => {
                if (category === 'all' || card.classList.contains(category)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
