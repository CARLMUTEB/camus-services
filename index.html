<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>CAMU SERVICES — Accueil</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
      padding-top: 60px;
      padding-bottom: 75px;
    }

    /* ================= HEADER ================= */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    .logo-text {
      color: white;
      font-size: 17px;
      font-weight: 900;
    }

    .logo-text span {
      color: #d32f2f;
    }

    .profile-icon {
      color: white;
      font-size: 20px;
      text-decoration: none;
    }

    /* ================= CONTAINER ================= */

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 18px 15px;
    }

    /* ================= SEARCH ================= */

    .search-bar {
      background: white;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      margin-bottom: 22px;
      box-shadow: 0 2px 5px rgba(0,0,0,.03);
    }

    .search-bar i {
      color: #777;
      font-size: 19px;
    }

    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      background: transparent;
    }

    /* ================= TITRE ================= */

    .section-title {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ================= SERVICES ================= */

    #servicesContainer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .annonce-card {
      background: white;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.04);
    }

    .badge-cat {
      display: inline-block;
      background: #ffebee;
      color: #d32f2f;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .annonce-card h3 {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .description {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .prix {
      color: #d32f2f;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .service-actions {
      display: flex;
      gap: 8px;
    }

    .btn-contact {
      flex: 1;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }

    .btn-favori {
      width: 45px;
      background: white;
      color: #777;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 17px;
    }

    /* ================= CHARGEMENT ================= */

    .loading-box,
    .empty-state,
    .error-state {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
    }

    .loading-box i {
      font-size: 25px;
      color: #d32f2f;
      margin-bottom: 10px;
    }

    .empty-state i {
      font-size: 40px;
      color: #aaa;
      margin-bottom: 12px;
    }

    .empty-state h2,
    .error-state h2 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .empty-state p,
    .error-state p {
      color: #777;
      font-size: 12px;
    }

    .error-state i {
      color: #d32f2f;
      font-size: 40px;
      margin-bottom: 12px;
    }

    .retry-btn {
      margin-top: 15px;
      background: #111;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* ================= NAVIGATION ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
    }

    .bottom-nav a {
      width: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #666;
      font-size: 11px;
    }

    .bottom-nav a.active {
      color: #d32f2f;
    }

    .bottom-nav i {
      font-size: 20px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<header class="top-bar">

  <div class="logo-text">
    CAMU <span>SERVICES</span>
  </div>

  <a href="profil.html" class="profile-icon">
    <i class="fa-solid fa-user"></i>
  </a>

</header>


<main class="container">

  <!-- RECHERCHE -->

  <div class="search-bar">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      type="text"
      id="searchInput"
      placeholder="Rechercher un service..."
      autocomplete="off"
    >

  </div>


  <div class="section-title">
    Services disponibles
  </div>


  <div id="servicesContainer">

    <div class="loading-box">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Chargement des services...</p>

    </div>

  </div>

</main>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <a href="index.html" class="active">
    <i class="fa-solid fa-house"></i>
    <span>Accueil</span>
  </a>

  <a href="publier.html">
    <i class="fa-solid fa-circle-plus"></i>
    <span>Publier</span>
  </a>

  <a href="chat.html">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </a>

  <a href="profil.html">
    <i class="fa-solid fa-user"></i>
    <span>Profil</span>
  </a>

</nav>


<script type="module">

  import { db } from "./app.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


  const container =
    document.getElementById("servicesContainer");

  const searchInput =
    document.getElementById("searchInput");


  let tousLesServices = [];


  /* =====================================================
     PROTECTION CONTRE HTML INJECTÉ
  ===================================================== */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     CHARGER LES SERVICES
     
     IMPORTANT :
     On ne fait PAS orderBy ici.
     Cela évite le problème d'index Firestore.
  ===================================================== */

  async function chargerServices() {

    container.innerHTML = `
      <div class="loading-box">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Chargement des services...</p>
      </div>
    `;

    try {

      const snapshot =
        await getDocs(collection(db, "services"));


      tousLesServices = [];


      snapshot.forEach((docSnap) => {

        const service = docSnap.data();


        /* Seulement les services validés */

        if (service.valide === true) {

          tousLesServices.push({

            id: docSnap.id,

            ...service

          });

        }

      });


      /* Tri côté navigateur */

      tousLesServices.sort((a, b) => {

        const dateA =
          a.createdAt?.seconds || 0;

        const dateB =
          b.createdAt?.seconds || 0;

        return dateB - dateA;

      });


      afficherServices(tousLesServices);


    } catch (error) {

      console.error(
        "Erreur Firebase :",
        error
      );


      container.innerHTML = `

        <div class="error-state">

          <i class="fa-solid fa-triangle-exclamation"></i>

          <h2>Impossible de charger les services</h2>

          <p>
            Une erreur s'est produite lors du chargement.
          </p>

          <button
            class="retry-btn"
            onclick="location.reload()"
          >
            Réessayer
          </button>

        </div>

      `;

    }

  }


  /* =====================================================
     AFFICHER LES SERVICES
  ===================================================== */

  function afficherServices(services) {

    if (services.length === 0) {

      container.innerHTML = `

        <div class="empty-state">

          <i class="fa-solid fa-inbox"></i>

          <h2>Aucun service disponible</h2>

          <p>
            Aucun service n'a encore été validé.
          </p>

        </div>

      `;

      return;

    }


    let html = "";


    services.forEach((service) => {

      const titre =
        escapeHTML(service.titre || "Service");

      const categorie =
        escapeHTML(service.categorie || "Divers & Services");

      const description =
        escapeHTML(service.description || "Aucune description disponible.");

      const prix =
        escapeHTML(service.prix || "Sur devis");


      html += `

        <div class="annonce-card">

          <span class="badge-cat">
            ${categorie}
          </span>

          <h3>
            ${titre}
          </h3>

          <p class="description">
            ${description}
          </p>

          <p class="prix">
            ${prix}
          </p>

          <div class="service-actions">

            <a
              href="chat.html?serviceId=${encodeURIComponent(service.id)}"
              class="btn-contact"
            >
              <i class="fa-solid fa-comments"></i>
              Contacter
            </a>

            <button
              class="btn-favori"
              title="Ajouter aux favoris"
            >
              <i class="fa-regular fa-star"></i>
            </button>

          </div>

        </div>

      `;

    });


    container.innerHTML = html;

  }


  /* =====================================================
     RECHERCHE
  ===================================================== */

  searchInput.addEventListener(
    "input",
    () => {

      const recherche =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!recherche) {

        afficherServices(
          tousLesServices
        );

        return;

      }


      const resultats =
        tousLesServices.filter((service) => {

          const titre =
            String(service.titre || "")
              .toLowerCase();

          const categorie =
            String(service.categorie || "")
              .toLowerCase();

          const description =
            String(service.description || "")
              .toLowerCase();


          return (
            titre.includes(recherche) ||
            categorie.includes(recherche) ||
            description.includes(recherche)
          );

        });


      afficherServices(resultats);

    }
  );


  /* =====================================================
     DÉMARRAGE
  ===================================================== */

  chargerServices();

</script>

</body>
</html>
