<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMU SERVICES — TROUVER . ACHETER . RÉSERVER</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f4f4f9; color: #333; padding-top: 60px; padding-bottom: 65px; }
    .header-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; font-weight: 800; z-index: 1000; }
    .header-bar span { color: #d32f2f; }
    .hero-banner { background: #111; color: #fff; padding: 20px 15px; text-align: center; }
    .hero-slogan { font-size: 13px; font-weight: 800; color: #d32f2f; margin-bottom: 15px; }
    .search-box { display: flex; background: #fff; border-radius: 25px; padding: 6px 15px; align-items: center; }
    .search-box input { border: none; outline: none; width: 100%; padding: 8px; font-size: 13px; }
    .container { max-width: 500px; margin: 15px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid #eee; }
    .card-body { padding: 12px 15px; }
    .card-badge { font-size: 10px; font-weight: 800; color: #d32f2f; background: #fff0f0; padding: 3px 8px; border-radius: 4px; }
    .card-title { font-size: 15px; font-weight: 800; margin: 4px 0; }
    .card-price { font-size: 14px; font-weight: 800; }
    .no-annonces { text-align: center; padding: 40px; color: #777; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; }
    .bottom-nav a { color: #666; font-size: 11px; text-decoration: none; text-align: center; }
    .bottom-nav a.active { color: #d32f2f; }
  </style>
</head>
<body>

  <header class="header-bar">
    <div>CAMU <span>SERVICES</span></div>
  </header>

  <main>
    <section class="hero-banner">
      <div class="hero-slogan">TROUVER . ACHETER . RÉSERVER</div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Que recherchez-vous ?" onkeyup="filterCards()">
      </div>
    </section>

    <div class="container" id="annoncesContainer">
      <!-- Chargement dynamique -->
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><i class="fa-solid fa-house"></i><br>Accueil</a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i><br>Publier</a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><br>Chat</a>
    <a href="profil.html"><i class="fa-solid fa-user"></i><br>Profil</a>
  </nav>

  <script type="module" src="auth-management.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
      authDomain: "camu-services.firebaseapp.com",
      projectId: "camu-services",
      storageBucket: "camu-services.firebasestorage.app",
      messagingSenderId: "879100396449",
      appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAnnoncesFirebase() {
      const container = document.getElementById('annoncesContainer');
      try {
        const usersSnap = await getDocs(collection(db, "users"));
        const suspendedUserIds = new Set();
        usersSnap.forEach((uDoc) => {
          if (uDoc.data().status === 'suspendu') {
            suspendedUserIds.add(uDoc.id);
          }
        });

        const querySnapshot = await getDocs(collection(db, "annonces"));
        let visibleCount = 0;
        let html = '';

        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          if (item.userId && suspendedUserIds.has(item.userId)) return;

          visibleCount++;
          html += `
            <div class="card">
              <div class="card-body">
                <span class="card-badge">${item.category || 'Annonce'}</span>
                <div class="card-title">${item.title}</div>
                <div class="card-price">${item.price}</div>
              </div>
            </div>`;
        });

        if (visibleCount === 0) {
          container.innerHTML = `<div class="no-annonces"><p>Aucune annonce disponible.</p></div>`;
          return;
        }

        container.innerHTML = html;
      } catch (e) {
        console.error("Erreur d'affichage :", e);
      }
    }

    document.addEventListener("DOMContentLoaded", loadAnnoncesFirebase);
  </script>

  <script>
    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    }
  </script>

</body>
</html>
