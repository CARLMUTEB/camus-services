<script type="module">

  import {
    connexionUtilisateur,
    connexionGoogle
  } from "./app.js";


  const form =
    document.getElementById(
      "connexionForm"
    );

  const message =
    document.getElementById(
      "messageConnexion"
    );

  const button =
    document.getElementById(
      "btnConnexion"
    );

  const btnGoogle =
    document.getElementById(
      "btnGoogle"
    );


  function afficherMessage(
    texte,
    type = "success"
  ) {

    message.style.display =
      "block";

    message.textContent =
      texte;

    message.className =
      "message-box " + type;

  }


  function masquerMessage() {

    message.style.display =
      "none";

  }


  /* =====================================================
     CONNEXION EMAIL / MOT DE PASSE
     ===================================================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById(
            "emailConnexion"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "motDePasseConnexion"
          )
          .value;


      if (!email || !password) {

        afficherMessage(
          "Veuillez remplir tous les champs.",
          "error"
        );

        return;

      }


      button.disabled =
        true;

      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';

      masquerMessage();


      try {

        const resultat =
          await connexionUtilisateur(
            email,
            password
          );


        if (!resultat.success) {

          let texte =
            "Impossible de se connecter.";


          const erreur =
            String(
              resultat.error || ""
            ).toLowerCase();


          if (
            erreur.includes(
              "invalid-credential"
            ) ||
            erreur.includes(
              "wrong-password"
            ) ||
            erreur.includes(
              "user-not-found"
            )
          ) {

            texte =
              "Email ou mot de passe incorrect.";

          } else if (
            erreur.includes(
              "invalid-email"
            )
          ) {

            texte =
              "Adresse email invalide.";

          } else if (
            erreur.includes(
              "too-many-requests"
            )
          ) {

            texte =
              "Trop de tentatives. Réessayez plus tard.";

          }


          afficherMessage(
            texte,
            "error"
          );


          button.disabled =
            false;

          button.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';


          return;

        }


        /* ================================================
           CONNEXION FIREBASE CONFIRMÉE
           ================================================ */

        afficherMessage(
          "Connexion réussie. Vérification de votre session..."
        );


        /*
         * IMPORTANT :
         * On attend que Firebase confirme réellement
         * l'état de connexion avec onAuthStateChanged.
         */

        const attendreUtilisateur =
          new Promise(
            (resolve) => {

              let termine =
                false;


              const timeout =
                setTimeout(
                  () => {

                    if (!termine) {

                      termine =
                        true;

                      resolve(
                        null
                      );

                    }

                  },
                  5000
                );


              document.addEventListener(
                "camu-auth-changed",
                function handler(event) {

                  const user =
                    event.detail?.user ||
                    null;


                  if (
                    user &&
                    !termine
                  ) {

                    termine =
                      true;

                    clearTimeout(
                      timeout
                    );

                    document.removeEventListener(
                      "camu-auth-changed",
                      handler
                    );

                    resolve(
                      user
                    );

                  }

                }
              );


              /*
               * Si Firebase a déjà terminé
               * avant l'installation du listener.
               */

              if (
                window.camuCurrentUser
              ) {

                termine =
                  true;

                clearTimeout(
                  timeout
                );

                resolve(
                  window.camuCurrentUser
                );

              }

            }
          );


        const utilisateur =
          await attendreUtilisateur;


        if (utilisateur) {

          console.log(
            "CAMU : utilisateur confirmé :",
            utilisateur.email
          );


          afficherMessage(
            "Connexion réussie. Bienvenue !"
          );


          setTimeout(
            () => {

              window.location.replace(
                "index.html"
              );

            },
            700
          );


        } else {

          afficherMessage(
            "Connexion effectuée, mais Firebase n'a pas encore confirmé la session. Veuillez patienter.",
            "error"
          );


          button.disabled =
            false;

          button.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

        }


      } catch (error) {

        console.error(
          "Erreur connexion :",
          error
        );


        afficherMessage(
          "Une erreur est survenue pendant la connexion.",
          "error"
        );


        button.disabled =
          false;

        button.innerHTML =
          '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

      }

    }
  );


  /* =====================================================
     CONNEXION GOOGLE
     ===================================================== */

  btnGoogle.addEventListener(
    "click",
    async function() {

      btnGoogle.disabled =
        true;

      btnGoogle.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';

      masquerMessage();


      try {

        const resultat =
          await connexionGoogle();


        if (!resultat.success) {

          afficherMessage(
            "Erreur lors de la connexion Google.",
            "error"
          );


          btnGoogle.disabled =
            false;

          btnGoogle.innerHTML =
            '<i class="fa-brands fa-google"></i> Continuer avec Google';


          return;

        }


        afficherMessage(
          "Connexion Google réussie. Vérification..."
        );


        /*
         * Firebase doit avoir un utilisateur.
         */

        let verification =
          0;


        while (
          !window.camuCurrentUser &&
          verification < 20
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                100
              )
          );

          verification++;

        }


        if (
          window.camuCurrentUser
        ) {

          window.location.replace(
            "index.html"
          );

        } else {

          afficherMessage(
            "La connexion Google n'a pas pu être confirmée.",
            "error"
          );

          btnGoogle.disabled =
            false;

          btnGoogle.innerHTML =
            '<i class="fa-brands fa-google"></i> Continuer avec Google';

        }


      } catch (error) {

        console.error(
          "Erreur Google :",
          error
        );


        afficherMessage(
          "Erreur lors de la connexion Google.",
          "error"
        );


        btnGoogle.disabled =
          false;

        btnGoogle.innerHTML =
          '<i class="fa-brands fa-google"></i> Continuer avec Google';

      }

    }
  );

</script>
