<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accueil — CAMU SERVICES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html">CAMU <span>SERVICES</span></a><a href="profil.html">Compte</a></header><main class="container"><section class="hero"><h1>Trouver. Acheter. Réserver.</h1><p>Découvrez des services et prestataires près de chez vous.</p><div class="search"><input id="q" placeholder="Rechercher un service..."><button class="btn" id="go">Rechercher</button></div></section><section><h2>Services disponibles</h2><div id="services" class="grid"><div class="loading">Chargement...</div></div></section><section><div class="row"><h2>Communiqués</h2><a class="btn" href="communiques.html">Voir tout</a></div><div id="news" class="grid"></div></section></main><nav class="bottom">
<a href="index.html"><i>⌂</i>Accueil</a>
<a href="explorer.html"><i>⌕</i>Explorer</a>
<a href="publier.html"><i>＋</i>Publier</a>
<a href="favoris.html"><i>♥</i>Favoris</a>
<a href="profil.html"><i>●</i>Profil</a>
</nav><script type="module">import {listApprovedServices,listCommuniques,escapeHTML,whatsappUrl,serviceWhatsAppMessage} from "./js/app.js";
const services=document.querySelector("#services"),news=document.querySelector("#news");
function card(s){const wa=whatsappUrl(s.whatsapp||s.telephone,serviceWhatsAppMessage(s));return `<article class="card"><span class="badge">${escapeHTML(s.categorie)}</span><h3>${escapeHTML(s.titre)}</h3><p class="muted">${escapeHTML(s.description)}</p><p>${escapeHTML(s.localisation||"Disponible localement")}</p><div class="actions"><a class="btn secondary" href="service.html?id=${s.id}">Voir</a>${wa?`<a class="btn green" target="_blank" href="${wa}">WhatsApp</a>`:""}</div></article>`}
async function load(){const r=await listApprovedServices(9);services.innerHTML=r.success&&r.data.length?r.data.map(card).join(""):`<div class="empty">Aucun service publié pour le moment.</div>`;const n=await listCommuniques(3);news.innerHTML=n.success&&n.data.length?n.data.map(x=>`<article class="card"><span class="badge">${escapeHTML(x.type||"Information")}</span><h3>${escapeHTML(x.titre)}</h3><p>${escapeHTML(x.description)}</p></article>`).join(""):`<div class="empty">Aucun communiqué.</div>`}
document.querySelector("#go").onclick=()=>location.href="explorer.html?q="+encodeURIComponent(document.querySelector("#q").value);load();</script></body></html>
