<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMU SERVICES — Trouver . Acheter . Réserver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Votre interface d'accueil originale reste intacte ici -->

    <!-- Script invisible pour incrémenter le compteur de visites en arrière-plan -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9zYQHEYVPJ1nGGx_TEzjQ8a7MyXCWdrg",
            authDomain: "camu-services.firebaseapp.com",
            projectId: "camu-services",
            storageBucket: "camu-services.firebasestorage.app",
            messagingSenderId: "879100396449",
            appId: "1:879100396449:web:9d7ffe441a3df2daf841e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function compterVisiteSilencieuse() {
            const visiteRef = doc(db, "stats", "visites");
            try {
                await updateDoc(visiteRef, {
                    total: increment(1)
                });
            } catch (e) {
                await setDoc(visiteRef, { total: 1 }, { merge: true });
            }
        }

        compterVisiteSilencieuse();
    </script>
</body>
</html>
