<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camu Services — Catalogue</title>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --red: #d32f2f;
            --red-dark: #b71c1c;
            --red-light: #ffebee;
            --dark: #111111;
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #171717;
            --muted: #70757a;
            --border: #e5e7eb;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-top: 60px;
            padding-bottom: 70px;
        }

        /* --- BARRE SUPÉRIEURE --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--dark);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 900;
        }

        .logo-text span {
            color: var(--red);
        }

        /* --- MENU LATÉRAL --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--card);
            z-index: 1600;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu-header {
            background: var(--dark);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .side-menu-header h2 {
            font-size: 16px;
        }

        .close-menu {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .side-menu-links {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-menu-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            transition: 0.2s;
            text-decoration: none;
        }

        .side-menu-links a:hover, .side-menu-links a.active {
            background: var(--red-light);
            color: var(--red);
        }

        .side-menu-links i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .container {
            width: min(94%, 600px);
            margin: 0 auto;
            padding: 15px 0;
        }

        .search-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0 14px;
            height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .search-bar input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            flex: 0 0 auto;
            border: 1px solid #f1c2c2;
            background: #fff5f5;
            color: var(--red);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--red);
            color: #ffffff;
        }

        .section-title {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--muted);
        }

        /* --- GRILLE 2 COLONNES --- */
        .cards-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .annonce-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-container {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            background: #eee;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-cat {
            display: inline-block;
            background: var(--red-light);
            color: var(--red);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .badge-prestataire {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .annonce-card h3 {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 4px;
            color: var(--text);
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .prix {
            color: var(--red);
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: var(--red);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 7px;
            width: 100%;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .btn-prestataire {
            background: #2e7d32;
        }

        .loader-text {
            grid-column: span 2;
            text-align: center;
            color: var(--muted);
            padding: 25px;
            font-size: 13px;
        }

        /* --- BARRE DE NAVIGATION DU BAS --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 1000;
        }

        .bottom-nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 10px;
            gap: 3px;
            text-decoration: none;
        }

        .bottom-nav a.active {
            color: var(--red);
        }

        .bottom-nav i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Barre supérieure -->
    <header class="top-bar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo-text">CAMU <span>SERVICES</span></div>
        <div style="width: 40px;"></div>
    </header>

    <!-- Menu latéral -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <h2>Navigation</h2>
            <button class="close-menu" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="side-menu-links">
            <a href="#" id="side-home" class="active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Accueil</a>
            <a href="#" id="side-explore" onclick="switchTab('explore')"><i class="fa-solid fa-compass"></i> Explorer</a>
            <a href="#" id="side-favorites" onclick="switchTab('favorites')"><i class="fa-solid fa-heart"></i> Favoris</a>
            <a href="#" id="side-profile" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i> Mon Profil</a>
        </div>
    </aside>

    <!-- Contenu Principal -->
    <main class="container">
        
        <div class="search-bar">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un article, un service..." onkeyup="filterAndRender()">
        </div>

        <div class="categories">
            <button onclick="setCategory('all', this)" class="cat-btn active">Tout</button>
            <button onclick="setCategory('article', this)" class="cat-btn">Articles</button>
            <button onclick="setCategory('prestataire', this)" class="cat-btn">Prestataires locaux</button>
        </div>

        <h2 class="section-title">Catalogue récent</h2>

        <!-- Grille connectée à la collection "publications" -->
        <div class="cards-grid-2" id="cardsContainer">
            <div class="loader-text"><i class="fa-solid fa-spinner fa-spin"></i> Chargement depuis Firebase...</div>
        </div>
    </main>

    <!-- Barre de navigation du bas -->
    <nav class="bottom-nav">
        <a href="#" id="nav-home" class="active" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Accueil</span>
        </a>
        <a href="#" id="nav-explore" onclick="switchTab('explore')">
            <i class="fa-solid fa-compass"></i>
            <span>Explorer</span>
        </a>
        <a href="#" id="nav-favorites" onclick="switchTab('favorites')">
            <i class="fa-solid fa-heart"></i>
            <span>Favoris</span>
        </a>
        <a href="#" id="nav-profile" onclick="switchTab('profile')">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "votre-projet.firebaseapp.com",
            projectId: "votre-projet-id",
            storageBucket: "votre-projet.appspot.com",
            messagingSenderId: "votre_sender_id",
            appId: "votre_app_id"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPublications = [];
        let currentCategory = 'all';

        async function fetchPublications() {
            const container = document.getElementById('cardsContainer');
            try {
                allPublications = [];
                const querySnapshot = await getDocs(collection(db, "publications"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="loader-text">Aucun document trouvé dans la collection "publications".</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    allPublications.push({
                        id: doc.id,
                        type: data.type || 'article', 
                        titre: data.titre || 'Sans titre',
                        description: data.description || '',
                        prixOrStatut: data.prix ? data.prix + " FC" : 'Disponible',
                        image: data.image || 'https://via.placeholder.com/300'
                    });
                });

                filterAndRender();
            } catch (error) {
                console.error("Erreur de chargement : ", error);
                container.innerHTML = `<div class="loader-text" style="color:var(--red);">Erreur : ${error.message}</div>`;
            }
        }

        window.filterAndRender = function() {
            const container = document.getElementById('cardsContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';

            const filtered = allPublications.filter(item => {
                const matchCat = (currentCategory === 'all' || item.type.toLowerCase() === currentCategory.toLowerCase());
                const matchSearch = item.titre.toLowerCase().includes(searchQuery) || item.description.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="loader-text">Aucun résultat ne correspond à votre recherche.</p>';
                return;
            }

            filtered.forEach(item => {
                const isPrestataire = item.type.toLowerCase() === 'prestataire';
                const badgeClass = isPrestataire ? 'badge-cat badge-prestataire' : 'badge-cat';
                const badgeText = isPrestataire ? 'Prestataire' : 'Article';
                const btnClass = isPrestataire ? 'btn-primary btn-prestataire' : 'btn-primary';
                const prixStyle = isPrestataire ? 'color: #2e7d32; font-size: 12px;' : '';

                const cardHTML = `
                    <div class="annonce-card">
                        <div>
                            <div class="card-img-container">
                                <img src="${item.image}" alt="${item.titre}">
                            </div>
                            <span class="${badgeClass}">${badgeText}</span>
                            <h3>${item.titre}</h3>
                            <p class="meta">${item.description}</p>
                        </div>
                        <div>
                            <div class="prix" style="${prixStyle}">${item.prixOrStatut}</div>
                            <button class="${btnClass}" onclick="alert('Contact pour : ${item.titre}')">Contacter</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.setCategory = function(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterAndRender();
        }

        fetchPublications();
    </script>

    <!-- Scripts utilitaires -->
    <script>
        function toggleSidebar() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.bottom-nav a, .side-menu-links a').forEach(a => a.classList.remove('active'));
            if(document.getElementById('nav-' + tabName)) document.getElementById('nav-' + tabName).classList.add('active');
            if(document.getElementById('side-' + tabName)) document.getElementById('side-' + tabName).classList.add('active');

            document.getElementById('sideMenu').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
