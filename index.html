<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAMU SERVICES - Accueil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f8f9fa; color: #222; padding-bottom: 80px; }
    
    .header { background: #111; color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 60px; }
    .nav-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .header h1 { font-size: 16px; font-weight: 800; }
    .header h1 span { color: #d32f2f; }

    .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }

    .side-menu { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0; background-color: #fff; overflow-x: hidden; transition: 0.3s ease; padding-top: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
    .side-menu .menu-header { padding: 15px 20px; font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 10px; }
    .side-menu .menu-header button { background: none; border: none; font-size: 22px; cursor: pointer; color: #333; }
    .side-menu a { padding: 12px 20px; text-decoration: none; font-size: 13px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
    .side-menu a:hover { background: #f5f5f5; color: #d32f2f; }
    .side-menu a i { width: 20px; color: #d32f2f; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; height: 65px; }
    .bottom-nav a { text-align: center; color: #666; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 25%; }
    .bottom-nav a.active { color: #d32f2f; }
    .bottom-nav i { font-size: 19px; margin-bottom: 3px; }

    .welcome-box { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e0e0e0; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .welcome-box h2 { font-size: 18px; color: #111; margin-bottom: 8px; }
    .welcome-box p { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <header class="header">
    <button class="nav-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    <h1>CAMU <span>SERVICES</span></h1>
    <div style="width: 20px;"></div>
  </header>
  
  <div id="side-menu" class="side-menu">
    <div class="menu-header">
      <span>CAMU SERVICES</span>
      <button onclick="toggleMenu()">&times;</button>
    </div>
    <a href="index.html"><i class="fa-solid fa-house"></i> Accueil</a>
    <a href="profil.html"><i class="fa-solid fa-user"></i> Mon Profil (Client / Entrepreneur)</a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i> Publier un service</a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i> Discussions & Chat</a>
    <a href="favoris.html"><i class="fa-solid fa-heart"></i> Mes Favoris</a>
    <a href="admin.html"><i class="fa-solid fa-user-shield"></i> Administration</a>
  </div>

  <main class="container">
    <div class="welcome-box">
      <h2>Trouvez, Achetez, Réservez</h2>
      <p>Bienvenue sur votre plateforme interactive dédiée aux entrepreneurs et clients.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="publier.html"><i class="fa-solid fa-circle-plus"></i><span>Publier</span></a>
    <a href="chat.html"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="profil.html"><i class="fa-solid fa-user"></i><span>Profil</span></a>
  </nav>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('side-menu');
      menu.style.width = menu.style.width === '260px' ? '0' : '260px';
    }
  </script>
</body>
</html>
