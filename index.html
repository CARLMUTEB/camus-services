<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camu Services - Trouver . Acheter . Réserver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- En-tête -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">CAMU SERVICES</h1>
            <p class="text-sm text-gray-500 italic">TROUVER . ACHETER . RÉSERVER</p>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 py-12 text-center">
        <h2 class="text-3xl font-extrabold mb-4">Bienvenue sur Camu Services</h2>
        <p class="text-lg text-gray-600 mb-8">Votre plateforme de services de confiance.</p>
        <div class="p-6 bg-white rounded-lg shadow inline-block">
            <p class="text-gray-500 text-sm">Visiteurs sur la plateforme :</p>
            <span id="compteur-visites" class="text-2xl font-bold text-blue-600">Chargement...</span>
        </div>
    </main>

    <!-- Script Firebase & Incrémentation -->
    <script type="module">
        // Importez les fonctions Firebase nécessaires
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURATION FIREBASE (Remplacez ces valeurs par vos propres clés de votre projet Firebase)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_AUTH_DOMAIN",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_STORAGE_BUCKET",
            messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fonction pour enregistrer la visite et mettre à jour l'affichage
        async function gererVisites() {
            const visiteRef = doc(db, "stats", "visites");
            try {
                // Incrémente de 1 dans Firestore
                await updateDoc(visiteRef, {
                    total: increment(1)
                });
            } catch (e) {
                // Si le document n'existe pas encore, on l'initialise à 1
                await setDoc(visiteRef, { total: 1 }, { merge: true });
            }

            // Récupère la valeur actualisée pour l'afficher sur la page d'accueil si besoin
            const docSnap = await getDoc(visiteRef);
            if (docSnap.exists()) {
                const compteurElement = document.getElementById("compteur-visites");
                if (compteurElement) {
                    compteurElement.textContent = docSnap.data().total;
                }
            }
        }

        gererVisites();
    </script>
</body>
</html>
