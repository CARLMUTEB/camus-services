<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CAMU SERVICES — Trouver, Acheter, Réserver">
    <title>CAMU SERVICES</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =====================================================
     APPLICATION CAMU SERVICES
     ===================================================== -->

<div id="app">

    <!-- =================================================
         BARRE SUPÉRIEURE
         ================================================= -->

    <header class="topbar">

        <button
            id="menuBtn"
            class="icon-btn"
            type="button"
            aria-label="Ouvrir le menu"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a href="#accueil" class="logo" id="logoLink">
            CAMU <span>SERVICES</span>
        </a>

        <div class="topbar-actions">

            <button
                id="topProfileBtn"
                class="profile-btn"
                type="button"
                aria-label="Mon profil"
            >
                <span id="topProfilePhoto" class="profile-photo-small">👤</span>
                <span id="topProfileName" class="top-profile-name">Connexion</span>
            </button>

        </div>

    </header>


    <!-- =================================================
         FOND MOBILE POUR SIDEBAR
         ================================================= -->

    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>


    <!-- =================================================
         SIDEBAR
         ================================================= -->

    <aside id="sidebar" class="sidebar" aria-label="Menu principal">

        <div class="sidebar-header">
            <button id="closeSidebarBtn" class="close-sidebar" type="button" aria-label="Fermer le menu">×</button>
        </div>

        <!-- PROFIL SIDEBAR -->
        <div class="sidebar-profile">
            <div id="sidebarProfilePhoto" class="sidebar-profile-photo">👤</div>
            <div class="sidebar-profile-info">
                <strong id="sidebarProfileName">Visiteur</strong>
                <span id="sidebarProfileRole">Visiteur</span>
            </div>
        </div>

        <!-- NAVIGATION PRINCIPALE -->
        <nav class="sidebar-nav">

            <button class="nav-item active" type="button" data-section="accueil">
                <span>🏠</span><span>Accueil</span>
            </button>

            <button class="nav-item" type="button" data-section="recherche">
                <span>🔍</span><span>Rechercher</span>
            </button>

            <button class="nav-item" type="button" data-section="categories">
                <span>🏷️</span><span>Catégories</span>
            </button>

            <button class="nav-item" type="button" data-section="chat">
                <span>💬</span><span>Chat</span>
            </button>

            <button class="nav-item" type="button" data-section="publier">
                <span>➕</span><span>Publier</span>
            </button>

            <button class="nav-item" type="button" data-section="favoris">
                <span>❤️</span><span>Favoris</span>
            </button>

            <button class="nav-item" type="button" data-section="reservations">
                <span>📅</span><span>Réservations</span>
            </button>

            <button class="nav-item" type="button" data-section="notifications">
                <span>🔔</span><span>Notifications</span>
            </button>

            <button class="nav-item" type="button" data-section="profil">
                <span>👤</span><span>Mon profil</span>
            </button>

            <button class="nav-item" type="button" data-section="parametres">
                <span>⚙️</span><span>Paramètres</span>
            </button>

            <div class="sidebar-divider"></div>

            <button class="nav-item" type="button" data-section="professionnel">
                <span>💼</span><span>Espace professionnel</span>
            </button>

            <button
                id="adminNavBtn"
                class="nav-item admin-nav-item hidden"
                type="button"
                data-section="administration"
            >
                <span>🛡️</span>
                <span>Administration</span>
            </button>

            <div class="sidebar-divider"></div>

            <button id="logoutBtn" class="nav-item logout-item" type="button">
                <span>🚪</span><span>Déconnexion</span>
            </button>

        </nav>

    </aside>


    <!-- =================================================
         CONTENU PRINCIPAL
         ================================================= -->

    <main id="mainContent">

        <!-- =================================================
             SECTION ACCUEIL (tout le contenu est là)
             ================================================= -->
        <!-- ... (je ne répète pas tout le contenu pour ne pas alourdir) ... -->
        <!-- Tu as déjà tout le contenu de l'accueil, sections etc. -->

    </main>


    <!-- =================================================
         NAVIGATION MOBILE
         ================================================= -->

    <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Navigation mobile">
        <button class="mobile-nav-item active" type="button" data-section="accueil">
            <span>🏠</span><small>Accueil</small>
        </button>
        <button class="mobile-nav-item" type="button" data-section="chat">
            <span>💬</span><small>Chat</small>
        </button>
        <button class="mobile-nav-item publish-mobile-btn" type="button" data-section="publier">
            <span>＋</span><small>Publier</small>
        </button>
        <button class="mobile-nav-item" type="button" data-section="favoris">
            <span>❤️</span><small>Favoris</small>
        </button>
        <button class="mobile-nav-item" type="button" data-section="profil">
            <span>👤</span><small>Profil</small>
        </button>
    </nav>


    <!-- =================================================
         MODALE DE CONNEXION
         ================================================= -->

    <div id="authModal" class="modal hidden" aria-hidden="true">
        <div class="modal-overlay"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
            <button id="closeAuthModal" class="modal-close" type="button" aria-label="Fermer">×</button>
            <div class="modal-header">
                <h2 id="authModalTitle">Connexion</h2>
                <p id="authModalDescription">Connectez-vous à votre compte CAMU SERVICES.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" required autocomplete="email" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Votre mot de passe">
                </div>
                <button type="submit" class="primary-btn full-width">Se connecter</button>
            </form>
            <div class="auth-links">
                <button id="showRegisterBtn" type="button" class="text-btn">Créer un compte</button>
                <button id="forgotPasswordBtn" type="button" class="text-btn">Mot de passe oublié ?</button>
            </div>
        </div>
    </div>


    <!-- =================================================
         MESSAGE GLOBAL (toast)
         ================================================= -->

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>


    <!-- =================================================
         FOOTER (avec lien Admin ajouté)
         ================================================= -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-brand">
                <h2>CAMU SERVICES</h2>
                <p>TROUVER • ACHETER • RÉSERVER</p>
            </div>

            <div class="footer-column">
                <h3>À propos</h3>
                <button type="button" data-footer-action="about">À propos de CAMU SERVICES</button>
                <button type="button" data-footer-action="contact">Contacts</button>
            </div>

            <div class="footer-column">
                <h3>Informations</h3>
                <button type="button" data-footer-action="conditions">Conditions d'utilisation</button>
                <button type="button" data-footer-action="privacy">Confidentialité</button>
                <!-- ✅ NOUVEAU : Lien vers l'administration -->
                <button type="button" data-footer-action="admin">🛡️ Administration</button>
            </div>

        </div>

        <div class="footer-bottom">
            <p>© <span id="currentYear"></span> CAMU SERVICES. Tous droits réservés.</p>
        </div>

    </footer>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script type="module" src="js/app.js"></script>

</body>
</html>
